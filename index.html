<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MK Chess Club Reviews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f3ef;
      --panel: #ffffff;
      --line: #e2dfd8;
      --line-strong: #d4d0c8;
      --ink: #1f1d19;
      --muted: #6d675f;
      --brand: #106d4d;
      --brand-soft: #e7f2ed;
      --warn: #8f5f1d;
      --danger: #8b3434;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow: 0 12px 28px rgba(20, 16, 10, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7f6f2, #f2efe8);
    }

    .app {
      width: min(1200px, 96vw);
      margin: 16px auto 40px;
      display: grid;
      gap: 12px;
    }

    .top {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .top-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: grid;
      gap: 2px;
      line-height: 1;
    }

    .brand small {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--brand);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .login {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .login input {
      width: min(360px, 100%);
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      font: inherit;
      background: #fff;
    }

    .meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .settings-launch { padding-inline: 12px; }

    .pill {
      border: 1px solid #d7d3cb;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      background: #f9f7f2;
      color: #504a42;
      white-space: nowrap;
    }

    .pill.live { background: var(--brand-soft); border-color: #b7d5c7; color: #1e5a44; }

    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 11px;
      border: 1px solid #0e5b41;
      background: #0f6f4e;
      color: #fff;
      padding: 10px 13px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.ghost {
      background: #fff;
      color: #1b5a45;
      border-color: #9dc7b6;
    }

    button.warn {
      background: #8f5f1d;
      border-color: #764f18;
    }

    button.danger {
      background: #8b3434;
      border-color: #6d2727;
    }

    button.mini {
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
    }

    .status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #585148;
      background: #faf8f3;
    }

    .status.ok {
      color: #0f5a41;
      border-color: #acd0c0;
      background: #e3f1ea;
    }

    .status.err {
      color: #7a2626;
      border-color: #deb4b4;
      background: #f8e7e7;
    }

    .status:empty { display: none; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 0.8fr auto;
      gap: 8px;
      align-items: center;
    }

    .settings-grid input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      font: inherit;
      min-width: 0;
    }

    .settings-actions { display: flex; gap: 6px; }

    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .stack { display: grid; gap: 10px; }

    .left-head {
      display: grid;
      gap: 8px;
    }

    .left-head input,
    .left-head select,
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .vol-list {
      display: grid;
      gap: 7px;
      max-height: calc(100vh - 250px);
      overflow: auto;
      padding-right: 2px;
    }

    .vol-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 9px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      cursor: pointer;
    }

    .vol-item.active {
      border-color: #9ec4b4;
      box-shadow: 0 0 0 2px rgba(16, 109, 77, 0.11) inset;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid #d8d2c6;
      background: #f2eee3;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #4c4338;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .vol-item h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .muted { color: var(--muted); font-size: 12px; }

    .score {
      border: 1px solid #ddd5c7;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #5b5247;
      background: #f8f4ea;
      white-space: nowrap;
    }

    .profile {
      display: grid;
      gap: 10px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffef9;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .hero-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .hero-top .avatar { width: 58px; height: 58px; border-radius: 14px; }

    .hero h2 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 30px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }

    .chip {
      border: 1px solid #d9d2c4;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #594f43;
      background: #f8f4ea;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      padding: 9px;
      display: grid;
      gap: 2px;
    }

    .metric .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #736c63; }
    .metric .v { font-size: 19px; font-weight: 800; line-height: 1; }

    .reviews {
      display: grid;
      gap: 8px;
    }

    .review {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .review-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .headline { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .stars { font-size: 13px; letter-spacing: 0.06em; color: #845922; }

    .dialog {
      border: 1px solid var(--line);
      border-radius: 16px;
      width: min(780px, 95vw);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      box-shadow: 0 20px 46px rgba(17, 13, 8, 0.22);
      padding: 0;
    }

    .dialog::backdrop { background: rgba(18, 15, 12, 0.42); }

    .dialog-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .dialog-head h3 { margin: 0; font-size: 20px; }

    .field { display: grid; gap: 5px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #544b40; font-weight: 700; }
    .field textarea { min-height: 115px; resize: vertical; }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bars { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; }

    .bar-track {
      height: 8px;
      border-radius: 999px;
      border: 1px solid #e2dac8;
      background: #f3efe3;
      overflow: hidden;
    }

    .bar-track > span { height: 100%; display: block; background: linear-gradient(90deg, #0f6f4f, #2f8d6b); }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 11px;
      background: #fbfaf6;
      padding: 12px;
      color: #6c665d;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 1080px) {
      .top-row { grid-template-columns: 1fr; }
      .meta { justify-content: flex-start; }
      .login { justify-content: flex-start; flex-wrap: wrap; }
      .layout { grid-template-columns: 1fr; }
      .vol-list { max-height: 320px; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
      .rating-grid { grid-template-columns: 1fr 1fr; }
      .split { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .app { width: 98vw; margin-top: 10px; }
      .hero-top { grid-template-columns: 1fr; }
      .hero-top .actions { justify-content: flex-start; }
      .metric-grid { grid-template-columns: 1fr; }
      .rating-grid { grid-template-columns: 1fr; }
      .dialog { width: 97vw; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <small>MK Chess Club</small>
          <h1>Volunteer Reviews</h1>
        </div>

        <div class="login">
          <input id="emailInput" type="email" placeholder="member@yourdomain.com" />
          <button id="sendLinkBtn" type="button">Send Link</button>
          <button id="signOutBtn" type="button" class="ghost" style="display:none;">Sign Out</button>
        </div>

        <div class="meta">
          <button id="openSettingsBtn" type="button" class="ghost mini settings-launch">Settings</button>
        </div>
      </div>

      <div class="status-row">
        <p id="authStatus" class="status"></p>
      </div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="left-head">
          <input id="searchInput" type="text" placeholder="Search volunteers" />
          <select id="sortSelect">
            <option value="top">Top rated</option>
            <option value="reviews">Most reviewed</option>
            <option value="name">Name A-Z</option>
          </select>
        </div>
        <div id="volunteerList" class="vol-list"></div>
      </aside>

      <section class="panel">
        <div id="profileSurface" class="profile"></div>
      </section>
    </section>

    <dialog id="settingsDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Settings</h3>
          <button type="button" class="ghost mini" data-close="settingsDialog">Close</button>
        </div>
        <div class="settings-grid">
          <input id="supaUrlInput" type="url" placeholder="Supabase URL" />
          <input id="supaKeyInput" type="password" placeholder="Supabase anon key" />
          <input id="allowedDomainInput" type="text" placeholder="Email domain" />
          <div class="settings-actions">
            <button id="connectBtn" type="button" class="mini">Connect</button>
            <button id="demoBtn" type="button" class="mini warn">Demo</button>
          </div>
        </div>
        <p id="backendStatus" class="status"></p>
      </div>
    </dialog>

    <dialog id="reviewDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Write Review</h3>
          <button type="button" class="ghost mini" data-close="reviewDialog">Close</button>
        </div>
        <form id="reviewForm" class="stack">
          <div class="split">
            <div class="field">
              <label for="reviewEventSelect">Event</label>
              <select id="reviewEventSelect" required></select>
            </div>
            <div class="field">
              <label for="reviewVolunteerSelect">Volunteer</label>
              <select id="reviewVolunteerSelect" required></select>
            </div>
          </div>

          <div class="rating-grid">
            <div class="field"><label for="overallRating">Overall</label><select id="overallRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="commRating">Communication</label><select id="commRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="relRating">Reliability</label><select id="relRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="warmRating">Welcoming</label><select id="warmRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="clearRating">Clarity</label><select id="clearRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
          </div>

          <div class="field">
            <label for="reviewTitleInput">Headline</label>
            <input id="reviewTitleInput" type="text" maxlength="110" placeholder="Short summary" />
          </div>
          <div class="field">
            <label for="reviewBodyInput">Review</label>
            <textarea id="reviewBodyInput" maxlength="2000" placeholder="Details"></textarea>
          </div>

          <label class="muted"><input id="truthCheckbox" type="checkbox" /> Real event, truthful review</label>
          <button id="submitReviewBtn" type="submit">Submit Review</button>
          <p id="reviewStatus" class="status"></p>
        </form>
      </div>
    </dialog>

    <dialog id="reportDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Report</h3>
          <button type="button" class="ghost mini" data-close="reportDialog">Close</button>
        </div>
        <form id="reportForm" class="stack">
          <div class="split">
            <div class="field">
              <label for="reportVolunteerSelect">Volunteer</label>
              <select id="reportVolunteerSelect" required></select>
            </div>
            <div class="field">
              <label for="reportEventSelect">Event</label>
              <select id="reportEventSelect"><option value="">No event</option></select>
            </div>
          </div>

          <div class="split">
            <div class="field">
              <label for="reportReasonSelect">Reason</label>
              <select id="reportReasonSelect" required>
                <option value="">-</option>
                <option value="conduct">Conduct</option>
                <option value="safety">Safety</option>
                <option value="bias">Bias</option>
                <option value="absence">No-show</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="reportSeveritySelect">Severity</label>
              <select id="reportSeveritySelect">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="reportDetailsInput">Details</label>
            <textarea id="reportDetailsInput" maxlength="1500" placeholder="Facts and context"></textarea>
          </div>

          <button id="submitReportBtn" class="danger" type="submit">Submit Report</button>
          <p id="reportStatus" class="status"></p>
        </form>
      </div>
    </dialog>

    <dialog id="studioDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Volunteer Studio</h3>
          <button type="button" class="ghost mini" data-close="studioDialog">Close</button>
        </div>

        <div id="studioGate" class="empty"></div>

        <section id="studioContent" style="display:none;">
          <div class="split">
            <form id="profileForm" class="stack">
              <div class="field"><label for="profileDisplayName">Display Name</label><input id="profileDisplayName" type="text" maxlength="80" /></div>
              <div class="field"><label for="profileTagline">Tagline</label><input id="profileTagline" type="text" maxlength="120" /></div>
              <div class="field"><label for="profileAvatarUrl">Avatar URL</label><input id="profileAvatarUrl" type="url" /></div>
              <div class="field"><label for="profileBio">Bio</label><textarea id="profileBio" maxlength="800"></textarea></div>
              <label class="muted"><input id="profileActive" type="checkbox" /> Public profile visible</label>
              <button id="saveProfileBtn" type="submit">Save Profile</button>
              <p id="profileStatus" class="status"></p>
            </form>

            <section class="stack">
              <div id="studioMetrics" class="metric-grid"></div>
              <div class="panel" style="padding:8px; box-shadow:none;"><div class="bars" id="categoryBars"></div></div>
              <div class="panel" style="padding:8px; box-shadow:none;"><div class="bars" id="trendBars"></div></div>
            </section>
          </div>

          <div class="split">
            <section class="stack"><div class="muted">Recent reviews</div><div id="studioRecentReviews" class="reviews"></div></section>
            <section class="stack"><div class="muted">Open reports</div><div id="studioOpenReports" class="reviews"></div></section>
          </div>
        </section>
      </div>
    </dialog>
  </main>

          { id: "rep2", volunteer_id: "v3", status: "resolved", severity: "low", reason: "conduct", details: "Resolved with follow-up.", created_at: "2026-03-20T18:00:00Z" }

      const state = {
        supabase: null,
        authSub: null,
        demoMode: true,
        user: null,
        member: null,
        volunteerLink: null,

      const el = {};

      async function init() {
        cacheEls();
        bindEvents();
        restoreConfig();

      function cacheEls() {
        [
          "emailInput", "sendLinkBtn", "signOutBtn", "supaUrlInput", "supaKeyInput", "allowedDomainInput",
          "openSettingsBtn", "settingsDialog", "connectBtn", "demoBtn", "authStatus", "backendStatus", "searchInput", "sortSelect", "volunteerList", "profileSurface",
          "reviewDialog", "reviewForm", "reviewEventSelect", "reviewVolunteerSelect", "overallRating", "commRating", "relRating", "warmRating", "clearRating",
          "reviewTitleInput", "reviewBodyInput", "truthCheckbox", "submitReviewBtn", "reviewStatus",
          "reportDialog", "reportForm", "reportVolunteerSelect", "reportEventSelect", "reportReasonSelect", "reportSeveritySelect", "reportDetailsInput", "submitReportBtn", "reportStatus",
          "studioDialog", "studioGate", "studioContent", "profileForm", "profileDisplayName", "profileTagline", "profileAvatarUrl", "profileBio", "profileActive", "saveProfileBtn", "profileStatus",
          "studioMetrics", "categoryBars", "trendBars", "studioRecentReviews", "studioOpenReports"
        ].forEach(function (id) { el[id] = document.getElementById(id); });
      }

      function bindEvents() {
        el.openSettingsBtn.addEventListener("click", function () {
          if (!el.settingsDialog.open) el.settingsDialog.showModal();
        });
        el.connectBtn.addEventListener("click", onConnectClick);
        el.demoBtn.addEventListener("click", onDemoClick);
        el.sendLinkBtn.addEventListener("click", onSendMagicLink);
        el.signOutBtn.addEventListener("click", onSignOut);
        el.searchInput.addEventListener("input", renderVolunteerList);
        el.sortSelect.addEventListener("change", renderVolunteerList);
        el.volunteerList.addEventListener("click", onVolunteerClick);
        el.profileSurface.addEventListener("click", onProfileClick);
        el.reviewEventSelect.addEventListener("change", renderReviewVolunteerOptions);
        el.reviewForm.addEventListener("submit", onSubmitReview);
        el.reportForm.addEventListener("submit", onSubmitReport);

        document.addEventListener("click", onGlobalClick);
      }

      function onGlobalClick(event) {
        const close = event.target.closest("[data-close]");
        if (!close) return;
        const id = close.getAttribute("data-close");
        if (id && el[id] && typeof el[id].close === "function") {
          el[id].close();
        }
      }

      function restoreConfig() {
        const savedUrl = localStorage.getItem(STORAGE.url);
        const savedKey = localStorage.getItem(STORAGE.key);
        el.supaUrlInput.value = savedUrl || DEFAULT_SUPABASE.url;
        el.supaKeyInput.value = savedKey || DEFAULT_SUPABASE.anonKey;
        el.allowedDomainInput.value = localStorage.getItem(STORAGE.domain) || "";
        if (!savedUrl) localStorage.setItem(STORAGE.url, DEFAULT_SUPABASE.url);
        if (!savedKey) localStorage.setItem(STORAGE.key, DEFAULT_SUPABASE.anonKey);
      }

      async function onConnectClick() {
        localStorage.setItem(STORAGE.url, (el.supaUrlInput.value || DEFAULT_SUPABASE.url).trim());
        localStorage.setItem(STORAGE.key, (el.supaKeyInput.value || DEFAULT_SUPABASE.anonKey).trim());
        localStorage.setItem(STORAGE.domain, normalizeDomain(el.allowedDomainInput.value || ""));
        await connectWithStoredConfig();
        await refreshSession();
        await loadAllData();
        renderAll();
        if (!state.demoMode && el.settingsDialog.open) {
          el.settingsDialog.close();
        }
      }

      async function onDemoClick() {
        state.demoMode = true;
        state.supabase = null;
        detachAuthSubscription();
        state.user = null;
        state.member = null;
        state.volunteerLink = null;
        state.helpfulVotedIds = {};
        setStatus(el.backendStatus, "Backend: demo mode", "ok");
        await loadAllData();
        renderAll();
        if (el.settingsDialog.open) {
          el.settingsDialog.close();
        }
      }

      async function connectWithStoredConfig() {
        const url = (localStorage.getItem(STORAGE.url) || DEFAULT_SUPABASE.url).trim();
        const key = (localStorage.getItem(STORAGE.key) || DEFAULT_SUPABASE.anonKey).trim();

        if (!url || !key) {
          state.demoMode = true;
          state.supabase = null;
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          setStatus(el.backendStatus, "Backend: no credentials (demo)", "err");
          return;
        }

        try {
          state.supabase = window.supabase.createClient(url, key, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          });
          state.demoMode = false;
          attachAuthSubscription();
          setStatus(el.backendStatus, "Backend: connected (" + DEFAULT_SUPABASE.projectId + ")", "ok");
        } catch (_err) {
          state.demoMode = true;
          state.supabase = null;
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          setStatus(el.backendStatus, "Backend: connection failed (demo)", "err");
        }
      }

      function attachAuthSubscription() {
        detachAuthSubscription();
        state.authSub = state.supabase.auth.onAuthStateChange(async function (_event, session) {
          state.user = session ? session.user : null;
          state.helpfulVotedIds = {};
          await loadMemberProfile();
          await loadVolunteerLink();
          await loadAllData();
          renderAll();
        });
      }

      function detachAuthSubscription() {
        if (state.authSub && state.authSub.data && state.authSub.data.subscription) {
          state.authSub.data.subscription.unsubscribe();
        }
        state.authSub = null;
      }

      async function refreshSession() {
        if (state.demoMode || !state.supabase) {
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          return;
        }

        const sessionResp = await state.supabase.auth.getSession();
        state.user = sessionResp.data && sessionResp.data.session ? sessionResp.data.session.user : null;
        state.helpfulVotedIds = {};
        await loadMemberProfile();
        await loadVolunteerLink();
      }

      async function loadMemberProfile() {
        if (state.demoMode) {
          state.member = state.user ? DEMO.member : null;
          return;
        }

        state.member = null;
        if (!state.user) return;

        const resp = await state.supabase
          .from("member_profiles")
          .select("display_name,status,role,trust_score,created_at")
          .eq("user_id", state.user.id)
          .maybeSingle();

        if (resp.error) {
          state.member = {
            display_name: state.user.email || "Member",
            status: "pending",
            role: "member",
            trust_score: 1.0,
            created_at: new Date().toISOString()
          };
          return;
        }

        state.member = resp.data || {
          display_name: state.user.email || "Member",
          status: "pending",
          role: "member",
          trust_score: 1.0,
          created_at: new Date().toISOString()
        };
      }

      async function loadVolunteerLink() {
        if (state.demoMode) {
          state.volunteerLink = state.user ? DEMO.volunteerLink : null;
          return;
        }

        state.volunteerLink = null;
        if (!state.user) return;

        let found = null;

        const direct = await state.supabase.from("volunteers").select("id").eq("user_id", state.user.id).maybeSingle();
        if (!direct.error && direct.data && direct.data.id) {
          found = { volunteer_id: direct.data.id, source: "volunteers.user_id" };
        }

        if (!found) {
          const mapped = await state.supabase.from("volunteer_accounts").select("volunteer_id").eq("user_id", state.user.id).maybeSingle();
          if (!mapped.error && mapped.data && mapped.data.volunteer_id) {
            found = { volunteer_id: mapped.data.volunteer_id, source: "volunteer_accounts" };
          }
        }

        if (!found) {
          const profileMap = await state.supabase.from("member_profiles").select("volunteer_id").eq("user_id", state.user.id).maybeSingle();
          if (!profileMap.error && profileMap.data && profileMap.data.volunteer_id) {
            found = { volunteer_id: profileMap.data.volunteer_id, source: "member_profiles.volunteer_id" };
          }
        }

        state.volunteerLink = found;
      }

      async function loadAllData() {
        if (state.demoMode) {
          state.volunteers = DEMO.volunteers.slice();
          state.events = DEMO.events.slice();
          state.eventVolunteerMap = JSON.parse(JSON.stringify(DEMO.eventVolunteerMap));
          state.reviews = DEMO.reviews.slice();
          state.reports = DEMO.reports.slice();
          if (!state.selectedVolunteerId && state.volunteers[0]) state.selectedVolunteerId = state.volunteers[0].id;
          return;
        }

        await loadVolunteers();
        await Promise.all([loadReviews(), loadReports(), loadReviewEvents(), loadHelpfulVotes()]);

        if (!state.selectedVolunteerId && state.volunteers[0]) {
          state.selectedVolunteerId = state.volunteers[0].id;
        }
      }

      async function loadVolunteers() {
        let resp = await state.supabase
          .from("volunteers")
          .select("id,display_name,tagline,bio,avatar_url,active")
          .eq("active", true)
          .order("display_name", { ascending: true });

        if (resp.error) {
          resp = await state.supabase
            .from("volunteers")
            .select("id,display_name,bio,avatar_url,active")
            .eq("active", true)
            .order("display_name", { ascending: true });
        }

        if (resp.error) {
          state.volunteers = [];
          setStatus(el.backendStatus, "Data load issue: volunteers", "err");
          return;
        }

        state.volunteers = resp.data || [];
      }

      async function loadReviews() {
        const resp = await state.supabase
          .from("reviews")
          .select("id,volunteer_id,event_id,overall_rating,communication_rating,reliability_rating,warmth_rating,clarity_rating,title,body,helpful_count,moderation_status,status,authenticity_score,reviewer_weight,created_at,volunteers(display_name),club_events(title,starts_at)")
          .order("created_at", { ascending: false })
          .limit(400);

        if (resp.error) {
          state.reviews = [];
          setStatus(el.backendStatus, "Data load issue: reviews", "err");
          return;
        }

        state.reviews = (resp.data || []).filter(function (row) {
          const st = row.moderation_status || row.status || "published";
          return st === "published";
        });
      }

      async function loadReports() {
        const resp = await state.supabase
          .from("volunteer_reports")
          .select("id,volunteer_id,status,severity,reason,details,created_at")
          .order("created_at", { ascending: false })
          .limit(200);

        if (resp.error) {
          state.reports = [];
          setStatus(el.backendStatus, "Data load issue: reports", "err");
          return;
        }

        state.reports = resp.data || [];
      }

      async function loadHelpfulVotes() {
        if (state.demoMode || !state.supabase || !state.user) {
          state.helpfulVotedIds = {};
          return;
        }

        const resp = await state.supabase
          .from("review_helpfulness")
          .select("review_id,vote")
          .eq("voter_user_id", state.user.id)
          .gt("vote", 0)
          .limit(1000);

        if (resp.error) return;

        const map = {};
        (resp.data || []).forEach(function (row) {
          if (row.review_id != null) map[String(row.review_id)] = true;
        });
        state.helpfulVotedIds = map;
      }
      async function loadReviewEvents() {
        state.events = [];
        state.eventVolunteerMap = {};

        if (!state.user || !state.member || state.member.status !== "approved") {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);

          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const attendance = await state.supabase
          .from("event_attendance")
          .select("event_id,verified,club_events(id,title,starts_at)")
          .eq("member_user_id", state.user.id)
          .eq("verified", true);

        if (attendance.error) {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);
          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const map = {};
        (attendance.data || []).forEach(function (row) {
          if (row.club_events && row.club_events.id) map[row.club_events.id] = row.club_events;
        });
        state.events = Object.values(map);

        if (!state.events.length) {
          wireAllVolunteersToEvents();
          return;
        }

        const ids = state.events.map(function (e) { return e.id; });
        const shifts = await state.supabase.from("volunteer_event_shifts").select("event_id,volunteer_id").in("event_id", ids);

        if (!shifts.error) {
          (shifts.data || []).forEach(function (row) {
            if (!state.eventVolunteerMap[row.event_id]) state.eventVolunteerMap[row.event_id] = [];
            state.eventVolunteerMap[row.event_id].push(row.volunteer_id);
          });
        }

        if (!Object.keys(state.eventVolunteerMap).length) wireAllVolunteersToEvents();
      }

      function wireAllVolunteersToEvents() {
        const ids = state.volunteers.map(function (v) { return v.id; });
        state.events.forEach(function (ev) { state.eventVolunteerMap[ev.id] = ids.slice(); });
      }

      async function onSendMagicLink() {
        if (state.user) {
          setStatus(el.authStatus, "Already signed in.", "ok");
          return;
        }

        const email = (el.emailInput.value || "").trim().toLowerCase();
        if (!email || email.indexOf("@") < 0) {
          setStatus(el.authStatus, "Enter valid email.", "err");
          return;
        }

        const domain = normalizeDomain(localStorage.getItem(STORAGE.domain) || "");
        if (domain && !email.endsWith("@" + domain)) {
          setStatus(el.authStatus, "Use @" + domain, "err");
          return;
        }

        if (state.demoMode || !state.supabase) {
          setStatus(el.authStatus, "Connect backend first.", "err");
          setStatus(el.backendStatus, "Open Settings and connect Supabase.", "err");
          if (el.settingsDialog && typeof el.settingsDialog.showModal === "function" && !el.settingsDialog.open) {
            el.settingsDialog.showModal();
          }
          return;
        }

        el.sendLinkBtn.disabled = true;
        try {
          const redirect = window.location.origin + window.location.pathname;
          const resp = await state.supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirect } });
          if (resp.error) {
            setStatus(el.authStatus, "Login failed. Check settings/domain.", "err");
            return;
          }
          setStatus(el.authStatus, "Login link sent. Check your inbox.", "ok");
        } catch (_err) {
          setStatus(el.authStatus, "Login failed. Network error.", "err");
        } finally {
          el.sendLinkBtn.disabled = false;
        }
      }

      async function onSignOut() {
        if (!state.demoMode && state.supabase) await state.supabase.auth.signOut();
        state.user = null;
        state.member = null;
        state.volunteerLink = null;
        state.helpfulVotedIds = {};
        clearStatus(el.authStatus);
        await loadAllData();
        renderAll();
      }

      function onVolunteerClick(event) {
        const item = event.target.closest("[data-volunteer]");
        if (!item) return;
        state.selectedVolunteerId = item.getAttribute("data-volunteer");
        renderVolunteerList();
        renderProfile();
      }

      function onProfileClick(event) {
        const action = event.target.closest("[data-action]");
        if (!action) {
          const helpful = event.target.closest("[data-helpful]");
          if (helpful) markHelpful(helpful.getAttribute("data-helpful"));
          return;
        }

        const type = action.getAttribute("data-action");
        if (type === "review") {
          openReviewDialog();
        } else if (type === "report") {
          openReportDialog();
        } else if (type === "studio") {
          openStudioDialog();
        }
      }

      function openReviewDialog() {
        renderReviewSelectors();
        if (state.selectedVolunteerId) el.reviewVolunteerSelect.value = state.selectedVolunteerId;
        const canSubmit = memberApproved() && state.events.length > 0 && state.volunteers.length > 0;
        el.submitReviewBtn.disabled = !canSubmit;
        if (canSubmit) {
          clearStatus(el.reviewStatus);
        } else {
          setStatus(el.reviewStatus, memberApproved() ? "No eligible events available." : "Approved member required.", "err");
        }
        if (!el.reviewDialog.open) el.reviewDialog.showModal();
      }

      function openReportDialog() {
        renderReportSelectors();
        if (state.selectedVolunteerId) el.reportVolunteerSelect.value = state.selectedVolunteerId;
        const canSubmit = memberApproved() && state.volunteers.length > 0;
        el.submitReportBtn.disabled = !canSubmit;
        if (canSubmit) {
          clearStatus(el.reportStatus);
        } else {
          setStatus(el.reportStatus, memberApproved() ? "No volunteers available." : "Approved member required.", "err");
        }
        if (!el.reportDialog.open) el.reportDialog.showModal();
      }

      function openStudioDialog() {
        renderStudio();
        if (!el.studioDialog.open) el.studioDialog.showModal();
      }

      function memberApproved() {
        return !!(state.user && state.member && state.member.status === "approved");
      }

      async function onSubmitReview(event) {
        event.preventDefault();
        if (!memberApproved()) {
          setStatus(el.reviewStatus, "Approved member required.", "err");
          return;
        }

        const payload = collectReview();
        if (!payload.ok) {
          setStatus(el.reviewStatus, payload.message, "err");
          return;
        }

        const signal = computeAuthenticity(payload.review);
        const moderationStatus = signal.score >= 50 ? "pending" : "published";
        const reviewerWeight = computeReviewerWeight(signal.score);

        if (state.demoMode) {
          const newReview = Object.assign({}, payload.review, {
            id: "demo-" + Math.random().toString(16).slice(2),
            moderation_status: moderationStatus,
            authenticity_score: signal.score,
            reviewer_weight: reviewerWeight,
            helpful_count: 0,
            created_at: new Date().toISOString()
          });
          state.reviews.unshift(newReview);
          DEMO.reviews.unshift(newReview);
          setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Queued for moderation.", moderationStatus === "published" ? "ok" : "err");
          el.reviewForm.reset();
          if (el.reviewDialog.open) el.reviewDialog.close();
          renderAll();
          return;
        }

        const duplicate = await state.supabase.from("reviews")
          .select("id")
          .eq("reviewer_user_id", state.user.id)
          .eq("volunteer_id", payload.review.volunteer_id)
          .eq("event_id", payload.review.event_id)
          .limit(1);

        if (duplicate.error) {
          setStatus(el.reviewStatus, "Could not verify duplicate rule.", "err");
          return;
        }

        if (!duplicate.error && (duplicate.data || []).length > 0) {
          setStatus(el.reviewStatus, "Already reviewed this event.", "err");
          return;
        }

        const dayStart = new Date();
        dayStart.setHours(0, 0, 0, 0);
        const limitResp = await state.supabase.from("reviews")
          .select("id", { count: "exact", head: true })
          .eq("reviewer_user_id", state.user.id)
          .gte("created_at", dayStart.toISOString());

        if (limitResp.error) {
          setStatus(el.reviewStatus, "Could not verify daily limit.", "err");
          return;
        }

        if (!limitResp.error && (limitResp.count || 0) >= 4) {
          setStatus(el.reviewStatus, "Daily limit reached.", "err");
          return;
        }

        let insert = {
          volunteer_id: payload.review.volunteer_id,
          event_id: payload.review.event_id,
          reviewer_user_id: state.user.id,
          overall_rating: payload.review.overall_rating,
          communication_rating: payload.review.communication_rating,
          reliability_rating: payload.review.reliability_rating,
          warmth_rating: payload.review.warmth_rating,
          clarity_rating: payload.review.clarity_rating,
          title: payload.review.title,
          body: payload.review.body,
          moderation_status: moderationStatus,
          authenticity_score: signal.score,
          authenticity_flags: signal.flags,
          reviewer_weight: reviewerWeight
        };

        let resp = await state.supabase.from("reviews").insert(insert).select().maybeSingle();
        if (resp.error) {
          const fallback = Object.assign({}, insert);
          delete fallback.moderation_status;
          delete fallback.authenticity_score;
          delete fallback.authenticity_flags;
          delete fallback.reviewer_weight;
          fallback.status = moderationStatus;
          resp = await state.supabase.from("reviews").insert(fallback).select().maybeSingle();
        }

        if (resp.error) {
          setStatus(el.reviewStatus, "Submit failed. Please try again.", "err");
          return;
        }

        setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Queued for moderation.", moderationStatus === "published" ? "ok" : "err");
        el.reviewForm.reset();
        if (el.reviewDialog.open) el.reviewDialog.close();
        await loadAllData();
        renderAll();
      }

      function collectReview() {
        const review = {
          event_id: (el.reviewEventSelect.value || "").trim(),
          volunteer_id: (el.reviewVolunteerSelect.value || "").trim(),
          overall_rating: Number(el.overallRating.value || 0),
          communication_rating: Number(el.commRating.value || 0),
          reliability_rating: Number(el.relRating.value || 0),
          warmth_rating: Number(el.warmRating.value || 0),
          clarity_rating: Number(el.clearRating.value || 0),
          title: (el.reviewTitleInput.value || "").trim(),
          body: (el.reviewBodyInput.value || "").trim()
        };

        if (!review.event_id || !review.volunteer_id) return { ok: false, message: "Choose event + volunteer." };
        if (!review.overall_rating || !review.communication_rating || !review.reliability_rating || !review.warmth_rating || !review.clarity_rating) return { ok: false, message: "Complete all ratings." };
        if (review.title.length < 6) return { ok: false, message: "Add headline." };
        if (review.body.length < 80) return { ok: false, message: "Review needs 80+ chars." };
        if ((review.overall_rating === 1 || review.overall_rating === 5) && review.body.length < 120) return { ok: false, message: "1-star/5-star needs 120+ chars." };
        if (!el.truthCheckbox.checked) return { ok: false, message: "Confirm checkbox." };
        return { ok: true, review: review };
      }

      async function onSubmitReport(event) {
        event.preventDefault();
        if (!memberApproved()) {
          setStatus(el.reportStatus, "Approved member required.", "err");
          return;
        }

        const volunteerId = (el.reportVolunteerSelect.value || "").trim();
        const eventId = (el.reportEventSelect.value || "").trim();
        const reason = (el.reportReasonSelect.value || "").trim();
        const severity = (el.reportSeveritySelect.value || "medium").trim();
        const details = (el.reportDetailsInput.value || "").trim();

        if (!volunteerId || !reason) { setStatus(el.reportStatus, "Choose volunteer + reason.", "err"); return; }
        if (details.length < 50) { setStatus(el.reportStatus, "Add at least 50 chars.", "err"); return; }

        if (state.demoMode) {
          const newReport = { id: "demo-report-" + Math.random().toString(16).slice(2), volunteer_id: volunteerId, status: "open", severity: severity, reason: reason, details: details, created_at: new Date().toISOString() };
          state.reports.unshift(newReport);
          DEMO.reports.unshift(newReport);
          setStatus(el.reportStatus, "Report submitted.", "ok");
          el.reportForm.reset();
          if (el.reportDialog.open) el.reportDialog.close();
          renderAll();
          return;
        }

        const resp = await state.supabase.from("volunteer_reports").insert({ volunteer_id: volunteerId, event_id: eventId || null, reporter_user_id: state.user.id, reason: reason, severity: severity, details: details, status: "open" });
        if (resp.error) {
          setStatus(el.reportStatus, "Report failed.", "err");
          return;
        }

        setStatus(el.reportStatus, "Report submitted.", "ok");
        el.reportForm.reset();
        if (el.reportDialog.open) el.reportDialog.close();
        await loadAllData();
        renderAll();
      }
      async function markHelpful(reviewId) {
        if (!reviewId) return;
        if (hasVotedHelpful(reviewId)) return;
        const target = state.reviews.find(function (r) { return String(r.id) === String(reviewId); });
        if (!target) return;

        if (state.demoMode) {
          state.helpfulVotedIds[String(reviewId)] = true;
          target.helpful_count = Number(target.helpful_count || 0) + 1;
          renderProfile();
          renderStudio();
          return;
        }

        if (!state.user) {
          setStatus(el.authStatus, "Sign in to vote.", "err");
          return;
        }

        const existing = await state.supabase
          .from("review_helpfulness")
          .select("vote")
          .eq("review_id", reviewId)
          .eq("voter_user_id", state.user.id)
          .maybeSingle();

        if (!existing.error && existing.data && Number(existing.data.vote || 0) > 0) {
          state.helpfulVotedIds[String(reviewId)] = true;
          renderProfile();
          return;
        }

        const resp = await state.supabase
          .from("review_helpfulness")
          .upsert({ review_id: reviewId, voter_user_id: state.user.id, vote: 1 }, { onConflict: "review_id,voter_user_id" });

        if (resp.error) {
          setStatus(el.authStatus, "Vote failed.", "err");
          return;
        }

        state.helpfulVotedIds[String(reviewId)] = true;
        target.helpful_count = Number(target.helpful_count || 0) + 1;
        renderProfile();
        renderStudio();
      }

      async function onSaveProfile(event) {
        event.preventDefault();

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          setStatus(el.profileStatus, "No linked profile.", "err");
          return;
        }

        const payload = {
          display_name: (el.profileDisplayName.value || "").trim(),
          tagline: (el.profileTagline.value || "").trim(),
          avatar_url: (el.profileAvatarUrl.value || "").trim(),
          bio: (el.profileBio.value || "").trim(),
          active: !!el.profileActive.checked
        };

        if (!payload.display_name) {
          setStatus(el.profileStatus, "Display name required.", "err");
          return;
        }

        if (state.demoMode) {
          const idx = state.volunteers.findIndex(function (v) { return v.id === state.volunteerLink.volunteer_id; });
          if (idx >= 0) state.volunteers[idx] = Object.assign({}, state.volunteers[idx], payload);
          const dIdx = DEMO.volunteers.findIndex(function (v) { return v.id === state.volunteerLink.volunteer_id; });
          if (dIdx >= 0) DEMO.volunteers[dIdx] = Object.assign({}, DEMO.volunteers[dIdx], payload);
          setStatus(el.profileStatus, "Saved.", "ok");
          renderAll();
          return;
        }

        let resp = await state.supabase.from("volunteers").update(payload).eq("id", state.volunteerLink.volunteer_id).select().maybeSingle();
        if (resp.error) {
          const fallback = { display_name: payload.display_name, avatar_url: payload.avatar_url, bio: payload.bio, active: payload.active };
          resp = await state.supabase.from("volunteers").update(fallback).eq("id", state.volunteerLink.volunteer_id).select().maybeSingle();
        }

        if (resp.error) {
          setStatus(el.profileStatus, "Save failed.", "err");
          return;
        }

        setStatus(el.profileStatus, "Saved.", "ok");
        await loadAllData();
        renderAll();
      }

      function renderAll() {
        renderHeader();
        renderReviewSelectors();
        renderReportSelectors();
        renderVolunteerList();
        renderProfile();
        renderStudio();
      }

      function renderHeader() {
        el.signOutBtn.style.display = state.user ? "" : "none";
        if (!state.user) {
          clearStatus(el.authStatus);
          return;
        }

        const name = state.member && state.member.display_name ? state.member.display_name : (state.user.email || "Member");
        if (memberApproved()) {
          setStatus(el.authStatus, "Signed in: " + name, "ok");
        } else {
          setStatus(el.authStatus, "Signed in: " + name + " (approval required to submit)", "err");
        }
      }

      function renderVolunteerList() {
        const search = (el.searchInput.value || "").trim().toLowerCase();
        const sort = (el.sortSelect.value || "top").trim();

        const list = state.volunteers
          .filter(function (v) {
            const blob = ((v.display_name || "") + " " + (v.tagline || "") + " " + (v.bio || "")).toLowerCase();
            return !search || blob.indexOf(search) >= 0;
          })
          .map(function (v) { return { volunteer: v, stats: volunteerStats(v.id) }; });

        list.sort(function (a, b) {
          if (sort === "reviews") return b.stats.reviewCount - a.stats.reviewCount;
          if (sort === "name") return (a.volunteer.display_name || "").localeCompare(b.volunteer.display_name || "");
          return b.stats.score - a.stats.score;
        });

        if (!list.length) {
          el.volunteerList.innerHTML = '<div class="empty">No volunteers</div>';
          return;
        }

        const ids = list.map(function (x) { return x.volunteer.id; });
        if (!ids.includes(state.selectedVolunteerId)) state.selectedVolunteerId = ids[0];

        el.volunteerList.innerHTML = list.map(function (row) {
          const v = row.volunteer;
          const s = row.stats;
          return '<article class="vol-item ' + (state.selectedVolunteerId === v.id ? "active" : "") + '" data-volunteer="' + esc(v.id) + '">' +
            avatarHtml(v, 40) +
            '<div><h3>' + esc(v.display_name || "Volunteer") + '</h3><div class="muted">' + stars(s.avgRating) + ' ' + s.avgRating.toFixed(2) + ' · ' + s.reviewCount + '</div></div>' +
            '<span class="score">Rep ' + Math.round(s.score) + '</span>' +
          '</article>';
        }).join("");
      }

      function renderProfile() {
        const volunteer = state.volunteers.find(function (v) { return v.id === state.selectedVolunteerId; });
        if (!volunteer) {
          el.profileSurface.innerHTML = '<div class="empty">Select a volunteer</div>';
          return;
        }

        const stats = volunteerStats(volunteer.id);
        const reviews = reviewsForVolunteer(volunteer.id);

        const reviewHtml = reviews.slice(0, 8).map(function (r) {
          const alreadyVoted = hasVotedHelpful(r.id);
          const voteLabel = alreadyVoted ? "Voted" : ("Helpful " + Number(r.helpful_count || 0));
          return '<article class="review">' +
            '<div class="review-head"><div><div class="stars">' + stars(r.overall_rating) + '</div><div class="headline">' + esc(r.title || "Review") + '</div><div class="muted">' + relDate(r.created_at) + '</div></div><button class="mini ghost" type="button" data-helpful="' + esc(r.id) + '"' + (alreadyVoted ? " disabled" : "") + ">" + voteLabel + '</button></div>' +
            '<div>' + esc(r.body || "") + '</div>' +
          '</article>';
        }).join("");

        el.profileSurface.innerHTML =
          '<section class="hero">' +
            '<div class="hero-top">' +
              avatarHtml(volunteer, 58) +
              '<div><h2>' + esc(volunteer.display_name || "Volunteer") + '</h2><div class="muted">' + esc(volunteer.tagline || volunteer.bio || "") + '</div></div>' +
              '<div class="actions"><button class="mini" type="button" data-action="review">Review</button><button class="mini ghost" type="button" data-action="report">Report</button><button class="mini ghost" type="button" data-action="studio">Studio</button></div>' +
            '</div>' +
            '<div class="chips"><span class="chip">' + stars(stats.avgRating) + ' ' + stats.avgRating.toFixed(2) + '</span><span class="chip">' + stats.reviewCount + ' reviews</span><span class="chip">Rep ' + Math.round(stats.score) + '</span><span class="chip">Confidence ' + stats.confidence + '%</span></div>' +
          '</section>' +
          '<section class="metric-grid">' +
            metricBox("Rating", stats.avgRating.toFixed(2)) +
            metricBox("Positive", stats.positiveRate + "%") +
            metricBox("Helpful", String(stats.helpfulTotal)) +
            metricBox("Open reports", String(stats.openReports)) +
          '</section>' +
          '<section class="reviews">' + (reviewHtml || '<div class="empty">No reviews yet</div>') + '</section>';
      }

      function renderReviewSelectors() {
        const events = state.events.slice().sort(function (a, b) { return new Date(b.starts_at) - new Date(a.starts_at); });
        el.reviewEventSelect.innerHTML = '<option value="">Event</option>' + events.map(function (ev) {
          return '<option value="' + esc(ev.id) + '">' + esc(ev.title || "Event") + ' · ' + formatDate(ev.starts_at) + '</option>';
        }).join("");
        renderReviewVolunteerOptions();
      }

      function renderReviewVolunteerOptions() {
        const eventId = (el.reviewEventSelect.value || "").trim();
        const allowed = eventId ? (state.eventVolunteerMap[eventId] || []) : state.volunteers.map(function (v) { return v.id; });
        const options = state.volunteers.filter(function (v) { return allowed.includes(v.id); });
        el.reviewVolunteerSelect.innerHTML = '<option value="">Volunteer</option>' + options.map(function (v) {
          return '<option value="' + esc(v.id) + '">' + esc(v.display_name || "Volunteer") + '</option>';
        }).join("");
        if (state.selectedVolunteerId && options.some(function (v) { return v.id === state.selectedVolunteerId; })) {
          el.reviewVolunteerSelect.value = state.selectedVolunteerId;
        }
      }

      function renderReportSelectors() {
        el.reportVolunteerSelect.innerHTML = '<option value="">Volunteer</option>' + state.volunteers.map(function (v) {
          return '<option value="' + esc(v.id) + '">' + esc(v.display_name || "Volunteer") + '</option>';
        }).join("");
        el.reportEventSelect.innerHTML = '<option value="">No event</option>' + state.events.map(function (ev) {
          return '<option value="' + esc(ev.id) + '">' + esc(ev.title || "Event") + ' · ' + formatDate(ev.starts_at) + '</option>';
        }).join("");
        if (state.selectedVolunteerId) el.reportVolunteerSelect.value = state.selectedVolunteerId;
      }

      function renderStudio() {
        if (!state.user) {
          el.studioGate.textContent = "Sign in to open Studio.";
          el.studioContent.style.display = "none";
          return;
        }

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          el.studioGate.textContent = "No volunteer profile linked.";
          el.studioContent.style.display = "none";
          return;
        }

        const volunteer = state.volunteers.find(function (v) { return v.id === state.volunteerLink.volunteer_id; });
        if (!volunteer) {
          el.studioGate.textContent = "Linked profile not found.";
          el.studioContent.style.display = "none";
          return;
        }

        el.studioGate.textContent = "";
        el.studioContent.style.display = "grid";

        el.profileDisplayName.value = volunteer.display_name || "";
        el.profileTagline.value = volunteer.tagline || "";
        el.profileAvatarUrl.value = volunteer.avatar_url || "";
        el.profileBio.value = volunteer.bio || "";
        el.profileActive.checked = volunteer.active !== false;

        const stats = volunteerStats(volunteer.id);
        el.studioMetrics.innerHTML = metricBox("Avg", stats.avgRating.toFixed(2)) + metricBox("Reviews", String(stats.reviewCount)) + metricBox("Helpful", String(stats.helpfulTotal)) + metricBox("Open", String(stats.openReports));

        renderCategoryBars(volunteer.id);
        renderTrendBars(volunteer.id);

        const recent = reviewsForVolunteer(volunteer.id).slice(0, 6);
        el.studioRecentReviews.innerHTML = recent.length ? recent.map(function (r) {
          return '<article class="review"><div class="stars">' + stars(r.overall_rating) + '</div><div class="headline">' + esc(r.title || "Review") + '</div><div class="muted">' + relDate(r.created_at) + '</div><div>' + esc(r.body || "") + '</div></article>';
        }).join("") : '<div class="empty">No reviews</div>';

        const openReports = state.reports.filter(function (rp) { return rp.volunteer_id === volunteer.id && (rp.status === "open" || rp.status === "investigating"); });
        el.studioOpenReports.innerHTML = openReports.length ? openReports.map(function (rp) {
          return '<article class="review"><div class="headline">' + esc((rp.reason || "report").toUpperCase()) + ' · ' + esc(rp.severity || "medium") + '</div><div class="muted">' + relDate(rp.created_at) + '</div><div>' + esc(rp.details || "") + '</div></article>';
        }).join("") : '<div class="empty">No open reports</div>';
      }

      function renderCategoryBars(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const cats = [
          { label: "Overall", key: "overall_rating" },
          { label: "Comm", key: "communication_rating" },
          { label: "Reliability", key: "reliability_rating" },
          { label: "Welcoming", key: "warmth_rating" },
          { label: "Clarity", key: "clarity_rating" }
        ];

        el.categoryBars.innerHTML = cats.map(function (cat) {
          const avg = mean(rows.map(function (r) { return Number(r[cat.key] || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="muted">' + esc(cat.label) + '</div><div class="bar-track"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="muted">' + (avg ? avg.toFixed(2) : "0.00") + '</div></div>';
        }).join("");
      }

      function renderTrendBars(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const months = [];
        const now = new Date();
        for (let i = 5; i >= 0; i -= 1) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          months.push({
            key: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"),
            label: d.toLocaleDateString(undefined, { month: "short" })
          });
        }

        el.trendBars.innerHTML = months.map(function (m) {
          const monthRows = rows.filter(function (r) {
            const d = new Date(r.created_at);
            const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            return key === m.key;
          });
          const avg = mean(monthRows.map(function (r) { return Number(r.overall_rating || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="muted">' + esc(m.label) + '</div><div class="bar-track"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="muted">' + (avg ? avg.toFixed(2) : "-") + '</div></div>';
        }).join("");
      }

      function reviewsForVolunteer(volunteerId) {
        return publishedReviews().filter(function (r) { return r.volunteer_id === volunteerId; }).sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      }

      function volunteerStats(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const openReports = state.reports.filter(function (rp) { return rp.volunteer_id === volunteerId && (rp.status === "open" || rp.status === "investigating"); }).length;
        const reviewCount = rows.length;
        const helpfulTotal = rows.reduce(function (sum, r) { return sum + Number(r.helpful_count || 0); }, 0);

        const globalMean = mean(publishedReviews().map(function (r) { return Number(r.overall_rating || 0); })) || 4;
        const m = 8;
        let weightedSum = 0;
        let weightTotal = 0;
        rows.forEach(function (r) {
          const rating = Number(r.overall_rating || 0);
          const weight = Number(r.reviewer_weight || 1);
          if (rating > 0 && weight > 0) {
            weightedSum += rating * weight;
            weightTotal += weight;
          }
        });

        const avgRating = weightTotal > 0 ? weightedSum / weightTotal : globalMean;
        const bayesian = ((weightTotal / (weightTotal + m)) * avgRating) + ((m / (weightTotal + m)) * globalMean);
        const score = clamp((((bayesian - 1) / 4) * 100) - (openReports * 4.5), 0, 100);
        const confidence = clamp(Math.round((weightTotal / (weightTotal + 9)) * 100), 5, 99);
        const positives = rows.filter(function (r) { return Number(r.overall_rating || 0) >= 4; }).length;
        const positiveRate = reviewCount ? Math.round((positives / reviewCount) * 100) : 0;

        return { avgRating: avgRating || 0, reviewCount: reviewCount, score: score, confidence: confidence, openReports: openReports, helpfulTotal: helpfulTotal, positiveRate: positiveRate };
      }

      function publishedReviews() {
        return state.reviews.filter(function (row) {
          const st = row.moderation_status || row.status || "published";
          return st === "published";
        });
      }

      function computeAuthenticity(review) {
        const flags = [];
        let score = 0;
        const body = review.body || "";
        const words = body.split(/\s+/).filter(Boolean);

        if (body.length < 100) { flags.push("short-detail"); score += 12; }
        if ((body.match(/[A-Z]/g) || []).length / ((body.match(/[A-Za-z]/g) || []).length || 1) > 0.35) { flags.push("high-caps"); score += 16; }
        if ((body.match(/https?:\/\/|www\./gi) || []).length > 1) { flags.push("many-links"); score += 20; }
        if (/(.)\1{6,}/.test(body)) { flags.push("repeat-chars"); score += 18; }
        if (words.length > 20) {
          const unique = new Set(words.map(function (w) { return w.toLowerCase(); }));
          if (unique.size / words.length < 0.42) { flags.push("low-uniqueness"); score += 12; }
        }

        if (state.member && state.member.created_at) {
          const ageDays = (Date.now() - new Date(state.member.created_at).getTime()) / (1000 * 60 * 60 * 24);
          if (isFinite(ageDays) && ageDays < 7) { flags.push("new-account"); score += 18; }
        }

        return { score: clamp(score, 0, 100), flags: flags };
      }

      function computeReviewerWeight(riskScore) {
        const base = Number((state.member && state.member.trust_score) || 1);
        if (riskScore >= 70) return round(base * 0.45, 2);
        if (riskScore >= 50) return round(base * 0.7, 2);
        if (riskScore <= 12) return round(base * 1.05, 2);
        return round(base, 2);
      }

      function metricBox(label, value) {
        return '<article class="metric"><span class="k">' + esc(label) + '</span><span class="v">' + esc(value) + '</span></article>';
      }

      function avatarHtml(volunteer, size) {
        const style = 'style="width:' + Number(size || 40) + 'px;height:' + Number(size || 40) + 'px;"';
        if (volunteer.avatar_url) return '<div class="avatar" ' + style + '><img src="' + esc(volunteer.avatar_url) + '" alt="avatar" loading="lazy"/></div>';
        return '<div class="avatar" ' + style + '>' + esc(initialsOf(volunteer.display_name || "Volunteer")) + '</div>';
      }

      function initialsOf(name) {
        const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "V";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function hasVotedHelpful(reviewId) {
        return !!state.helpfulVotedIds[String(reviewId)];
      }

      function clearStatus(node) { node.textContent = ""; node.className = "status"; }

      function setStatus(node, text, type) {
        node.textContent = text;
        node.className = "status" + (type ? " " + type : "");
      }

      function normalizeDomain(value) { return String(value || "").trim().toLowerCase().replace(/^@/, ""); }
      function mean(values) { return values.length ? values.reduce(function (sum, v) { return sum + Number(v || 0); }, 0) / values.length : 0; }
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function round(value, places) { const p = Math.pow(10, places || 0); return Math.round(value * p) / p; }
      function stars(rating) { const r = clamp(Math.round(Number(rating || 0)), 0, 5); return "★".repeat(r) + "☆".repeat(5 - r); }
      function formatDate(iso) { const d = new Date(iso); return isFinite(d.getTime()) ? d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "Unknown"; }

      function relDate(iso) {
        const d = new Date(iso);
        const diff = Date.now() - d.getTime();
        if (!isFinite(diff)) return "unknown";
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return mins + "m ago";
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        const days = Math.floor(hours / 24);
        if (days < 30) return days + "d ago";
        return formatDate(iso);
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    })();
  </script>
