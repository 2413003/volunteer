<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MK Chess Volunteer Reviews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f1e7;
      --card: #fffdf8;
      --card-2: #fffbf2;
      --ink: #1f1b17;
      --muted: #6a625a;
      --line: #d8cebd;
      --brand: #0b6b4a;
      --brand-2: #9b6a22;
      --ok: #1d6b4e;
      --err: #8a3030;
      --warn: #936113;
      --shadow: 0 14px 30px rgba(25, 20, 14, 0.08);
      --r-lg: 18px;
      --r-md: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7f5ef, #f2eee4);
      min-height: 100vh;
    }

    .app { width: min(1180px, 94vw); margin: 22px auto 48px; display: grid; gap: 14px; }

    .shell {
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: #fff;
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .brand { display: grid; gap: 2px; }
    .brand .kicker { font-size: 10px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--brand); font-weight: 800; }
    .brand h1 { margin: 0; font-size: clamp(20px, 2.6vw, 28px); line-height: 1.1; }

    .auth-box { display: flex; gap: 8px; align-items: center; }
    .auth-box input {
      width: 320px;
      max-width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
      background: #fff;
    }

    button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #1b5f47;
      padding: 9px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #0b6b4a, #084f38);
    }

    button.ghost { background: #fff; color: #184d3a; border-color: #9ec7b8; }
    button.warn { background: linear-gradient(135deg, #9b6a22, #7c531b); border-color: #6a4818; }
    button.danger { background: linear-gradient(135deg, #8a3030, #6f2727); border-color: #5a2121; }
    button:disabled { opacity: 0.64; cursor: not-allowed; }

    .badges { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .badge {
      font-size: 11px;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid #bfd6cd;
      background: #ecf6f1;
      color: #1f5b45;
      font-weight: 700;
    }
    .badge.muted { border-color: #d9d0bf; background: #f6f2e8; color: #5f5549; }

    .connect-row {
      display: grid;
      grid-template-columns: 1.1fr 1.5fr 0.9fr auto;
      gap: 8px;
      align-items: center;
    }

    .connect-row input {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
      min-width: 0;
      background: #fff;
    }

    .connect-actions { display: flex; gap: 7px; flex-wrap: wrap; }

    .settings {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #fcfaf4;
    }

    .settings summary {
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: #4b4136;
      list-style: none;
    }

    .settings summary::-webkit-details-marker { display: none; }

    .status {
      border-radius: 10px;
      border: 1px solid var(--line);
      padding: 9px 10px;
      font-size: 12px;
      background: #faf7ef;
      color: #5c5247;
    }
    .status:empty { display: none; }
    .status.ok { color: #0f5a40; background: #ddf0e7; border-color: #aad1c1; }
    .status.err { color: #7a2323; background: #f7e2e2; border-color: #dfb0b0; }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      border: 1px solid #d5cdbd;
      border-radius: 999px;
      background: #fff;
      color: #43392f;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab.active { background: #114f3b; border-color: #0f4735; color: #fff; }

    .view { display: none; }
    .view.active { display: block; }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .discover-layout { display: grid; grid-template-columns: 340px 1fr; gap: 12px; }

    .stack { display: grid; gap: 10px; }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--card-2);
      padding: 10px;
      display: grid;
      gap: 9px;
    }

    .title-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .title-row h2, .title-row h3 { margin: 0; font-size: 18px; }

    .search input, .search select, .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .field { display: grid; gap: 5px; }
    .field label { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: #4b4035; font-weight: 700; }
    .field textarea { min-height: 110px; resize: vertical; }

    .vol-grid { display: grid; gap: 8px; }
    .vol-card {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }
    .vol-card.active { border-color: #8ebea9; box-shadow: 0 0 0 2px rgba(11, 107, 74, 0.12) inset; }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #d4cab9;
      background: linear-gradient(140deg, #f8f4e6, #ede3cd);
      display: grid;
      place-items: center;
      font-weight: 800;
      color: #4e4337;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; color: var(--muted); }
    .score-pill {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #d5ccb9;
      background: #f8f2e7;
      color: #5c5144;
      font-weight: 700;
      white-space: nowrap;
    }

    .profile-hero {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(160deg, #fffef9, #fff8ea);
      display: grid;
      gap: 11px;
    }

    .profile-top { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
    .profile-top .avatar { width: 56px; height: 56px; border-radius: 14px; }
    .profile-name { font-size: 22px; margin: 0; line-height: 1.1; }
    .tagline { color: var(--muted); font-size: 13px; }

    .stats-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .stat {
      border-radius: 999px;
      border: 1px solid #d8cfbf;
      background: #f8f3e8;
      font-size: 11px;
      padding: 5px 9px;
      font-weight: 700;
      color: #5a5145;
    }

    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
    .metric {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 9px;
      background: #fff;
      display: grid;
      gap: 2px;
    }
    .metric .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
    .metric .value { font-size: 20px; font-weight: 800; }

    .review-list { display: grid; gap: 8px; }
    .review {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 7px;
    }
    .review .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .review .headline { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .review .meta { font-size: 12px; color: var(--muted); }
    .stars { letter-spacing: 0.06em; color: #855722; font-size: 13px; }

    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .form-card { border: 1px solid var(--line); border-radius: 14px; background: #fffef8; padding: 12px; display: grid; gap: 10px; }
    .form-card h2, .form-card h3 { margin: 0; font-size: 20px; }

    .rating-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }

    .studio { display: grid; gap: 12px; }
    .studio-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }

    .analytics { display: grid; gap: 8px; }
    .analytics-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }

    .bar-list { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; }
    .bar {
      height: 9px;
      border-radius: 999px;
      background: #f1ebdd;
      border: 1px solid #e2d8c4;
      overflow: hidden;
    }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #0d6b4a, #2c8c69); }

    details { border: 1px solid var(--line); border-radius: 10px; background: #fffcf5; padding: 9px 10px; }
    details summary { cursor: pointer; font-weight: 700; font-size: 13px; }

    @media (max-width: 1020px) {
      .topbar { grid-template-columns: 1fr; }
      .badges { justify-content: flex-start; }
      .discover-layout, .studio-grid, .split, .metric-grid, .analytics-grid, .rating-grid { grid-template-columns: 1fr; }
      .connect-row { grid-template-columns: 1fr; }
      .auth-box { flex-wrap: wrap; }
      .auth-box input { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <div class="topbar">
        <div class="brand">
          <span class="kicker">MK Chess Club</span>
          <h1>Volunteer Reviews</h1>
        </div>

        <div class="auth-box">
          <input id="emailInput" type="email" placeholder="member@yourdomain.com" />
          <button id="sendLinkBtn" type="button">Send Login Link</button>
          <button id="signOutBtn" class="ghost" type="button">Sign Out</button>
        </div>

        <div class="badges">
          <span class="badge" id="modeBadge">Demo</span>
          <span class="badge muted" id="userBadge">Guest</span>
          <span class="badge muted" id="roleBadge">No role</span>
        </div>
      </div>

      <details class="settings">
        <summary>Settings</summary>
        <div class="connect-row">
          <input id="supaUrlInput" type="url" placeholder="Supabase URL" />
          <input id="supaKeyInput" type="password" placeholder="Supabase anon key" />
          <input id="allowedDomainInput" type="text" placeholder="Allowed email domain" />
          <div class="connect-actions">
            <button id="connectBtn" type="button">Connect</button>
            <button id="demoBtn" class="warn" type="button">Demo</button>
          </div>
        </div>
        <p id="backendStatus" class="status">Backend: not connected</p>
      </details>

      <p id="authStatus" class="status">Status: guest</p>
    </section>

    <section class="panel">
      <div class="tabs" id="tabs">
        <button class="tab active" data-view="discover">Discover</button>
        <button class="tab" data-view="review">Reviews</button>
        <button class="tab" data-view="studio">Studio</button>
      </div>
    </section>

    <section id="discoverView" class="view active panel">
      <div class="discover-layout">
        <aside class="stack">
          <article class="card search">
            <div class="title-row"><h2>Volunteers</h2></div>
            <input id="searchInput" type="text" placeholder="Search volunteer" />
            <select id="sortSelect">
              <option value="top">Top rated</option>
              <option value="reviews">Most reviewed</option>
              <option value="name">Name A-Z</option>
            </select>
          </article>
          <div id="volunteerGrid" class="vol-grid"></div>
        </aside>

        <section class="stack">
          <article id="profilePanel" class="card"></article>
        </section>
      </div>
    </section>
    <section id="reviewView" class="view panel">
      <div class="split">
        <form id="reviewForm" class="form-card">
          <h2>Review</h2>
          <div class="field">
            <label for="reviewEventSelect">Event</label>
            <select id="reviewEventSelect" required></select>
          </div>
          <div class="field">
            <label for="reviewVolunteerSelect">Volunteer</label>
            <select id="reviewVolunteerSelect" required></select>
          </div>

          <div class="rating-grid">
            <div class="field"><label for="overallRating">Overall</label><select id="overallRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="commRating">Communication</label><select id="commRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="relRating">Reliability</label><select id="relRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="warmRating">Welcoming</label><select id="warmRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="clearRating">Clarity</label><select id="clearRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
          </div>

          <div class="field">
            <label for="reviewTitleInput">Headline</label>
            <input id="reviewTitleInput" type="text" maxlength="110" placeholder="Short summary" />
          </div>
          <div class="field">
            <label for="reviewBodyInput">Review</label>
            <textarea id="reviewBodyInput" maxlength="2000" placeholder="Details"></textarea>
          </div>

          <label class="sub"><input id="truthCheckbox" type="checkbox" /> Real event, truthful review.</label>
          <button id="submitReviewBtn" type="submit">Submit Review</button>
          <p id="reviewStatus" class="status"></p>
        </form>

        <form id="reportForm" class="form-card">
          <h2>Report</h2>
          <div class="field">
            <label for="reportVolunteerSelect">Volunteer</label>
            <select id="reportVolunteerSelect" required></select>
          </div>
          <div class="field">
            <label for="reportEventSelect">Event</label>
            <select id="reportEventSelect"><option value="">No event</option></select>
          </div>
          <div class="field">
            <label for="reportReasonSelect">Reason</label>
            <select id="reportReasonSelect" required>
              <option value="">-</option>
              <option value="conduct">Conduct</option>
              <option value="safety">Safety</option>
              <option value="bias">Bias / unfair treatment</option>
              <option value="absence">No-show / reliability</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="reportSeveritySelect">Severity</label>
            <select id="reportSeveritySelect">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="reportDetailsInput">Details</label>
            <textarea id="reportDetailsInput" maxlength="1500" placeholder="Facts, date, what happened"></textarea>
          </div>
          <button id="submitReportBtn" class="danger" type="submit">Submit Report</button>
          <p id="reportStatus" class="status"></p>
        </form>
      </div>
    </section>

    <section id="studioView" class="view panel">
      <div class="studio" id="studioGate"></div>
      <div class="studio" id="studioContent" style="display:none;">
        <div class="studio-grid">
          <form id="profileForm" class="form-card">
            <h2>Profile</h2>
            <div class="field"><label for="profileDisplayName">Display Name</label><input id="profileDisplayName" type="text" maxlength="80" /></div>
            <div class="field"><label for="profileTagline">Tagline</label><input id="profileTagline" type="text" maxlength="120" placeholder="Example: Junior mentor and tournament helper" /></div>
            <div class="field"><label for="profileAvatarUrl">Avatar URL</label><input id="profileAvatarUrl" type="url" placeholder="https://..." /></div>
            <div class="field"><label for="profileBio">Bio</label><textarea id="profileBio" maxlength="800"></textarea></div>
            <label class="sub"><input id="profileActive" type="checkbox" /> Public profile visible</label>
            <button id="saveProfileBtn" type="submit">Save Profile</button>
            <p id="profileStatus" class="status"></p>
          </form>

          <article class="form-card analytics">
            <h2>Analytics</h2>
            <div id="studioMetrics" class="analytics-grid"></div>
            <div class="card">
              <div class="title-row"><h3>Category Scores</h3></div>
              <div id="categoryBars" class="bar-list"></div>
            </div>
            <div class="card">
              <div class="title-row"><h3>6-Month Trend</h3></div>
              <div id="trendBars" class="bar-list"></div>
            </div>
          </article>
        </div>

        <div class="split">
          <article class="form-card">
            <h3>Recent Reviews</h3>
            <div id="studioRecentReviews" class="review-list"></div>
          </article>
          <article class="form-card">
            <h3>Open Reports</h3>
            <div id="studioOpenReports" class="review-list"></div>
          </article>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

        authSub: null,
        demoMode: true,
        user: null,
        member: null,
        volunteerLink: null,
        volunteers: [],
        events: [],
        eventVolunteerMap: {},
        reviews: [],
        reports: [],
        selectedVolunteerId: null,
        activeView: "discover"
      };

      const el = {};

      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        cacheEls();
        bindEvents();
        restoreConfig();
        await connectWithStoredConfig();
        await refreshSession();
        await loadAllData();
        renderAll();
      }

      function cacheEls() {
        [
          "emailInput", "sendLinkBtn", "signOutBtn", "modeBadge", "userBadge", "roleBadge", "supaUrlInput", "supaKeyInput", "allowedDomainInput",
          "connectBtn", "demoBtn", "authStatus", "backendStatus", "tabs", "discoverView", "reviewView", "studioView", "searchInput", "sortSelect",
          "volunteerGrid", "profilePanel", "reviewForm", "reviewEventSelect", "reviewVolunteerSelect", "overallRating", "commRating", "relRating", "warmRating",
          "clearRating", "reviewTitleInput", "reviewBodyInput", "truthCheckbox", "submitReviewBtn", "reviewStatus", "reportForm", "reportVolunteerSelect", "reportEventSelect",
          "reportReasonSelect", "reportSeveritySelect", "reportDetailsInput", "submitReportBtn", "reportStatus", "studioGate", "studioContent", "profileForm",
          "profileDisplayName", "profileTagline", "profileAvatarUrl", "profileBio", "profileActive", "saveProfileBtn", "profileStatus", "studioMetrics", "categoryBars",
          "trendBars", "studioRecentReviews", "studioOpenReports"
        ].forEach(function (id) { el[id] = document.getElementById(id); });
      }

      function bindEvents() {
        el.connectBtn.addEventListener("click", onConnectClick);
        el.demoBtn.addEventListener("click", onDemoClick);
        el.sendLinkBtn.addEventListener("click", onSendMagicLink);
        el.signOutBtn.addEventListener("click", onSignOut);
        el.tabs.addEventListener("click", onTabClick);
        el.searchInput.addEventListener("input", renderVolunteerList);
        el.sortSelect.addEventListener("change", renderVolunteerList);
        el.volunteerGrid.addEventListener("click", onVolunteerCardClick);
        el.profilePanel.addEventListener("click", onProfilePanelClick);
        el.reviewEventSelect.addEventListener("change", renderReviewVolunteerOptions);
        el.reviewForm.addEventListener("submit", onSubmitReview);
        el.reportForm.addEventListener("submit", onSubmitReport);
        el.profileForm.addEventListener("submit", onSaveProfile);
      }

      function restoreConfig() {
        el.supaUrlInput.value = localStorage.getItem(STORAGE.url) || "";
        el.supaKeyInput.value = localStorage.getItem(STORAGE.key) || "";
        el.allowedDomainInput.value = localStorage.getItem(STORAGE.domain) || "";
      }

      async function onConnectClick() {
        localStorage.setItem(STORAGE.url, (el.supaUrlInput.value || "").trim());
        localStorage.setItem(STORAGE.key, (el.supaKeyInput.value || "").trim());
        localStorage.setItem(STORAGE.domain, normalizeDomain(el.allowedDomainInput.value || ""));
        await connectWithStoredConfig();
        await refreshSession();
        await loadAllData();
        renderAll();
      }

      async function onDemoClick() {
        state.demoMode = true;
        state.supabase = null;
        detachAuthSubscription();
        state.user = DEMO.user;
        state.member = DEMO.member;
        state.volunteerLink = DEMO.volunteerLink;
        setStatus(el.backendStatus, "Backend: demo mode", "ok");
        await loadAllData();
        renderAll();
      }

      async function connectWithStoredConfig() {
        const url = (localStorage.getItem(STORAGE.url) || "").trim();
        const key = (localStorage.getItem(STORAGE.key) || "").trim();

        if (!url || !key) {
          state.demoMode = true;
          state.supabase = null;
          state.user = DEMO.user;
          state.member = DEMO.member;
          state.volunteerLink = DEMO.volunteerLink;
          setStatus(el.backendStatus, "Backend: no credentials (demo mode)", "err");
          return;
        }

        try {
          state.supabase = window.supabase.createClient(url, key, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
          });
          state.demoMode = false;
          attachAuthSubscription();
          setStatus(el.backendStatus, "Backend: connected", "ok");
        } catch (err) {
          state.demoMode = true;
          state.supabase = null;
          state.user = DEMO.user;
          state.member = DEMO.member;
          state.volunteerLink = DEMO.volunteerLink;
          setStatus(el.backendStatus, "Backend: connection failed (demo mode)", "err");
        }
      }
      function attachAuthSubscription() {
        detachAuthSubscription();
        state.authSub = state.supabase.auth.onAuthStateChange(async function (_event, session) {
          state.user = session ? session.user : null;
          await loadMemberProfile();
          await loadVolunteerLink();
          await loadAllData();
          renderAll();
        });
      }

      function detachAuthSubscription() {
        if (state.authSub && state.authSub.data && state.authSub.data.subscription) {
          state.authSub.data.subscription.unsubscribe();
        }
        state.authSub = null;
      }

      async function refreshSession() {
        if (state.demoMode || !state.supabase) {
          state.user = DEMO.user;
          state.member = DEMO.member;
          state.volunteerLink = DEMO.volunteerLink;
          return;
        }

        const sessionResp = await state.supabase.auth.getSession();
        state.user = sessionResp.data && sessionResp.data.session ? sessionResp.data.session.user : null;
        await loadMemberProfile();
        await loadVolunteerLink();
      }

      async function loadMemberProfile() {
        if (state.demoMode) {
          state.member = DEMO.member;
          return;
        }

        state.member = null;
        if (!state.user) return;

        const resp = await state.supabase
          .from("member_profiles")
          .select("display_name,status,role,trust_score,created_at")
          .eq("user_id", state.user.id)
          .maybeSingle();

        if (resp.error) {
          state.member = {
            display_name: state.user.email || "Member",
            status: "pending",
            role: "member",
            trust_score: 1.0,
            created_at: new Date().toISOString()
          };
          return;
        }

        state.member = resp.data || {
          display_name: state.user.email || "Member",
          status: "pending",
          role: "member",
          trust_score: 1.0,
          created_at: new Date().toISOString()
        };
      }

      async function loadVolunteerLink() {
        if (state.demoMode) {
          state.volunteerLink = DEMO.volunteerLink;
          return;
        }

        state.volunteerLink = null;
        if (!state.user) return;

        let found = null;

        const direct = await state.supabase
          .from("volunteers")
          .select("id")
          .eq("user_id", state.user.id)
          .maybeSingle();

        if (!direct.error && direct.data && direct.data.id) {
          found = { volunteer_id: direct.data.id, source: "volunteers.user_id" };
        }

        if (!found) {
          const mapped = await state.supabase
            .from("volunteer_accounts")
            .select("volunteer_id")
            .eq("user_id", state.user.id)
            .maybeSingle();
          if (!mapped.error && mapped.data && mapped.data.volunteer_id) {
            found = { volunteer_id: mapped.data.volunteer_id, source: "volunteer_accounts" };
          }
        }

        if (!found) {
          const fromProfile = await state.supabase
            .from("member_profiles")
            .select("volunteer_id")
            .eq("user_id", state.user.id)
            .maybeSingle();
          if (!fromProfile.error && fromProfile.data && fromProfile.data.volunteer_id) {
            found = { volunteer_id: fromProfile.data.volunteer_id, source: "member_profiles.volunteer_id" };
          }
        }

        state.volunteerLink = found;
      }

      async function loadAllData() {
        if (state.demoMode) {
          state.volunteers = DEMO.volunteers.slice();
          state.events = DEMO.events.slice();
          state.eventVolunteerMap = JSON.parse(JSON.stringify(DEMO.eventVolunteerMap));
          state.reviews = DEMO.reviews.slice();
          state.reports = DEMO.reports.slice();
          if (!state.selectedVolunteerId && state.volunteers[0]) state.selectedVolunteerId = state.volunteers[0].id;
          return;
        }

        await loadVolunteers();
        await Promise.all([loadReviews(), loadReports(), loadReviewEvents()]);

        if (!state.selectedVolunteerId && state.volunteers[0]) {
          state.selectedVolunteerId = state.volunteers[0].id;
        }
      }

      async function loadVolunteers() {
        let resp = await state.supabase
          .from("volunteers")
          .select("id,display_name,tagline,bio,avatar_url,active")
          .eq("active", true)
          .order("display_name", { ascending: true });

        if (resp.error) {
          resp = await state.supabase
            .from("volunteers")
            .select("id,display_name,bio,avatar_url,active")
            .eq("active", true)
            .order("display_name", { ascending: true });
        }

        state.volunteers = resp.error ? [] : (resp.data || []);
      }

      async function loadReviews() {
        const resp = await state.supabase
          .from("reviews")
          .select("id,volunteer_id,event_id,overall_rating,communication_rating,reliability_rating,warmth_rating,clarity_rating,title,body,helpful_count,moderation_status,status,authenticity_score,reviewer_weight,created_at,volunteers(display_name,avatar_url),club_events(title,starts_at)")
          .order("created_at", { ascending: false })
          .limit(400);

        if (resp.error) {
          state.reviews = [];
          return;
        }

        state.reviews = (resp.data || []).filter(function (row) {
          const status = row.moderation_status || row.status || "published";
          return status === "published";
        });
      }

      async function loadReports() {
        const resp = await state.supabase
          .from("volunteer_reports")
          .select("id,volunteer_id,status,severity,reason,details,created_at")
          .order("created_at", { ascending: false })
          .limit(200);

        state.reports = resp.error ? [] : (resp.data || []);
      }

      async function loadReviewEvents() {
        state.events = [];
        state.eventVolunteerMap = {};

        if (!state.user || !state.member || state.member.status !== "approved") {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);

          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const attendance = await state.supabase
          .from("event_attendance")
          .select("event_id,verified,club_events(id,title,starts_at)")
          .eq("member_user_id", state.user.id)
          .eq("verified", true);

        if (attendance.error) {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);
          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const map = {};
        (attendance.data || []).forEach(function (row) {
          if (row.club_events && row.club_events.id) {
            map[row.club_events.id] = row.club_events;
          }
        });
        state.events = Object.values(map);

        if (!state.events.length) {
          wireAllVolunteersToEvents();
          return;
        }

        const eventIds = state.events.map(function (e) { return e.id; });
        const shifts = await state.supabase
          .from("volunteer_event_shifts")
          .select("event_id,volunteer_id")
          .in("event_id", eventIds);

        if (!shifts.error) {
          (shifts.data || []).forEach(function (row) {
            if (!state.eventVolunteerMap[row.event_id]) state.eventVolunteerMap[row.event_id] = [];
            state.eventVolunteerMap[row.event_id].push(row.volunteer_id);
          });
        }

        if (!Object.keys(state.eventVolunteerMap).length) {
          wireAllVolunteersToEvents();
        }
      }

      function wireAllVolunteersToEvents() {
        const ids = state.volunteers.map(function (v) { return v.id; });
        state.events.forEach(function (ev) {
          state.eventVolunteerMap[ev.id] = ids.slice();
        });
      }
      async function onSendMagicLink() {
        const email = (el.emailInput.value || "").trim().toLowerCase();
        if (!email || email.indexOf("@") < 0) {
          setStatus(el.authStatus, "Enter valid email.", "err");
          return;
        }

        const domain = normalizeDomain(localStorage.getItem(STORAGE.domain) || "");
        if (domain && !email.endsWith("@" + domain)) {
          setStatus(el.authStatus, "Email must end with @" + domain, "err");
          return;
        }

        if (state.demoMode || !state.supabase) {
          setStatus(el.authStatus, "Connect backend first.", "err");
          return;
        }

        const redirect = window.location.origin + window.location.pathname;
        const resp = await state.supabase.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirect } });

        if (resp.error) {
          setStatus(el.authStatus, "Login failed: " + resp.error.message, "err");
          return;
        }

        setStatus(el.authStatus, "Login link sent.", "ok");
      }

      async function onSignOut() {
        if (!state.demoMode && state.supabase) {
          await state.supabase.auth.signOut();
        }

        if (state.demoMode) {
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          renderAll();
          return;
        }

        state.user = null;
        state.member = null;
        state.volunteerLink = null;
        await loadAllData();
        renderAll();
      }

      function onTabClick(event) {
        const btn = event.target.closest("[data-view]");
        if (!btn) return;
        state.activeView = btn.getAttribute("data-view") || "discover";
        renderTabs();
      }

      function onVolunteerCardClick(event) {
        const card = event.target.closest("[data-volunteer]");
        if (!card) return;
        state.selectedVolunteerId = card.getAttribute("data-volunteer");
        renderVolunteerList();
        renderProfilePanel();
      }

      function onProfilePanelClick(event) {
        const writeBtn = event.target.closest("[data-action='write-review']");
        const reportBtn = event.target.closest("[data-action='write-report']");
        const helpfulBtn = event.target.closest("[data-helpful]");

        if (writeBtn) {
          state.activeView = "review";
          renderTabs();
          if (state.selectedVolunteerId) {
            el.reviewVolunteerSelect.value = state.selectedVolunteerId;
            el.reportVolunteerSelect.value = state.selectedVolunteerId;
          }
          return;
        }

        if (reportBtn) {
          state.activeView = "review";
          renderTabs();
          if (state.selectedVolunteerId) {
            el.reportVolunteerSelect.value = state.selectedVolunteerId;
          }
          return;
        }

        if (helpfulBtn) {
          markReviewHelpful(helpfulBtn.getAttribute("data-helpful"));
        }
      }

      function memberApproved() {
        return !!(state.user && state.member && state.member.status === "approved");
      }

      async function onSubmitReview(event) {
        event.preventDefault();

        if (!memberApproved()) {
          setStatus(el.reviewStatus, "Approved member required.", "err");
          return;
        }

        const payload = collectReviewForm();
        if (!payload.ok) {
          setStatus(el.reviewStatus, payload.message, "err");
          return;
        }

        const signal = computeAuthenticity(payload.review);
        const moderationStatus = signal.score >= 50 ? "pending" : "published";
        const reviewerWeight = computeReviewerWeight(signal.score);

        if (state.demoMode) {
          const row = Object.assign({}, payload.review, {
            id: "demo-" + Math.random().toString(16).slice(2),
            moderation_status: moderationStatus,
            authenticity_score: signal.score,
            reviewer_weight: reviewerWeight,
            helpful_count: 0,
            created_at: new Date().toISOString()
          });
          state.reviews.unshift(row);
          setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Review queued for moderation.", moderationStatus === "published" ? "ok" : "err");
          el.reviewForm.reset();
          renderAll();
          return;
        }

        const duplicate = await state.supabase
          .from("reviews")
          .select("id")
          .eq("reviewer_user_id", state.user.id)
          .eq("volunteer_id", payload.review.volunteer_id)
          .eq("event_id", payload.review.event_id)
          .limit(1);

        if (!duplicate.error && (duplicate.data || []).length > 0) {
          setStatus(el.reviewStatus, "You already reviewed this volunteer for this event.", "err");
          return;
        }

        const dayStart = new Date();
        dayStart.setHours(0, 0, 0, 0);
        const limitResp = await state.supabase
          .from("reviews")
          .select("id", { count: "exact", head: true })
          .eq("reviewer_user_id", state.user.id)
          .gte("created_at", dayStart.toISOString());

        if (!limitResp.error && (limitResp.count || 0) >= 4) {
          setStatus(el.reviewStatus, "Daily limit reached (4/day).", "err");
          return;
        }

        let insert = {
          volunteer_id: payload.review.volunteer_id,
          event_id: payload.review.event_id,
          reviewer_user_id: state.user.id,
          overall_rating: payload.review.overall_rating,
          communication_rating: payload.review.communication_rating,
          reliability_rating: payload.review.reliability_rating,
          warmth_rating: payload.review.warmth_rating,
          clarity_rating: payload.review.clarity_rating,
          title: payload.review.title,
          body: payload.review.body,
          moderation_status: moderationStatus,
          authenticity_score: signal.score,
          authenticity_flags: signal.flags,
          reviewer_weight: reviewerWeight
        };

        let resp = await state.supabase.from("reviews").insert(insert).select().maybeSingle();
        if (resp.error) {
          insert = Object.assign({}, insert);
          delete insert.moderation_status;
          delete insert.authenticity_score;
          delete insert.authenticity_flags;
          delete insert.reviewer_weight;
          insert.status = moderationStatus;
          resp = await state.supabase.from("reviews").insert(insert).select().maybeSingle();
        }

        if (resp.error) {
          setStatus(el.reviewStatus, "Submit failed: " + resp.error.message, "err");
          return;
        }

        setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Review queued for moderation.", moderationStatus === "published" ? "ok" : "err");
        el.reviewForm.reset();
        await loadAllData();
        renderAll();
      }

      function collectReviewForm() {
        const review = {
          event_id: (el.reviewEventSelect.value || "").trim(),
          volunteer_id: (el.reviewVolunteerSelect.value || "").trim(),
          overall_rating: Number(el.overallRating.value || 0),
          communication_rating: Number(el.commRating.value || 0),
          reliability_rating: Number(el.relRating.value || 0),
          warmth_rating: Number(el.warmRating.value || 0),
          clarity_rating: Number(el.clearRating.value || 0),
          title: (el.reviewTitleInput.value || "").trim(),
          body: (el.reviewBodyInput.value || "").trim()
        };

        if (!review.event_id || !review.volunteer_id) return { ok: false, message: "Choose event + volunteer." };
        if (!review.overall_rating || !review.communication_rating || !review.reliability_rating || !review.warmth_rating || !review.clarity_rating) return { ok: false, message: "Complete all ratings." };
        if (review.title.length < 6) return { ok: false, message: "Add a headline." };
        if (review.body.length < 80) return { ok: false, message: "Review should be at least 80 characters." };
        if ((review.overall_rating === 1 || review.overall_rating === 5) && review.body.length < 120) return { ok: false, message: "1-star and 5-star reviews need more detail (120+ chars)." };
        if (!el.truthCheckbox.checked) return { ok: false, message: "Confirm checkbox." };

        return { ok: true, review: review };
      }

      async function onSubmitReport(event) {
        event.preventDefault();

        if (!memberApproved()) {
          setStatus(el.reportStatus, "Approved member required.", "err");
          return;
        }

        const volunteerId = (el.reportVolunteerSelect.value || "").trim();
        const eventId = (el.reportEventSelect.value || "").trim();
        const reason = (el.reportReasonSelect.value || "").trim();
        const severity = (el.reportSeveritySelect.value || "medium").trim();
        const details = (el.reportDetailsInput.value || "").trim();

        if (!volunteerId || !reason) {
          setStatus(el.reportStatus, "Choose volunteer + reason.", "err");
          return;
        }
        if (details.length < 50) {
          setStatus(el.reportStatus, "Add at least 50 chars.", "err");
          return;
        }

        if (state.demoMode) {
          state.reports.unshift({
            id: "demo-report-" + Math.random().toString(16).slice(2),
            volunteer_id: volunteerId,
            status: "open",
            severity: severity,
            reason: reason,
            details: details,
            created_at: new Date().toISOString()
          });
          setStatus(el.reportStatus, "Report submitted.", "ok");
          el.reportForm.reset();
          renderAll();
          return;
        }

        const resp = await state.supabase.from("volunteer_reports").insert({
          volunteer_id: volunteerId,
          event_id: eventId || null,
          reporter_user_id: state.user.id,
          reason: reason,
          severity: severity,
          details: details,
          status: "open"
        });

        if (resp.error) {
          setStatus(el.reportStatus, "Report failed: " + resp.error.message, "err");
          return;
        }

        setStatus(el.reportStatus, "Report submitted.", "ok");
        el.reportForm.reset();
        await loadAllData();
        renderAll();
      }
      async function markReviewHelpful(reviewId) {
        if (!reviewId) return;
        const target = state.reviews.find(function (r) { return String(r.id) === String(reviewId); });
        if (!target) return;

        if (state.demoMode) {
          target.helpful_count = Number(target.helpful_count || 0) + 1;
          renderProfilePanel();
          renderStudio();
          return;
        }

        if (!state.user) {
          setStatus(el.authStatus, "Sign in to vote.", "err");
          return;
        }

        const vote = await state.supabase
          .from("review_helpfulness")
          .upsert({ review_id: reviewId, voter_user_id: state.user.id, vote: 1 }, { onConflict: "review_id,voter_user_id" });

        if (vote.error) {
          setStatus(el.authStatus, "Helpful vote failed: " + vote.error.message, "err");
          return;
        }

        target.helpful_count = Number(target.helpful_count || 0) + 1;
        renderProfilePanel();
        renderStudio();
      }

      async function onSaveProfile(event) {
        event.preventDefault();

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          setStatus(el.profileStatus, "No linked volunteer account found.", "err");
          return;
        }

        const payload = {
          display_name: (el.profileDisplayName.value || "").trim(),
          tagline: (el.profileTagline.value || "").trim(),
          avatar_url: (el.profileAvatarUrl.value || "").trim(),
          bio: (el.profileBio.value || "").trim(),
          active: !!el.profileActive.checked
        };

        if (!payload.display_name) {
          setStatus(el.profileStatus, "Display name is required.", "err");
          return;
        }

        if (state.demoMode) {
          const idx = state.volunteers.findIndex(function (v) { return v.id === state.volunteerLink.volunteer_id; });
          if (idx >= 0) state.volunteers[idx] = Object.assign({}, state.volunteers[idx], payload);
          setStatus(el.profileStatus, "Profile saved.", "ok");
          renderAll();
          return;
        }

        let resp = await state.supabase
          .from("volunteers")
          .update(payload)
          .eq("id", state.volunteerLink.volunteer_id)
          .select()
          .maybeSingle();

        if (resp.error) {
          const fallback = {
            display_name: payload.display_name,
            avatar_url: payload.avatar_url,
            bio: payload.bio,
            active: payload.active
          };
          resp = await state.supabase
            .from("volunteers")
            .update(fallback)
            .eq("id", state.volunteerLink.volunteer_id)
            .select()
            .maybeSingle();
        }

        if (resp.error) {
          setStatus(el.profileStatus, "Save failed: " + resp.error.message, "err");
          return;
        }

        setStatus(el.profileStatus, "Profile saved.", "ok");
        await loadAllData();
        renderAll();
      }

      function renderAll() {
        renderTopBadges();
        renderTabs();
        renderReviewSelectors();
        renderReportSelectors();
        renderVolunteerList();
        renderProfilePanel();
        renderStudio();
      }

      function renderTopBadges() {
        el.modeBadge.textContent = state.demoMode ? "Demo" : "Live";
        el.userBadge.textContent = state.user ? (state.user.email || "Signed in") : "Guest";

        const role = state.member ? (state.member.role || "member") : "no role";
        const status = state.member ? (state.member.status || "pending") : "guest";
        el.roleBadge.textContent = role + " / " + status;

        if (!state.user) {
          setStatus(el.authStatus, "Status: guest", "");
          return;
        }

        const name = state.member && state.member.display_name ? state.member.display_name : (state.user.email || "Member");
        setStatus(el.authStatus, "Signed in: " + name, memberApproved() ? "ok" : "err");
      }

      function renderTabs() {
        ["discover", "review", "studio"].forEach(function (view) {
          const tab = el.tabs.querySelector("[data-view='" + view + "']");
          const panel = el[view + "View"];
          if (!tab || !panel) return;
          const active = state.activeView === view;
          tab.classList.toggle("active", active);
          panel.classList.toggle("active", active);
        });
      }

      function renderVolunteerList() {
        const search = (el.searchInput.value || "").trim().toLowerCase();
        const sort = (el.sortSelect.value || "top").trim();

        const list = state.volunteers
          .filter(function (v) {
            const blob = ((v.display_name || "") + " " + (v.tagline || "") + " " + (v.bio || "")).toLowerCase();
            return !search || blob.indexOf(search) >= 0;
          })
          .map(function (v) {
            const stats = volunteerStats(v.id);
            return { volunteer: v, stats: stats };
          });

        list.sort(function (a, b) {
          if (sort === "reviews") return b.stats.reviewCount - a.stats.reviewCount;
          if (sort === "name") return (a.volunteer.display_name || "").localeCompare(b.volunteer.display_name || "");
          return b.stats.score - a.stats.score;
        });

        if (!list.length) {
          el.volunteerGrid.innerHTML = '<div class="card">No volunteers found.</div>';
          return;
        }

        const visibleIds = list.map(function (x) { return x.volunteer.id; });
        if (!visibleIds.includes(state.selectedVolunteerId)) {
          state.selectedVolunteerId = visibleIds[0];
        }

        el.volunteerGrid.innerHTML = list.map(function (row) {
          const v = row.volunteer;
          const s = row.stats;
          const avatar = avatarHtml(v, 44);
          return '<article class="vol-card ' + (state.selectedVolunteerId === v.id ? "active" : "") + '" data-volunteer="' + esc(v.id) + '">' +
            avatar +
            '<div><div class="name">' + esc(v.display_name || "Volunteer") + '</div><div class="sub">' + esc(v.tagline || "Volunteer") + '</div><div class="sub">' + stars(s.avgRating) + ' ' + s.avgRating.toFixed(2) + ' · ' + s.reviewCount + '</div></div>' +
            '<div class="score-pill">Rep ' + Math.round(s.score) + '</div>' +
          '</article>';
        }).join("");
      }

      function renderProfilePanel() {
        const volunteer = state.volunteers.find(function (v) { return v.id === state.selectedVolunteerId; });

        if (!volunteer) {
          el.profilePanel.innerHTML = '<div class="sub">Select a volunteer.</div>';
          return;
        }

        const stats = volunteerStats(volunteer.id);
        const reviews = reviewsForVolunteer(volunteer.id);

        const metrics = [
          metricBox("Rating", stats.avgRating.toFixed(2)),
          metricBox("Reputation", String(Math.round(stats.score))),
          metricBox("Positive", stats.positiveRate + "%"),
          metricBox("Open Reports", String(stats.openReports))
        ].join("");

        const reviewCards = reviews.slice(0, 8).map(function (r) {
          return '<article class="review">' +
            '<div class="head"><div><div class="stars">' + stars(r.overall_rating) + ' ' + Number(r.overall_rating || 0).toFixed(0) + '/5</div><div class="headline">' + esc(r.title || "Review") + '</div><div class="meta">' + relDate(r.created_at) + '</div></div><button class="ghost" type="button" data-helpful="' + esc(r.id) + '">Helpful (' + Number(r.helpful_count || 0) + ')</button></div>' +
            '<div>' + esc(r.body || "") + '</div>' +
          '</article>';
        }).join("");

        el.profilePanel.innerHTML =
          '<section class="profile-hero">' +
            '<div class="profile-top">' +
              avatarHtml(volunteer, 56) +
              '<div><h2 class="profile-name">' + esc(volunteer.display_name || "Volunteer") + '</h2><div class="tagline">' + esc(volunteer.tagline || volunteer.bio || "") + '</div></div>' +
              '<div class="stack"><button type="button" data-action="write-review">Review</button><button class="ghost" type="button" data-action="write-report">Report</button></div>' +
            '</div>' +
            '<div class="stats-row"><span class="stat">' + stars(stats.avgRating) + ' ' + stats.avgRating.toFixed(2) + '</span><span class="stat">' + stats.reviewCount + ' reviews</span><span class="stat">Rep ' + Math.round(stats.score) + '</span><span class="stat">Confidence ' + stats.confidence + '%</span></div>' +
            '<div class="sub">' + esc(volunteer.bio || "") + '</div>' +
          '</section>' +
          '<section class="metric-grid">' + metrics + '</section>' +
          '<section class="review-list">' + (reviewCards || '<div class="card">No reviews yet.</div>') + '</section>';
      }

      function renderReviewSelectors() {
        const events = state.events.slice().sort(function (a, b) { return new Date(b.starts_at) - new Date(a.starts_at); });
        el.reviewEventSelect.innerHTML = '<option value="">Select event</option>' + events.map(function (ev) {
          return '<option value="' + esc(ev.id) + '">' + esc(ev.title || "Event") + ' · ' + formatDate(ev.starts_at) + '</option>';
        }).join("");

        renderReviewVolunteerOptions();
      }

      function renderReviewVolunteerOptions() {
        const eventId = (el.reviewEventSelect.value || "").trim();
        const allowed = eventId ? (state.eventVolunteerMap[eventId] || []) : state.volunteers.map(function (v) { return v.id; });
        const options = state.volunteers.filter(function (v) { return allowed.includes(v.id); });
        el.reviewVolunteerSelect.innerHTML = '<option value="">Select volunteer</option>' + options.map(function (v) {
          return '<option value="' + esc(v.id) + '">' + esc(v.display_name || "Volunteer") + '</option>';
        }).join("");

        if (state.selectedVolunteerId && options.some(function (v) { return v.id === state.selectedVolunteerId; })) {
          el.reviewVolunteerSelect.value = state.selectedVolunteerId;
        }
      }

      function renderReportSelectors() {
        el.reportVolunteerSelect.innerHTML = '<option value="">Select volunteer</option>' + state.volunteers.map(function (v) {
          return '<option value="' + esc(v.id) + '">' + esc(v.display_name || "Volunteer") + '</option>';
        }).join("");

        el.reportEventSelect.innerHTML = '<option value="">No event</option>' + state.events.map(function (ev) {
          return '<option value="' + esc(ev.id) + '">' + esc(ev.title || "Event") + ' · ' + formatDate(ev.starts_at) + '</option>';
        }).join("");

        if (state.selectedVolunteerId) {
          el.reportVolunteerSelect.value = state.selectedVolunteerId;
        }
      }

      function renderStudio() {
        if (!state.user) {
          el.studioGate.innerHTML = '<article class="card">Sign in to open Studio.</article>';
          el.studioContent.style.display = "none";
          return;
        }

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          el.studioGate.innerHTML = '<article class="card">No volunteer profile linked to this login.</article>';
          el.studioContent.style.display = "none";
          return;
        }

        const volunteer = state.volunteers.find(function (v) { return v.id === state.volunteerLink.volunteer_id; });
        if (!volunteer) {
          el.studioGate.innerHTML = '<article class="card">Linked profile not found.</article>';
          el.studioContent.style.display = "none";
          return;
        }

        el.studioGate.innerHTML = '';
        el.studioContent.style.display = "grid";

        el.profileDisplayName.value = volunteer.display_name || "";
        el.profileTagline.value = volunteer.tagline || "";
        el.profileAvatarUrl.value = volunteer.avatar_url || "";
        el.profileBio.value = volunteer.bio || "";
        el.profileActive.checked = volunteer.active !== false;

        const stats = volunteerStats(volunteer.id);
        el.studioMetrics.innerHTML = [
          metricBox("Avg rating", stats.avgRating.toFixed(2)),
          metricBox("Reviews", String(stats.reviewCount)),
          metricBox("Helpful", String(stats.helpfulTotal)),
          metricBox("Open reports", String(stats.openReports))
        ].join("");

        renderCategoryBars(volunteer.id);
        renderTrendBars(volunteer.id);

        const recent = reviewsForVolunteer(volunteer.id).slice(0, 6);
        el.studioRecentReviews.innerHTML = recent.length ? recent.map(function (r) {
          return '<article class="review"><div class="head"><div><div class="stars">' + stars(r.overall_rating) + '</div><div class="headline">' + esc(r.title || "Review") + '</div><div class="meta">' + relDate(r.created_at) + '</div></div></div><div>' + esc(r.body || "") + '</div></article>';
        }).join("") : '<div class="card">No reviews yet.</div>';

        const openReports = state.reports.filter(function (rp) { return rp.volunteer_id === volunteer.id && (rp.status === "open" || rp.status === "investigating"); });
        el.studioOpenReports.innerHTML = openReports.length ? openReports.map(function (rp) {
          return '<article class="review"><div class="headline">' + esc((rp.reason || "report").toUpperCase()) + ' · ' + esc(rp.severity || "medium") + '</div><div class="meta">' + relDate(rp.created_at) + '</div><div>' + esc(rp.details || "") + '</div></article>';
        }).join("") : '<div class="card">No open reports.</div>';
      }

      function renderCategoryBars(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const categories = [
          { label: "Overall", key: "overall_rating" },
          { label: "Communication", key: "communication_rating" },
          { label: "Reliability", key: "reliability_rating" },
          { label: "Welcoming", key: "warmth_rating" },
          { label: "Clarity", key: "clarity_rating" }
        ];

        el.categoryBars.innerHTML = categories.map(function (cat) {
          const avg = mean(rows.map(function (r) { return Number(r[cat.key] || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="sub">' + esc(cat.label) + '</div><div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="sub">' + (avg ? avg.toFixed(2) : "0.00") + '</div></div>';
        }).join("");
      }

      function renderTrendBars(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const months = [];
        const now = new Date();
        for (let i = 5; i >= 0; i -= 1) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
          months.push({ key: key, label: d.toLocaleDateString(undefined, { month: "short" }) });
        }

        el.trendBars.innerHTML = months.map(function (m) {
          const monthRows = rows.filter(function (r) {
            const d = new Date(r.created_at);
            const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            return key === m.key;
          });
          const avg = mean(monthRows.map(function (r) { return Number(r.overall_rating || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="sub">' + esc(m.label) + '</div><div class="bar"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="sub">' + (avg ? avg.toFixed(2) : "-") + '</div></div>';
        }).join("");
      }

      function reviewsForVolunteer(volunteerId) {
        return state.reviews.filter(function (r) { return r.volunteer_id === volunteerId; }).sort(function (a, b) {
          return new Date(b.created_at) - new Date(a.created_at);
        });
      }

      function volunteerStats(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const openReports = state.reports.filter(function (rp) {
          return rp.volunteer_id === volunteerId && (rp.status === "open" || rp.status === "investigating");
        }).length;

        const reviewCount = rows.length;
        const helpfulTotal = rows.reduce(function (sum, r) { return sum + Number(r.helpful_count || 0); }, 0);

        const globalMean = mean(state.reviews.map(function (r) { return Number(r.overall_rating || 0); })) || 4;
        const m = 8;

        let weightedSum = 0;
        let weightTotal = 0;
        rows.forEach(function (r) {
          const rating = Number(r.overall_rating || 0);
          const weight = Number(r.reviewer_weight || 1);
          if (rating > 0 && weight > 0) {
            weightedSum += rating * weight;
            weightTotal += weight;
          }
        });

        const avgRating = weightTotal > 0 ? weightedSum / weightTotal : globalMean;
        const bayesian = ((weightTotal / (weightTotal + m)) * avgRating) + ((m / (weightTotal + m)) * globalMean);
        const score = clamp((((bayesian - 1) / 4) * 100) - (openReports * 4.5), 0, 100);
        const confidence = clamp(Math.round((weightTotal / (weightTotal + 9)) * 100), 5, 99);

        const positives = rows.filter(function (r) { return Number(r.overall_rating || 0) >= 4; }).length;
        const positiveRate = reviewCount ? Math.round((positives / reviewCount) * 100) : 0;

        return {
          avgRating: avgRating || 0,
          reviewCount: reviewCount,
          score: score,
          confidence: confidence,
          openReports: openReports,
          helpfulTotal: helpfulTotal,
          positiveRate: positiveRate
        };
      }

      function computeAuthenticity(review) {
        const flags = [];
        let score = 0;
        const body = review.body || "";
        const words = body.split(/\s+/).filter(Boolean);

        if (body.length < 100) { flags.push("short-detail"); score += 12; }
        if ((body.match(/[A-Z]/g) || []).length / ((body.match(/[A-Za-z]/g) || []).length || 1) > 0.35) { flags.push("high-caps"); score += 16; }
        if ((body.match(/https?:\/\/|www\./gi) || []).length > 1) { flags.push("many-links"); score += 20; }
        if (/(.)\1{6,}/.test(body)) { flags.push("repeat-chars"); score += 18; }
        if (words.length > 20) {
          const unique = new Set(words.map(function (w) { return w.toLowerCase(); }));
          if (unique.size / words.length < 0.42) { flags.push("low-uniqueness"); score += 12; }
        }

        if (state.member && state.member.created_at) {
          const ageDays = (Date.now() - new Date(state.member.created_at).getTime()) / (1000 * 60 * 60 * 24);
          if (isFinite(ageDays) && ageDays < 7) { flags.push("new-account"); score += 18; }
        }

        return { score: clamp(score, 0, 100), flags: flags };
      }

      function computeReviewerWeight(riskScore) {
        const base = Number((state.member && state.member.trust_score) || 1);
        if (riskScore >= 70) return round(base * 0.45, 2);
        if (riskScore >= 50) return round(base * 0.7, 2);
        if (riskScore <= 12) return round(base * 1.05, 2);
        return round(base, 2);
      }

      function metricBox(label, value) {
        return '<article class="metric"><span class="label">' + esc(label) + '</span><span class="value">' + esc(value) + '</span></article>';
      }

      function avatarHtml(volunteer, size) {
        const style = 'style="width:' + Number(size || 44) + 'px;height:' + Number(size || 44) + 'px;"';
        if (volunteer.avatar_url) {
          return '<div class="avatar" ' + style + '><img src="' + esc(volunteer.avatar_url) + '" alt="avatar" loading="lazy"/></div>';
        }
        const initials = initialsOf(volunteer.display_name || "Volunteer");
        return '<div class="avatar" ' + style + '>' + esc(initials) + '</div>';
      }

      function initialsOf(name) {
        const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "V";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function normalizeDomain(value) {
        return String(value || "").trim().toLowerCase().replace(/^@/, "");
      }

      function setStatus(node, text, type) {
        node.textContent = text;
        node.className = "status" + (type ? " " + type : "");
      }

      function mean(values) {
        if (!values.length) return 0;
        return values.reduce(function (sum, v) { return sum + Number(v || 0); }, 0) / values.length;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function round(value, places) {
        const p = Math.pow(10, places || 0);
        return Math.round(value * p) / p;
      }

      function stars(rating) {
        const r = clamp(Math.round(Number(rating || 0)), 0, 5);
        return "★".repeat(r) + "☆".repeat(5 - r);
      }

      function formatDate(iso) {
        const d = new Date(iso);
        if (!isFinite(d.getTime())) return "Unknown";
        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
      }

      function relDate(iso) {
        const d = new Date(iso);
        const diff = Date.now() - d.getTime();
        if (!isFinite(diff)) return "unknown";
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return mins + "m ago";
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        const days = Math.floor(hours / 24);
        if (days < 30) return days + "d ago";
        return formatDate(iso);
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    })();
  </script>
</body>
</html>
