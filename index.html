<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MK Chess Club Reviews</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f3ef;
      --panel: #ffffff;
      --line: #e2dfd8;
      --line-strong: #d4d0c8;
      --ink: #1f1d19;
      --muted: #6d675f;
      --brand: #106d4d;
      --brand-soft: #e7f2ed;
      --warn: #8f5f1d;
      --danger: #8b3434;
      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow: 0 12px 28px rgba(20, 16, 10, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Sora", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #f7f6f2, #f2efe8);
    }

    .app {
      width: min(1200px, 96vw);
      margin: 16px auto 40px;
      display: grid;
      gap: 12px;
    }

    .top {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .top-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .brand {
      display: grid;
      gap: 2px;
      line-height: 1;
    }

    .brand small {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--brand);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      letter-spacing: -0.02em;
      font-weight: 800;
    }

    .login {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    .login input {
      width: min(360px, 100%);
      padding: 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      font: inherit;
      background: #fff;
    }

    .meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .settings-launch { padding-inline: 12px; }

    .pill {
      border: 1px solid #d7d3cb;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      background: #f9f7f2;
      color: #504a42;
      white-space: nowrap;
    }

    .pill.live { background: var(--brand-soft); border-color: #b7d5c7; color: #1e5a44; }

    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 11px;
      border: 1px solid #0e5b41;
      background: #0f6f4e;
      color: #fff;
      padding: 10px 13px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.ghost {
      background: #fff;
      color: #1b5a45;
      border-color: #9dc7b6;
    }

    button.warn {
      background: #8f5f1d;
      border-color: #764f18;
    }

    button.danger {
      background: #8b3434;
      border-color: #6d2727;
    }

    button.mini {
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
    }

    .status-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: #585148;
      background: #faf8f3;
    }

    .status.ok {
      color: #0f5a41;
      border-color: #acd0c0;
      background: #e3f1ea;
    }

    .status.err {
      color: #7a2626;
      border-color: #deb4b4;
      background: #f8e7e7;
    }

    .status:empty { display: none; }

    .settings-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.3fr 0.8fr auto;
      gap: 8px;
      align-items: center;
    }

    .settings-grid input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      font: inherit;
      min-width: 0;
    }

    .settings-actions { display: flex; gap: 6px; }

    .layout {
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .stack { display: grid; gap: 10px; }

    .left-head {
      display: grid;
      gap: 8px;
    }

    .left-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .left-head input,
    .left-head select,
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    .vol-list {
      display: grid;
      gap: 7px;
      max-height: calc(100vh - 250px);
      overflow: auto;
      padding-right: 2px;
    }

    .vol-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 9px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      cursor: pointer;
    }

    .vol-item.active {
      border-color: #9ec4b4;
      box-shadow: 0 0 0 2px rgba(16, 109, 77, 0.11) inset;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid #d8d2c6;
      background: #f2eee3;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #4c4338;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .vol-item h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.2;
    }

    .muted { color: var(--muted); font-size: 12px; }

    .score {
      border: 1px solid #ddd5c7;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #5b5247;
      background: #f8f4ea;
      white-space: nowrap;
    }

    .profile {
      display: grid;
      gap: 10px;
    }

    .hero {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffef9;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .hero-top {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .hero-top .avatar { width: 58px; height: 58px; border-radius: 14px; }

    .hero h2 {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 30px);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .chips { display: flex; gap: 6px; flex-wrap: wrap; }

    .chip {
      border: 1px solid #d9d2c4;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      color: #594f43;
      background: #f8f4ea;
    }

    .chip.reward {
      border-color: #b9d8c8;
      background: #eaf5ef;
      color: #1c5b44;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      padding: 9px;
      display: grid;
      gap: 2px;
    }

    .metric .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #736c63; }
    .metric .v { font-size: 19px; font-weight: 800; line-height: 1; }

    .reviews {
      display: grid;
      gap: 8px;
    }

    .review {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .session-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .session-actions button.active {
      background: #0f6f4e;
      color: #fff;
      border-color: #0d5d42;
    }

    .session-list {
      display: grid;
      gap: 8px;
    }

    .session-row {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .session-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .session-status {
      border: 1px solid #d9d2c4;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #5e5549;
      background: #f8f4ea;
      white-space: nowrap;
    }

    .session-status.ok {
      border-color: #b9d8c8;
      background: #eaf5ef;
      color: #1c5b44;
    }

    .review-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .headline { font-size: 15px; font-weight: 700; margin-top: 2px; }
    .stars { font-size: 13px; letter-spacing: 0.06em; color: #845922; }

    .dialog {
      border: 1px solid var(--line);
      border-radius: 16px;
      width: min(780px, 95vw);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      box-shadow: 0 20px 46px rgba(17, 13, 8, 0.22);
      padding: 0;
    }

    .dialog::backdrop { background: rgba(18, 15, 12, 0.42); }

    .dialog-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .dialog-head h3 { margin: 0; font-size: 20px; }

    .field { display: grid; gap: 5px; }
    .field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: #544b40; font-weight: 700; }
    .field textarea { min-height: 115px; resize: vertical; }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bars { display: grid; gap: 7px; }
    .bar-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; }

    .bar-track {
      height: 8px;
      border-radius: 999px;
      border: 1px solid #e2dac8;
      background: #f3efe3;
      overflow: hidden;
    }

    .bar-track > span { height: 100%; display: block; background: linear-gradient(90deg, #0f6f4f, #2f8d6b); }

    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 11px;
      background: #fbfaf6;
      padding: 12px;
      color: #6c665d;
      font-size: 13px;
      text-align: center;
    }

    .empty-actions {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 1080px) {
      .top-row { grid-template-columns: 1fr; }
      .meta { justify-content: flex-start; }
      .login { justify-content: flex-start; flex-wrap: wrap; }
      .layout { grid-template-columns: 1fr; }
      .vol-list { max-height: 320px; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
      .rating-grid { grid-template-columns: 1fr 1fr; }
      .split { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .app { width: 98vw; margin-top: 10px; }
      .hero-top { grid-template-columns: 1fr; }
      .hero-top .actions { justify-content: flex-start; }
      .metric-grid { grid-template-columns: 1fr; }
      .rating-grid { grid-template-columns: 1fr; }
      .dialog { width: 97vw; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <small>MK Chess Club</small>
          <h1>Volunteer Reviews</h1>
        </div>

        <div class="login">
          <input id="emailInput" type="email" placeholder="member@yourdomain.com" />
          <button id="sendLinkBtn" type="button">Send Link</button>
          <button id="signOutBtn" type="button" class="ghost" style="display:none;">Sign Out</button>
        </div>

        <div class="meta">
          <button id="openSettingsBtn" type="button" class="ghost mini settings-launch">Settings</button>
        </div>
      </div>

      <div class="status-row">
        <p id="authStatus" class="status"></p>
        <p id="backendStatusTop" class="status"></p>
      </div>
    </header>

    <section class="layout">
      <aside class="panel">
        <div class="left-head">
          <div class="left-actions">
            <button id="addVolunteerBtn" type="button" class="mini">Add volunteer</button>
            <button id="startSetupBtn" type="button" class="mini ghost">Start setup</button>
          </div>
          <input id="searchInput" type="text" placeholder="Search volunteers" />
          <select id="sortSelect">
            <option value="top">Top rated</option>
            <option value="reviews">Most reviewed</option>
            <option value="name">Name A-Z</option>
          </select>
        </div>
        <div id="volunteerList" class="vol-list">
          <div class="empty">Loading volunteers...</div>
        </div>
      </aside>

      <section class="panel">
        <div id="profileSurface" class="profile">
          <div class="empty">Select a volunteer</div>
        </div>
      </section>
    </section>

    <dialog id="settingsDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Settings</h3>
          <button type="button" class="ghost mini" data-close="settingsDialog">Close</button>
        </div>
        <div class="settings-grid">
          <input id="supaUrlInput" type="url" placeholder="Supabase URL" />
          <input id="supaKeyInput" type="password" placeholder="Supabase anon key" />
          <input id="allowedDomainInput" type="text" placeholder="Email domain" />
          <div class="settings-actions">
            <button id="connectBtn" type="button" class="mini">Connect</button>
            <button id="demoBtn" type="button" class="mini warn">Demo</button>
          </div>
        </div>
        <p id="backendStatus" class="status"></p>
      </div>
    </dialog>

    <dialog id="reviewDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Write Review</h3>
          <button type="button" class="ghost mini" data-close="reviewDialog">Close</button>
        </div>
        <form id="reviewForm" class="stack">
          <div class="split">
            <div class="field">
              <label for="reviewEventSelect">Event</label>
              <select id="reviewEventSelect" required></select>
            </div>
            <div class="field">
              <label for="reviewVolunteerSelect">Volunteer</label>
              <select id="reviewVolunteerSelect" required></select>
            </div>
          </div>

          <div class="rating-grid">
            <div class="field"><label for="overallRating">Overall</label><select id="overallRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="commRating">Communication</label><select id="commRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="relRating">Reliability</label><select id="relRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="warmRating">Welcoming</label><select id="warmRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
            <div class="field"><label for="clearRating">Clarity</label><select id="clearRating" required><option value="">-</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
          </div>

          <div class="field">
            <label for="reviewTitleInput">Headline</label>
            <input id="reviewTitleInput" type="text" maxlength="110" placeholder="Short summary" />
          </div>
          <div class="field">
            <label for="reviewBodyInput">Review</label>
            <textarea id="reviewBodyInput" maxlength="2000" placeholder="Details"></textarea>
          </div>

          <label class="muted"><input id="truthCheckbox" type="checkbox" /> Real event, truthful review</label>
          <button id="submitReviewBtn" type="submit">Submit Review</button>
          <p id="reviewStatus" class="status"></p>
        </form>
      </div>
    </dialog>

    <dialog id="addVolunteerDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Add Volunteer</h3>
          <button type="button" class="ghost mini" data-close="addVolunteerDialog">Close</button>
        </div>
        <form id="addVolunteerForm" class="stack">
          <div class="field">
            <label for="addVolunteerName">Name</label>
            <input id="addVolunteerName" type="text" maxlength="80" placeholder="Volunteer name" required />
          </div>
          <div class="field">
            <label for="addVolunteerTagline">Tagline</label>
            <input id="addVolunteerTagline" type="text" maxlength="120" placeholder="Optional short role summary" />
          </div>
          <div class="field">
            <label for="addVolunteerBio">Bio</label>
            <textarea id="addVolunteerBio" maxlength="800" placeholder="Optional profile bio"></textarea>
          </div>
          <p id="addVolunteerHint" class="muted"></p>
          <p id="addVolunteerStatus" class="status"></p>
          <div class="left-actions">
            <button id="createVolunteerBtn" type="submit">Create Volunteer</button>
            <button id="sendLinkFromDialogBtn" type="button" class="mini ghost">Send login link</button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="reportDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Report</h3>
          <button type="button" class="ghost mini" data-close="reportDialog">Close</button>
        </div>
        <form id="reportForm" class="stack">
          <div class="split">
            <div class="field">
              <label for="reportVolunteerSelect">Volunteer</label>
              <select id="reportVolunteerSelect" required></select>
            </div>
            <div class="field">
              <label for="reportEventSelect">Event</label>
              <select id="reportEventSelect"><option value="">No event</option></select>
            </div>
          </div>

          <div class="split">
            <div class="field">
              <label for="reportReasonSelect">Reason</label>
              <select id="reportReasonSelect" required>
                <option value="">-</option>
                <option value="conduct">Conduct</option>
                <option value="safety">Safety</option>
                <option value="bias">Bias</option>
                <option value="absence">No-show</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="reportSeveritySelect">Severity</label>
              <select id="reportSeveritySelect">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="reportDetailsInput">Details</label>
            <textarea id="reportDetailsInput" maxlength="1500" placeholder="Facts and context"></textarea>
          </div>

          <button id="submitReportBtn" class="danger" type="submit">Submit Report</button>
          <p id="reportStatus" class="status"></p>
        </form>
      </div>
    </dialog>

    <dialog id="studioDialog" class="dialog">
      <div class="dialog-body">
        <div class="dialog-head">
          <h3>Volunteer Studio</h3>
          <button type="button" class="ghost mini" data-close="studioDialog">Close</button>
        </div>

        <div id="studioGate" class="empty"></div>

        <section id="studioContent" style="display:none;">
          <div class="split">
            <form id="profileForm" class="stack">
              <div class="field"><label for="profileDisplayName">Display Name</label><input id="profileDisplayName" type="text" maxlength="80" /></div>
              <div class="field"><label for="profileTagline">Tagline</label><input id="profileTagline" type="text" maxlength="120" /></div>
              <div class="field"><label for="profileAvatarUrl">Avatar URL</label><input id="profileAvatarUrl" type="url" /></div>
              <div class="field"><label for="profileBio">Bio</label><textarea id="profileBio" maxlength="800"></textarea></div>
              <label class="muted"><input id="profileActive" type="checkbox" /> Public profile visible</label>
              <button id="saveProfileBtn" type="submit">Save Profile</button>
              <p id="profileStatus" class="status"></p>
            </form>

            <section class="stack">
              <div id="studioMetrics" class="metric-grid"></div>
              <div class="panel" style="padding:8px; box-shadow:none;"><div class="bars" id="categoryBars"></div></div>
              <div class="panel" style="padding:8px; box-shadow:none;"><div class="bars" id="trendBars"></div></div>
            </section>
          </div>

          <div class="split">
            <section class="stack">
              <div class="muted">Upcoming sessions</div>
              <div id="studioSessions" class="session-list"></div>
              <p id="studioSessionStatus" class="status"></p>
            </section>
            <section class="stack"><div class="muted">Incentives</div><div id="studioIncentives" class="chips"></div></section>
          </div>

          <section class="stack"><div class="muted">Recent reviews</div><div id="studioRecentReviews" class="reviews"></div></section>
          <section class="stack"><div class="muted">Open reports</div><div id="studioOpenReports" class="reviews"></div></section>
        </section>
      </div>
    </dialog>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {

          { id: "c6", volunteer_id: "v4", event_id: "e6", status: "committed", updated_at: "2026-04-10T10:40:00Z" }
        ]
      };

      const state = {
        supabase: null,
        authSub: null,
        demoMode: true,
        loadingData: false,
        setupRunning: false,
        user: null,
        member: null,
        volunteerLink: null,
        volunteers: [],
        events: [],
        upcomingEvents: [],
        eventVolunteerMap: {},
        reviews: [],
        reports: [],
        commitments: [],
        incentivesByVolunteer: {},
        selectedVolunteerId: null,
        helpfulVotedIds: {}
      };

      const el = {};

      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        cacheEls();
        bindEvents();
        restoreConfig();
        renderAll();
        state.loadingData = true;
        try {
          await connectWithStoredConfig();
          await refreshSession();
          await withTimeout(loadAllData(), 12000, "Data load timed out");
        } catch (err) {
          const msg = err && err.message ? err.message : String(err || "Init failed");
          setBackendStatus("Init error: " + msg, "err");
        } finally {
          state.loadingData = false;
        }
        renderAll();
      }
      function cacheEls() {
        [
          "emailInput", "sendLinkBtn", "signOutBtn", "supaUrlInput", "supaKeyInput", "allowedDomainInput",
          "openSettingsBtn", "settingsDialog", "connectBtn", "demoBtn", "authStatus", "backendStatus", "backendStatusTop", "searchInput", "sortSelect", "volunteerList", "profileSurface", "addVolunteerBtn", "startSetupBtn",
          "reviewDialog", "reviewForm", "reviewEventSelect", "reviewVolunteerSelect", "overallRating", "commRating", "relRating", "warmRating", "clearRating",
          "reviewTitleInput", "reviewBodyInput", "truthCheckbox", "submitReviewBtn", "reviewStatus",
          "addVolunteerDialog", "addVolunteerForm", "addVolunteerName", "addVolunteerTagline", "addVolunteerBio", "addVolunteerHint", "createVolunteerBtn", "sendLinkFromDialogBtn", "addVolunteerStatus",
          "reportDialog", "reportForm", "reportVolunteerSelect", "reportEventSelect", "reportReasonSelect", "reportSeveritySelect", "reportDetailsInput", "submitReportBtn", "reportStatus",
          "studioDialog", "studioGate", "studioContent", "profileForm", "profileDisplayName", "profileTagline", "profileAvatarUrl", "profileBio", "profileActive", "saveProfileBtn", "profileStatus",
          "studioMetrics", "categoryBars", "trendBars", "studioSessions", "studioSessionStatus", "studioIncentives", "studioRecentReviews", "studioOpenReports"
        ].forEach(function (id) { el[id] = document.getElementById(id); });
      }

      function bindEvents() {
        el.openSettingsBtn.addEventListener("click", function () {
          if (!el.settingsDialog.open) el.settingsDialog.showModal();
        });
        el.connectBtn.addEventListener("click", onConnectClick);
        el.demoBtn.addEventListener("click", onDemoClick);
        el.sendLinkBtn.addEventListener("click", onSendMagicLink);
        el.signOutBtn.addEventListener("click", onSignOut);
        el.addVolunteerBtn.addEventListener("click", openAddVolunteerDialog);
        el.startSetupBtn.addEventListener("click", runOwnerSetup);
        el.sendLinkFromDialogBtn.addEventListener("click", onSendMagicLink);
        el.searchInput.addEventListener("input", renderVolunteerList);
        el.sortSelect.addEventListener("change", renderVolunteerList);
        el.volunteerList.addEventListener("click", onVolunteerClick);
        el.profileSurface.addEventListener("click", onProfileClick);
        el.studioContent.addEventListener("click", onStudioContentClick);
        el.reviewEventSelect.addEventListener("change", renderReviewVolunteerOptions);
        el.reviewForm.addEventListener("submit", onSubmitReview);
        el.addVolunteerForm.addEventListener("submit", onCreateVolunteer);
        el.reportForm.addEventListener("submit", onSubmitReport);
        el.profileForm.addEventListener("submit", onSaveProfile);
        document.addEventListener("click", onGlobalClick);
      }

      function onGlobalClick(event) {
        const close = event.target.closest("[data-close]");
        if (!close) return;
        const id = close.getAttribute("data-close");
        if (id && el[id] && typeof el[id].close === "function") {
          el[id].close();
        }
      }

      function restoreConfig() {
        const savedUrl = safeStorageGet(STORAGE.url);
        const savedKey = safeStorageGet(STORAGE.key);
        el.supaUrlInput.value = savedUrl || DEFAULT_SUPABASE.url;
        el.supaKeyInput.value = savedKey || DEFAULT_SUPABASE.anonKey;
        el.allowedDomainInput.value = safeStorageGet(STORAGE.domain) || "";
        if (!savedUrl) safeStorageSet(STORAGE.url, DEFAULT_SUPABASE.url);
        if (!savedKey) safeStorageSet(STORAGE.key, DEFAULT_SUPABASE.anonKey);
      }

      async function onConnectClick() {
        safeStorageSet(STORAGE.url, (el.supaUrlInput.value || DEFAULT_SUPABASE.url).trim());
        safeStorageSet(STORAGE.key, (el.supaKeyInput.value || DEFAULT_SUPABASE.anonKey).trim());
        safeStorageSet(STORAGE.domain, normalizeDomain(el.allowedDomainInput.value || ""));
        await connectWithStoredConfig();
        await refreshSession();
        await loadAllData();
        renderAll();
        if (!state.demoMode && el.settingsDialog.open) {
          el.settingsDialog.close();
        }
      }

      async function onDemoClick() {
        state.demoMode = true;
        state.supabase = null;
        detachAuthSubscription();
        state.user = null;
        state.member = null;
        state.volunteerLink = null;
        state.helpfulVotedIds = {};
        setBackendStatus("Backend: demo mode", "ok");
        await loadAllData();
        renderAll();
        if (el.settingsDialog.open) {
          el.settingsDialog.close();
        }
      }

      async function connectWithStoredConfig() {
        const url = (safeStorageGet(STORAGE.url) || DEFAULT_SUPABASE.url).trim();
        const key = (safeStorageGet(STORAGE.key) || DEFAULT_SUPABASE.anonKey).trim();

        if (!url || !key) {
          state.demoMode = true;
          state.supabase = null;
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          setBackendStatus("Backend: no credentials (demo)", "err");
          return;
        }

        try {
          state.supabase = window.supabase.createClient(url, key, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
              flowType: "pkce",
              storageKey: "mk_volunteer_reviews_auth_v1"
            }
          });
          state.demoMode = false;
          attachAuthSubscription();
          const projectId = projectIdFromUrl(url) || DEFAULT_SUPABASE.projectId;
          setBackendStatus("Backend: connected (" + projectId + ")", "ok");
        } catch (_err) {
          state.demoMode = true;
          state.supabase = null;
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          setBackendStatus("Backend: connection failed (demo)", "err");
        }
      }

      function attachAuthSubscription() {
        detachAuthSubscription();
        state.authSub = state.supabase.auth.onAuthStateChange(async function (_event, session) {
          if (session && session.access_token && session.refresh_token) {
            saveAuthBackup(session);
          } else if (_event === "SIGNED_OUT") {
            clearAuthBackup();
          }

          state.user = session ? session.user : null;
          state.helpfulVotedIds = {};
          await loadMemberProfile();
          await loadVolunteerLink();
          await loadAllData();
          renderAll();
        });
      }

      function detachAuthSubscription() {
        if (state.authSub && state.authSub.data && state.authSub.data.subscription) {
          state.authSub.data.subscription.unsubscribe();
        }
        state.authSub = null;
      }

      async function refreshSession() {
        if (state.demoMode || !state.supabase) {
          state.user = null;
          state.member = null;
          state.volunteerLink = null;
          state.helpfulVotedIds = {};
          return;
        }

        let session = null;
        const sessionResp = await state.supabase.auth.getSession();
        if (sessionResp.data && sessionResp.data.session) {
          session = sessionResp.data.session;
        }

        if (!session) {
          const backup = readAuthBackup();
          if (backup && backup.access_token && backup.refresh_token) {
            const restored = await state.supabase.auth.setSession({
              access_token: backup.access_token,
              refresh_token: backup.refresh_token
            });
            if (!restored.error && restored.data && restored.data.session) {
              session = restored.data.session;
            } else {
              clearAuthBackup();
            }
          }
        }

        if (session && session.access_token && session.refresh_token) {
          saveAuthBackup(session);
        }

        state.user = session ? session.user : null;
        state.helpfulVotedIds = {};
        await loadMemberProfile();
        await loadVolunteerLink();
      }

      async function loadMemberProfile() {
        if (state.demoMode) {
          state.member = state.user ? DEMO.member : null;
          return;
        }

        state.member = null;
        if (!state.user) return;

        const resp = await state.supabase
          .from("member_profiles")
          .select("display_name,status,role,trust_score,created_at,volunteer_id")
          .eq("user_id", state.user.id)
          .maybeSingle();

        if (resp.error) {
          const secure = await state.supabase.rpc("get_my_member_profile_secure");
          if (!secure.error) {
            const row = Array.isArray(secure.data) ? secure.data[0] : secure.data;
            if (row) {
              state.member = {
                display_name: row.display_name || (state.user.email || "Member"),
                status: row.status || "pending",
                role: row.role || "member",
                trust_score: Number(row.trust_score || 1),
                created_at: row.created_at || new Date().toISOString(),
                volunteer_id: row.volunteer_id || null
              };
              return;
            }
          }

          state.member = {
            display_name: state.user.email || "Member",
            status: "pending",
            role: "member",
            trust_score: 1.0,
            created_at: new Date().toISOString(),
            volunteer_id: null
          };
          return;
        }

        state.member = resp.data || {
          display_name: state.user.email || "Member",
          status: "pending",
          role: "member",
          trust_score: 1.0,
          created_at: new Date().toISOString(),
          volunteer_id: null
        };
      }

      async function loadVolunteerLink() {
        if (state.demoMode) {
          state.volunteerLink = state.user ? DEMO.volunteerLink : null;
          return;
        }

        state.volunteerLink = null;
        if (!state.user) return;

        let found = null;

        const direct = await state.supabase.from("volunteers").select("id").eq("user_id", state.user.id).maybeSingle();
        if (!direct.error && direct.data && direct.data.id) {
          found = { volunteer_id: direct.data.id, source: "volunteers.user_id" };
        }

        if (!found) {
          const mapped = await state.supabase.from("volunteer_accounts").select("volunteer_id").eq("user_id", state.user.id).maybeSingle();
          if (!mapped.error && mapped.data && mapped.data.volunteer_id) {
            found = { volunteer_id: mapped.data.volunteer_id, source: "volunteer_accounts" };
          }
        }

        if (!found) {
          const profileMap = await state.supabase.from("member_profiles").select("volunteer_id").eq("user_id", state.user.id).maybeSingle();
          if (!profileMap.error && profileMap.data && profileMap.data.volunteer_id) {
            found = { volunteer_id: profileMap.data.volunteer_id, source: "member_profiles.volunteer_id" };
          }
        }

        if (!found && state.member && state.member.volunteer_id) {
          found = { volunteer_id: state.member.volunteer_id, source: "member_profile_secure" };
        }

        state.volunteerLink = found;
      }

      async function loadAllData() {
        if (state.demoMode) {
          const nowMs = Date.now();
          state.volunteers = DEMO.volunteers.slice();
          state.events = DEMO.events.filter(function (ev) {
            return new Date(ev.starts_at).getTime() <= nowMs;
          }).sort(function (a, b) { return new Date(b.starts_at) - new Date(a.starts_at); });
          state.upcomingEvents = DEMO.events.filter(function (ev) {
            return new Date(ev.starts_at).getTime() >= (nowMs - (2 * 60 * 60 * 1000));
          }).sort(function (a, b) { return new Date(a.starts_at) - new Date(b.starts_at); });
          state.eventVolunteerMap = JSON.parse(JSON.stringify(DEMO.eventVolunteerMap));
          state.reviews = DEMO.reviews.slice();
          state.reports = DEMO.reports.slice();
          state.commitments = (DEMO.commitments || []).slice();
          state.incentivesByVolunteer = groupIncentivesByVolunteer(DEMO.incentives || []);
          if (!state.selectedVolunteerId && state.volunteers[0]) state.selectedVolunteerId = state.volunteers[0].id;
          return;
        }

        await loadVolunteers();
        await Promise.all([loadReviews(), loadReports(), loadHelpfulVotes(), loadIncentives()]);
        await loadReviewEvents();
        await loadUpcomingEvents();
        await loadCommitments();

        if (!state.selectedVolunteerId && state.volunteers[0]) {
          state.selectedVolunteerId = state.volunteers[0].id;
        }
      }

      async function loadVolunteers() {
        let resp = await state.supabase
          .from("volunteers")
          .select("id,display_name,tagline,bio,avatar_url,active")
          .eq("active", true)
          .order("display_name", { ascending: true });

        if (resp.error) {
          resp = await state.supabase
            .from("volunteers")
            .select("id,display_name,bio,avatar_url,active")
            .eq("active", true)
            .order("display_name", { ascending: true });
        }

        if (resp.error) {
          state.volunteers = [];
          const secure = await state.supabase.rpc("list_volunteers_public_secure");
          if (!secure.error) {
            state.volunteers = secure.data || [];
            return;
          }
          setBackendStatus("Data load issue: volunteers", "err");
          return;
        }

        state.volunteers = resp.data || [];
        if (!state.volunteers.length) {
          const secure = await state.supabase.rpc("list_volunteers_public_secure");
          if (!secure.error && (secure.data || []).length) {
            state.volunteers = secure.data || [];
          }
        }
      }

      async function loadReviews() {
        const resp = await state.supabase
          .from("reviews")
          .select("id,volunteer_id,event_id,overall_rating,communication_rating,reliability_rating,warmth_rating,clarity_rating,title,body,helpful_count,moderation_status,status,authenticity_score,reviewer_weight,created_at,volunteers(display_name),club_events(title,starts_at)")
          .order("created_at", { ascending: false })
          .limit(400);

        if (resp.error) {
          state.reviews = [];
          setBackendStatus("Data load issue: reviews", "err");
          return;
        }

        state.reviews = (resp.data || []).filter(function (row) {
          const st = row.moderation_status || row.status || "published";
          return st === "published";
        });
      }

      async function loadReports() {
        const resp = await state.supabase
          .from("volunteer_reports")
          .select("id,volunteer_id,event_id,status,severity,reason,details,created_at")
          .order("created_at", { ascending: false })
          .limit(200);

        if (resp.error) {
          state.reports = [];
          setBackendStatus("Data load issue: reports", "err");
          return;
        }

        state.reports = resp.data || [];
      }

      async function loadUpcomingEvents() {
        state.upcomingEvents = [];
        if (state.demoMode || !state.supabase) return;

        const windowStart = new Date(Date.now() - (6 * 60 * 60 * 1000)).toISOString();
        const resp = await state.supabase
          .from("club_events")
          .select("id,title,starts_at")
          .gte("starts_at", windowStart)
          .order("starts_at", { ascending: true })
          .limit(60);

        if (resp.error) {
          return;
        }

        state.upcomingEvents = resp.data || [];
        if (!state.upcomingEvents.length) return;

        const eventIds = state.upcomingEvents.map(function (ev) { return ev.id; });
        const shifts = await state.supabase
          .from("volunteer_event_shifts")
          .select("event_id,volunteer_id")
          .in("event_id", eventIds);

        if (!shifts.error) {
          (shifts.data || []).forEach(function (row) {
            if (!state.eventVolunteerMap[row.event_id]) state.eventVolunteerMap[row.event_id] = [];
            if (!state.eventVolunteerMap[row.event_id].includes(row.volunteer_id)) {
              state.eventVolunteerMap[row.event_id].push(row.volunteer_id);
            }
          });
        }

        const allVolunteerIds = state.volunteers.map(function (v) { return v.id; });
        state.upcomingEvents.forEach(function (ev) {
          const mapped = state.eventVolunteerMap[ev.id];
          if (!Array.isArray(mapped) || !mapped.length) {
            state.eventVolunteerMap[ev.id] = allVolunteerIds.slice();
          }
        });
      }

      async function loadCommitments() {
        state.commitments = [];
        if (state.demoMode || !state.supabase) return;

        let resp = await state.supabase
          .from("volunteer_commitments")
          .select("id,volunteer_id,event_id,status,note,updated_at,created_at")
          .order("updated_at", { ascending: false })
          .limit(2000);

        if (resp.error) {
          resp = await state.supabase
            .from("volunteer_commitments")
            .select("id,volunteer_id,event_id,status,updated_at,created_at")
            .order("updated_at", { ascending: false })
            .limit(2000);
        }

        if (resp.error) return;
        state.commitments = resp.data || [];
      }

      async function loadIncentives() {
        state.incentivesByVolunteer = {};
        if (state.demoMode || !state.supabase) return;

        let resp = await state.supabase
          .from("volunteer_incentive_achievements")
          .select("id,volunteer_id,code,title,detail,earned_at")
          .order("earned_at", { ascending: false })
          .limit(1000);

        if (resp.error) {
          resp = await state.supabase
            .from("volunteer_incentive_achievements")
            .select("id,volunteer_id,code,title,earned_at")
            .order("earned_at", { ascending: false })
            .limit(1000);
        }

        if (resp.error) {
          return;
        }

        state.incentivesByVolunteer = groupIncentivesByVolunteer(resp.data || []);
      }

      async function loadHelpfulVotes() {
        if (state.demoMode || !state.supabase || !state.user) {
          state.helpfulVotedIds = {};
          return;
        }

        const resp = await state.supabase
          .from("review_helpfulness")
          .select("review_id,vote")
          .eq("voter_user_id", state.user.id)
          .gt("vote", 0)
          .limit(1000);

        if (resp.error) return;

        const map = {};
        (resp.data || []).forEach(function (row) {
          if (row.review_id != null) map[String(row.review_id)] = true;
        });
        state.helpfulVotedIds = map;
      }
      async function loadReviewEvents() {
        state.events = [];
        state.eventVolunteerMap = {};

        if (!state.user || !state.member || state.member.status !== "approved") {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);

          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const attendance = await state.supabase
          .from("event_attendance")
          .select("event_id,verified,club_events(id,title,starts_at)")
          .eq("member_user_id", state.user.id)
          .eq("verified", true);

        if (attendance.error) {
          const fallback = await state.supabase
            .from("club_events")
            .select("id,title,starts_at")
            .lte("starts_at", new Date().toISOString())
            .order("starts_at", { ascending: false })
            .limit(40);
          state.events = fallback.error ? [] : (fallback.data || []);
          wireAllVolunteersToEvents();
          return;
        }

        const map = {};
        (attendance.data || []).forEach(function (row) {
          if (row.club_events && row.club_events.id) map[row.club_events.id] = row.club_events;
        });
        state.events = Object.values(map);

        if (!state.events.length) {
          wireAllVolunteersToEvents();
          return;
        }

        const ids = state.events.map(function (e) { return e.id; });
        const shifts = await state.supabase.from("volunteer_event_shifts").select("event_id,volunteer_id").in("event_id", ids);

        if (!shifts.error) {
          (shifts.data || []).forEach(function (row) {
            if (!state.eventVolunteerMap[row.event_id]) state.eventVolunteerMap[row.event_id] = [];
            state.eventVolunteerMap[row.event_id].push(row.volunteer_id);
          });
        }

        if (!Object.keys(state.eventVolunteerMap).length) wireAllVolunteersToEvents();
      }

      function wireAllVolunteersToEvents() {
        const ids = state.volunteers.map(function (v) { return v.id; });
        state.events.forEach(function (ev) { state.eventVolunteerMap[ev.id] = ids.slice(); });
      }

      async function onSendMagicLink() {
        if (state.user) {
          setStatus(el.authStatus, "Already signed in.", "ok");
          return;
        }

        const email = (el.emailInput.value || "").trim().toLowerCase();
        if (!email || email.indexOf("@") < 0) {
          setStatus(el.authStatus, "Enter valid email.", "err");
          return;
        }

        const domain = normalizeDomain(safeStorageGet(STORAGE.domain) || "");
        if (domain && !email.endsWith("@" + domain)) {
          setStatus(el.authStatus, "Use @" + domain, "err");
          return;
        }

        if (state.demoMode || !state.supabase) {
          setStatus(el.authStatus, "Connect backend first.", "err");
          setBackendStatus("Open Settings and connect Supabase.", "err");
          if (el.settingsDialog && typeof el.settingsDialog.showModal === "function" && !el.settingsDialog.open) {
            el.settingsDialog.showModal();
          }
          return;
        }

        el.sendLinkBtn.disabled = true;
        try {
          const redirect = window.location.origin + window.location.pathname;
          const resp = await state.supabase.auth.signInWithOtp({
            email: email,
            options: {
              emailRedirectTo: redirect,
              shouldCreateUser: true
            }
          });
          if (resp.error) {
            setStatus(el.authStatus, "Login failed. Check settings/domain.", "err");
            return;
          }
          setStatus(el.authStatus, "Login link sent. Open it in this same browser to stay signed in.", "ok");
        } catch (_err) {
          setStatus(el.authStatus, "Login failed. Network error.", "err");
        } finally {
          el.sendLinkBtn.disabled = false;
        }
      }

        if (!state.demoMode && state.supabase) await state.supabase.auth.signOut();
        clearAuthBackup();
        state.user = null;
        state.member = null;
        state.volunteerLink = null;
        state.helpfulVotedIds = {};
        clearStatus(el.authStatus);
        await loadAllData();
        renderAll();
      }

      function onVolunteerClick(event) {
        const action = event.target.closest("[data-action]");
        if (action) {
          const type = action.getAttribute("data-action");
          if (type === "demo") {
            onDemoClick();
            return;
          }
          if (type === "add-volunteer") {
            openAddVolunteerDialog();
            return;
          }
          if (type === "setup") {
            runOwnerSetup();
            return;
          }
          if (type === "settings") {
            if (!el.settingsDialog.open) el.settingsDialog.showModal();
            return;
          }
        }

        const item = event.target.closest("[data-volunteer]");
        if (!item) return;
        state.selectedVolunteerId = item.getAttribute("data-volunteer");
        renderVolunteerList();
        renderProfile();
      }

      function onProfileClick(event) {
        const action = event.target.closest("[data-action]");
        if (!action) {
          const helpful = event.target.closest("[data-helpful]");
          if (helpful) markHelpful(helpful.getAttribute("data-helpful"));
          return;
        }

        const type = action.getAttribute("data-action");
        if (type === "review") {
          openReviewDialog();
        } else if (type === "report") {

        } else if (type === "demo") {

          if (!el.settingsDialog.open) el.settingsDialog.showModal();

      async function createVolunteerViaRpc(displayName, tagline, bio) {
        return withTimeout(state.supabase.rpc("create_volunteer_secure", {
          p_display_name: displayName,
          p_tagline: tagline || null,
          p_bio: bio || null,
          p_avatar_url: null,
          p_active: true
        }), 12000, "Create request timed out");
      }

      async function onCreateVolunteer(event) {
        event.preventDefault();
        updateAddVolunteerDialogState();
        clearStatus(el.addVolunteerStatus);

        const displayName = String(el.addVolunteerName.value || "").trim();
        const tagline = String(el.addVolunteerTagline.value || "").trim();
        const bio = String(el.addVolunteerBio.value || "").trim();

        if (displayName.length < 2) {
          setStatus(el.addVolunteerStatus, "Name must be at least 2 characters.", "err");
          return;
        }

        if (state.demoMode) {
          const newVolunteer = {
            id: "demo-v-" + Math.random().toString(16).slice(2),
            display_name: displayName,
            tagline: tagline,
            bio: bio,
            avatar_url: "",
            active: true
          };
          state.volunteers.push(newVolunteer);
          DEMO.volunteers.push(newVolunteer);
          state.selectedVolunteerId = newVolunteer.id;
          setStatus(el.addVolunteerStatus, "Volunteer added (demo).", "ok");
          renderAll();
          if (el.addVolunteerDialog.open) el.addVolunteerDialog.close();
          return;
        }

        if (!state.supabase) {
          setStatus(el.addVolunteerStatus, "Connect backend first.", "err");
          setBackendStatus("Connect backend first.", "err");
          return;
        }

        if (!state.user) {
          setStatus(el.addVolunteerStatus, "Sign in first. Use Send login link.", "err");
          setStatus(el.authStatus, "Sign in required to create volunteers.", "err");
          setBackendStatus("Sign in required before creating volunteers.", "err");
          return;
        }

        el.createVolunteerBtn.disabled = true;
        const originalLabel = el.createVolunteerBtn.textContent;
        el.createVolunteerBtn.textContent = "Creating...";

        try {
          let createdId = null;
          let rpcResp = await createVolunteerViaRpc(displayName, tagline, bio);

          if (rpcResp.error) {
            const message = String(rpcResp.error.message || "");
            const rpcMissing = isRpcMissingError(message, "create_volunteer_secure");
            const setupOrPermission =
              /moderator|admin|required|permission|not authorized|row-level security|violates row-level security/i.test(message);

            if (rpcMissing) {
              const friendly = "Backend setup is incomplete. Run supabase/all_in_one_setup.sql in Supabase SQL editor, then click Start setup.";
              setStatus(el.addVolunteerStatus, friendly, "err");
              setBackendStatus(friendly, "err");
              return;
            }

            if (setupOrPermission) {
              setStatus(el.addVolunteerStatus, "Completing setup, then retrying...", "ok");
              const setupOk = await runOwnerSetup({ silent: true, fromCreate: true });
              if (setupOk) {
                rpcResp = await createVolunteerViaRpc(displayName, tagline, bio);
              }
            }
          }

          if (rpcResp.error) {
            const message = String(rpcResp.error.message || "");
            const approvalBlocked = /moderator|admin|required|permission|not authorized/i.test(message);
            const friendly = approvalBlocked
              ? "Your account is still pending. Ask an admin to approve your member profile, then try again."
              : ("Create failed: " + message);
            setStatus(el.addVolunteerStatus, friendly, "err");
            setBackendStatus(friendly, "err");
            return;
          }

          createdId = rpcResp.data || null;

          await withTimeout(loadAllData(), 12000, "Reload timed out");
          if (createdId) state.selectedVolunteerId = createdId;
          renderAll();
          setStatus(el.addVolunteerStatus, "Volunteer added.", "ok");
          setBackendStatus("Volunteer added. Next: ask them to mark upcoming session attendance in Studio.", "ok");
          if (el.addVolunteerDialog.open) el.addVolunteerDialog.close();
        } catch (err) {
          const msg = err && err.message ? err.message : String(err || "Create failed");
          setStatus(el.addVolunteerStatus, msg, "err");
          setBackendStatus(msg, "err");
        } finally {
          el.createVolunteerBtn.disabled = false;
          el.createVolunteerBtn.textContent = originalLabel || "Create Volunteer";
        }
      }

      async function runOwnerSetup(options) {
        const opts = options || {};
        const silent = !!opts.silent;

        if (!state.user) {
          if (!silent) setStatus(el.authStatus, "Sign in first, then run setup.", "err");
          return false;
        }

        if (state.demoMode || !state.supabase) {
          if (!silent) {
            setBackendStatus("Connect Supabase first, then run setup.", "err");
            if (!el.settingsDialog.open) el.settingsDialog.showModal();
          }
          return false;
        }

        if (state.setupRunning) return false;
        state.setupRunning = true;
        updateAddVolunteerDialogState();

        if (!silent) setBackendStatus("Setting up workspace...", "ok");
        el.startSetupBtn.disabled = true;
        const setupLabel = el.startSetupBtn.textContent;
        el.startSetupBtn.textContent = "Setting up...";

        try {
          const preferredName = String(state.user.email || "Club Owner").split("@")[0];
          const rpcResp = await withTimeout(state.supabase.rpc("bootstrap_owner_setup_secure", {
            p_display_name: preferredName
          }), 12000, "Setup request timed out");

          if (rpcResp.error) {
            const message = String(rpcResp.error.message || "");
            if (isRpcMissingError(message, "bootstrap_owner_setup_secure")) {
              if (!silent) setBackendStatus("Setup RPC missing. Run supabase/all_in_one_setup.sql in Supabase SQL editor.", "err");
              return false;
            }
            if (!silent) setBackendStatus("Setup failed: " + message, "err");
            return false;
          }

          const meta = Array.isArray(rpcResp.data) ? rpcResp.data[0] : (rpcResp.data || {});
          await withTimeout(refreshSession(), 12000, "Session refresh timed out");
          await withTimeout(loadAllData(), 12000, "Data reload timed out");
          renderAll();

          const role = (state.member && state.member.role) ? state.member.role : (meta.member_role || "member");
          const status = (state.member && state.member.status) ? state.member.status : (meta.member_status || "pending");
          const createdCount = Number(meta.volunteer_count || 0);

          if (createdCount > 0 && state.volunteers.length === 0) {
            if (!silent) {
              setBackendStatus("Setup ran, but volunteer visibility is blocked by DB policies. Run supabase/all_in_one_setup.sql once, then refresh.", "err");
            }
            return false;
          }

          if (!silent) {
            if (status !== "approved" || (role !== "admin" && role !== "moderator")) {
              setBackendStatus("Setup ran, but your account is still pending. Ask an existing admin to approve your member profile.", "err");
            } else {
              setBackendStatus("Setup complete. Add volunteers, then ask each volunteer to mark session attendance in Studio.", "ok");
            }
          }
          return true;
        } catch (err) {
          const msg = err && err.message ? err.message : String(err || "Setup failed");
          if (!silent) setBackendStatus(msg, "err");
          return false;
        } finally {
          state.setupRunning = false;
          updateAddVolunteerDialogState();
          el.startSetupBtn.disabled = false;
          el.startSetupBtn.textContent = setupLabel || "Start setup";
        }
      }

      async function setCommitmentStatus(eventId, status) {
        const allowed = ["committed", "unavailable"];
        if (!eventId || !allowed.includes(String(status))) return;

        if (!state.user) {
          setStatus(el.studioSessionStatus, "Sign in to update sessions.", "err");
          return;
        }

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          setStatus(el.studioSessionStatus, "No linked volunteer account.", "err");
          return;
        }

        const volunteerId = state.volunteerLink.volunteer_id;
        const okMessage = status === "committed" ? "Marked as available." : "Marked unavailable.";

        if (state.demoMode) {
          const nowIso = new Date().toISOString();
          const row = {
            id: "demo-commit-" + Math.random().toString(16).slice(2),
            volunteer_id: volunteerId,
            event_id: eventId,
            status: status,
            updated_at: nowIso,
            created_at: nowIso
          };

          const idx = state.commitments.findIndex(function (item) {
            return String(item.volunteer_id) === String(volunteerId) && String(item.event_id) === String(eventId);
          });
          if (idx >= 0) {
            state.commitments[idx] = Object.assign({}, state.commitments[idx], row);
          } else {
            state.commitments.unshift(row);
          }

          const dIdx = (DEMO.commitments || []).findIndex(function (item) {
            return String(item.volunteer_id) === String(volunteerId) && String(item.event_id) === String(eventId);
          });
          if (dIdx >= 0) {
            DEMO.commitments[dIdx] = Object.assign({}, DEMO.commitments[dIdx], row);
          } else {
            DEMO.commitments.unshift(row);
          }

          setStatus(el.studioSessionStatus, okMessage, "ok");
          renderAll();
          return;
        }

        const rpcResp = await state.supabase.rpc("set_volunteer_commitment_secure", {
          p_event_id: eventId,
          p_status: status,
          p_note: null
        });

        if (!rpcResp.error) {
          setStatus(el.studioSessionStatus, okMessage, "ok");
          await loadAllData();
          renderAll();
          return;
        }

        const rpcMessage = String((rpcResp.error && rpcResp.error.message) || "");
        const rpcMissing =
          /set_volunteer_commitment_secure/i.test(rpcMessage) &&
          /(does not exist|not found|schema cache|undefined function)/i.test(rpcMessage);

        if (!rpcMissing) {
          setStatus(el.studioSessionStatus, "Update failed: " + rpcMessage, "err");
          return;
        }

        const resp = await state.supabase.from("volunteer_commitments").upsert(
          {
            volunteer_id: volunteerId,
            event_id: eventId,
            status: status,
            committed_by_user_id: state.user.id,
            updated_at: new Date().toISOString()
          },
          { onConflict: "volunteer_id,event_id" }
        );

        if (resp.error) {
          setStatus(el.studioSessionStatus, "Update failed.", "err");
          return;
        }

        setStatus(el.studioSessionStatus, okMessage, "ok");
        await loadAllData();
        renderAll();
      }

      function memberApproved() {
        return !!(state.user && state.member && state.member.status === "approved");
      }

      async function onSubmitReview(event) {
        event.preventDefault();
        if (!memberApproved()) {
          setStatus(el.reviewStatus, "Approved member required.", "err");
          return;
        }

        const payload = collectReview();
        if (!payload.ok) {
          setStatus(el.reviewStatus, payload.message, "err");
          return;
        }

        const signal = computeAuthenticity(payload.review);
        const moderationStatus = signal.score >= 50 ? "pending" : "published";
        const reviewerWeight = computeReviewerWeight(signal.score);

        if (state.demoMode) {
          const newReview = Object.assign({}, payload.review, {
            id: "demo-" + Math.random().toString(16).slice(2),
            moderation_status: moderationStatus,
            authenticity_score: signal.score,
            reviewer_weight: reviewerWeight,
            helpful_count: 0,
            created_at: new Date().toISOString()
          });
          state.reviews.unshift(newReview);
          DEMO.reviews.unshift(newReview);
          setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Queued for moderation.", moderationStatus === "published" ? "ok" : "err");
          el.reviewForm.reset();
          if (el.reviewDialog.open) el.reviewDialog.close();
          renderAll();
          return;
        }

        const rpcResp = await state.supabase.rpc("submit_review_secure", {
          p_volunteer_id: payload.review.volunteer_id,
          p_event_id: payload.review.event_id,
          p_overall_rating: payload.review.overall_rating,
          p_communication_rating: payload.review.communication_rating,
          p_reliability_rating: payload.review.reliability_rating,
          p_warmth_rating: payload.review.warmth_rating,
          p_clarity_rating: payload.review.clarity_rating,
          p_title: payload.review.title,
          p_body: payload.review.body,
          p_authenticity_score: signal.score,
          p_authenticity_flags: signal.flags
        });

        if (!rpcResp.error) {
          setStatus(el.reviewStatus, "Review submitted.", "ok");
          el.reviewForm.reset();
          if (el.reviewDialog.open) el.reviewDialog.close();
          await loadAllData();
          renderAll();
          return;
        }

        const rpcMessage = String((rpcResp.error && rpcResp.error.message) || "");
        const rpcMissing =
          /submit_review_secure/i.test(rpcMessage) &&
          /(does not exist|not found|schema cache|undefined function)/i.test(rpcMessage);
        if (!rpcMissing) {
          setStatus(el.reviewStatus, "Submit failed: " + rpcMessage, "err");
          return;
        }

        const duplicate = await state.supabase.from("reviews")
          .select("id")
          .eq("reviewer_user_id", state.user.id)
          .eq("volunteer_id", payload.review.volunteer_id)
          .eq("event_id", payload.review.event_id)
          .limit(1);

        if (duplicate.error) {
          setStatus(el.reviewStatus, "Could not verify duplicate rule.", "err");
          return;
        }

        if (!duplicate.error && (duplicate.data || []).length > 0) {
          setStatus(el.reviewStatus, "Already reviewed this event.", "err");
          return;
        }

        const dayStart = new Date();
        dayStart.setHours(0, 0, 0, 0);
        const limitResp = await state.supabase.from("reviews")
          .select("id", { count: "exact", head: true })
          .eq("reviewer_user_id", state.user.id)
          .gte("created_at", dayStart.toISOString());

        if (limitResp.error) {
          setStatus(el.reviewStatus, "Could not verify daily limit.", "err");
          return;
        }

        if (!limitResp.error && (limitResp.count || 0) >= 4) {
          setStatus(el.reviewStatus, "Daily limit reached.", "err");
          return;
        }

        let insert = {
          volunteer_id: payload.review.volunteer_id,
          event_id: payload.review.event_id,
          reviewer_user_id: state.user.id,
          overall_rating: payload.review.overall_rating,
          communication_rating: payload.review.communication_rating,
          reliability_rating: payload.review.reliability_rating,
          warmth_rating: payload.review.warmth_rating,
          clarity_rating: payload.review.clarity_rating,
          title: payload.review.title,
          body: payload.review.body,
          moderation_status: moderationStatus,
          authenticity_score: signal.score,
          authenticity_flags: signal.flags,
          reviewer_weight: reviewerWeight
        };

        let resp = await state.supabase.from("reviews").insert(insert).select().maybeSingle();
        if (resp.error) {
          const fallback = Object.assign({}, insert);
          delete fallback.moderation_status;
          delete fallback.authenticity_score;
          delete fallback.authenticity_flags;
          delete fallback.reviewer_weight;
          fallback.status = moderationStatus;
          resp = await state.supabase.from("reviews").insert(fallback).select().maybeSingle();
        }

        if (resp.error) {
          setStatus(el.reviewStatus, "Submit failed. Please try again.", "err");
          return;
        }

        setStatus(el.reviewStatus, moderationStatus === "published" ? "Review published." : "Queued for moderation.", moderationStatus === "published" ? "ok" : "err");
        el.reviewForm.reset();
        if (el.reviewDialog.open) el.reviewDialog.close();
        await loadAllData();
        renderAll();
      }

      function collectReview() {
        const review = {
          event_id: (el.reviewEventSelect.value || "").trim(),
          volunteer_id: (el.reviewVolunteerSelect.value || "").trim(),
          overall_rating: Number(el.overallRating.value || 0),
          communication_rating: Number(el.commRating.value || 0),
          reliability_rating: Number(el.relRating.value || 0),
          warmth_rating: Number(el.warmRating.value || 0),
          clarity_rating: Number(el.clearRating.value || 0),
          title: (el.reviewTitleInput.value || "").trim(),
          body: (el.reviewBodyInput.value || "").trim()
        };

        if (!review.event_id || !review.volunteer_id) return { ok: false, message: "Choose event + volunteer." };
        if (!review.overall_rating || !review.communication_rating || !review.reliability_rating || !review.warmth_rating || !review.clarity_rating) return { ok: false, message: "Complete all ratings." };
        if (review.title.length < 6) return { ok: false, message: "Add headline." };
        if (review.body.length < 80) return { ok: false, message: "Review needs 80+ chars." };
        if ((review.overall_rating === 1 || review.overall_rating === 5) && review.body.length < 120) return { ok: false, message: "1-star/5-star needs 120+ chars." };
        if (!el.truthCheckbox.checked) return { ok: false, message: "Confirm checkbox." };
        return { ok: true, review: review };
      }

      async function onSubmitReport(event) {
        event.preventDefault();
        if (!memberApproved()) {
          setStatus(el.reportStatus, "Approved member required.", "err");
          return;
        }

        const volunteerId = (el.reportVolunteerSelect.value || "").trim();
        const eventId = (el.reportEventSelect.value || "").trim();
        const reason = (el.reportReasonSelect.value || "").trim();
        const severity = (el.reportSeveritySelect.value || "medium").trim();
        const details = (el.reportDetailsInput.value || "").trim();

        if (!volunteerId || !reason) { setStatus(el.reportStatus, "Choose volunteer + reason.", "err"); return; }
        if (details.length < 50) { setStatus(el.reportStatus, "Add at least 50 chars.", "err"); return; }

        if (state.demoMode) {
          const newReport = { id: "demo-report-" + Math.random().toString(16).slice(2), volunteer_id: volunteerId, status: "open", severity: severity, reason: reason, details: details, created_at: new Date().toISOString() };
          state.reports.unshift(newReport);
          DEMO.reports.unshift(newReport);
          setStatus(el.reportStatus, "Report submitted.", "ok");
          el.reportForm.reset();
          if (el.reportDialog.open) el.reportDialog.close();
          renderAll();
          return;
        }

        const rpcResp = await state.supabase.rpc("submit_report_secure", {
          p_volunteer_id: volunteerId,
          p_event_id: eventId || null,
          p_reason: reason,
          p_severity: severity,
          p_details: details
        });

        if (!rpcResp.error) {
          setStatus(el.reportStatus, "Report submitted.", "ok");
          el.reportForm.reset();
          if (el.reportDialog.open) el.reportDialog.close();
          await loadAllData();
          renderAll();
          return;
        }

        const rpcMessage = String((rpcResp.error && rpcResp.error.message) || "");
        const rpcMissing =
          /submit_report_secure/i.test(rpcMessage) &&
          /(does not exist|not found|schema cache|undefined function)/i.test(rpcMessage);
        if (!rpcMissing) {
          setStatus(el.reportStatus, "Report failed: " + rpcMessage, "err");
          return;
        }

        const resp = await state.supabase.from("volunteer_reports").insert({ volunteer_id: volunteerId, event_id: eventId || null, reporter_user_id: state.user.id, reason: reason, severity: severity, details: details, status: "open" });
        if (resp.error) {
          setStatus(el.reportStatus, "Report failed.", "err");
          return;
        }

        setStatus(el.reportStatus, "Report submitted.", "ok");
        el.reportForm.reset();
        if (el.reportDialog.open) el.reportDialog.close();
        await loadAllData();
        renderAll();
      }
      async function markHelpful(reviewId) {
        if (!reviewId) return;
        if (hasVotedHelpful(reviewId)) return;
        const target = state.reviews.find(function (r) { return String(r.id) === String(reviewId); });
        if (!target) return;

        if (state.demoMode) {
          state.helpfulVotedIds[String(reviewId)] = true;
          target.helpful_count = Number(target.helpful_count || 0) + 1;
          renderProfile();
          renderStudio();
          return;
        }

        if (!state.user) {
          setStatus(el.authStatus, "Sign in to vote.", "err");
          return;
        }

        const existing = await state.supabase
          .from("review_helpfulness")
          .select("vote")
          .eq("review_id", reviewId)
          .eq("voter_user_id", state.user.id)
          .maybeSingle();

        if (!existing.error && existing.data && Number(existing.data.vote || 0) > 0) {
          state.helpfulVotedIds[String(reviewId)] = true;
          renderProfile();
          return;
        }

        const rpcResp = await state.supabase.rpc("vote_review_helpful_secure", {
          p_review_id: reviewId
        });

        if (!rpcResp.error) {
          state.helpfulVotedIds[String(reviewId)] = true;
          target.helpful_count = Number(target.helpful_count || 0) + 1;
          renderProfile();
          renderStudio();
          return;
        }

        const rpcMessage = String((rpcResp.error && rpcResp.error.message) || "");
        const rpcMissing =
          /vote_review_helpful_secure/i.test(rpcMessage) &&
          /(does not exist|not found|schema cache|undefined function)/i.test(rpcMessage);
        if (!rpcMissing) {
          setStatus(el.authStatus, "Vote failed: " + rpcMessage, "err");
          return;
        }

        const resp = await state.supabase
          .from("review_helpfulness")
          .upsert({ review_id: reviewId, voter_user_id: state.user.id, vote: 1 }, { onConflict: "review_id,voter_user_id" });

        if (resp.error) {
          setStatus(el.authStatus, "Vote failed.", "err");
          return;
        }

        state.helpfulVotedIds[String(reviewId)] = true;
        target.helpful_count = Number(target.helpful_count || 0) + 1;
        renderProfile();
        renderStudio();
      }

      async function onSaveProfile(event) {
        event.preventDefault();

        if (!state.volunteerLink || !state.volunteerLink.volunteer_id) {
          setStatus(el.profileStatus, "No linked profile.", "err");
          return;
        }

        const payload = {
          display_name: (el.profileDisplayName.value || "").trim(),
          tagline: (el.profileTagline.value || "").trim(),
          avatar_url: (el.profileAvatarUrl.value || "").trim(),
          bio: (el.profileBio.value || "").trim(),
          active: !!el.profileActive.checked
        };

        if (!payload.display_name) {
          setStatus(el.profileStatus, "Display name required.", "err");
          return;
        }

        if (state.demoMode) {
          const idx = state.volunteers.findIndex(function (v) { return v.id === state.volunteerLink.volunteer_id; });
          if (idx >= 0) state.volunteers[idx] = Object.assign({}, state.volunteers[idx], payload);
          const dIdx = DEMO.volunteers.findIndex(function (v) { return v.id === state.volunteerLink.volunteer_id; });
          if (dIdx >= 0) DEMO.volunteers[dIdx] = Object.assign({}, DEMO.volunteers[dIdx], payload);
          setStatus(el.profileStatus, "Saved.", "ok");
          renderAll();
          return;
        }

        let resp = await state.supabase.from("volunteers").update(payload).eq("id", state.volunteerLink.volunteer_id).select().maybeSingle();
        if (resp.error) {
          const fallback = { display_name: payload.display_name, avatar_url: payload.avatar_url, bio: payload.bio, active: payload.active };
          resp = await state.supabase.from("volunteers").update(fallback).eq("id", state.volunteerLink.volunteer_id).select().maybeSingle();
        }

        if (resp.error) {
          setStatus(el.profileStatus, "Save failed.", "err");
          return;
        }

        setStatus(el.profileStatus, "Saved.", "ok");
        await loadAllData();
        renderAll();
      }

      function renderAll() {
        safeRender("header", renderHeader);
        safeRender("volunteer-list", renderVolunteerList);
        safeRender("profile", renderProfile);
        safeRender("review-selectors", renderReviewSelectors);
        safeRender("report-selectors", renderReportSelectors);
        safeRender("studio", renderStudio);
      }

      function safeRender(name, fn) {
        try {
          fn();
        } catch (err) {
          const msg = err && err.message ? err.message : String(err || "Unknown UI error");
          setBackendStatus("UI error (" + name + "): " + msg, "err");
        }
      }

      function showSetupAction() {
        if (state.demoMode || !state.user) return false;
        if (state.setupRunning) return true;
        if (!memberApproved()) return true;
        return state.volunteers.length === 0;
      }

      function renderHeader() {
        el.signOutBtn.style.display = state.user ? "" : "none";
        el.startSetupBtn.style.display = showSetupAction() ? "" : "none";
        updateAddVolunteerDialogState();
        if (!state.user) {
          if (!state.demoMode) {
            setStatus(el.authStatus, "Sign in to manage volunteers.", "");

            clearStatus(el.authStatus);
          }

        }

      function renderVolunteerList() {
        const search = (el.searchInput.value || "").trim().toLowerCase();
        const sort = (el.sortSelect.value || "top").trim();

        const list = state.volunteers
          .filter(function (v) {
            const blob = ((v.display_name || "") + " " + (v.tagline || "") + " " + (v.bio || "")).toLowerCase();
            return !search || blob.indexOf(search) >= 0;
          })
          .map(function (v) { return { volunteer: v, stats: volunteerStats(v.id) }; });

        list.sort(function (a, b) {
          if (sort === "reviews") return b.stats.reviewCount - a.stats.reviewCount;
          if (sort === "name") return (a.volunteer.display_name || "").localeCompare(b.volunteer.display_name || "");
          return b.stats.score - a.stats.score;
        });

        if (!list.length) {
          if (state.loadingData) {
            el.volunteerList.innerHTML = '<div class="empty">Loading volunteers...</div>';
            return;
          }
          el.volunteerList.innerHTML = '<div class="empty">No volunteers yet.</div>';
          return;
        }

        const ids = list.map(function (x) { return x.volunteer.id; });
        if (!ids.includes(state.selectedVolunteerId)) state.selectedVolunteerId = ids[0];

        el.volunteerList.innerHTML = list.map(function (row) {
          const v = row.volunteer;
          const s = row.stats;
          const showUpLabel = s.showUpRate == null ? "--" : (s.showUpRate + "%");
          return '<article class="vol-item ' + (state.selectedVolunteerId === v.id ? "active" : "") + '" data-volunteer="' + esc(v.id) + '">' +
            avatarHtml(v, 40) +
            '<div><h3>' + esc(v.display_name || "Volunteer") + '</h3><div class="muted">' + stars(s.avgRating) + ' ' + s.avgRating.toFixed(2) + ' · ' + s.reviewCount + ' · show-up ' + showUpLabel + '</div></div>' +
            '<span class="score">Rep ' + Math.round(s.score) + '</span>' +
          '</article>';
        }).join("");
      }

      function renderProfile() {

        if (!volunteer) {
          const setupBtn = showSetupAction() ? '<button type="button" class="mini ghost" data-action="setup">Start setup</button>' : "";

          return '<article class="review">' +
            '<div class="review-head"><div><div class="stars">' + stars(r.overall_rating) + '</div><div class="headline">' + esc(r.title || "Review") + '</div><div class="muted">' + relDate(r.created_at) + '</div></div><button class="mini ghost" type="button" data-helpful="' + esc(r.id) + '"' + (alreadyVoted ? " disabled" : "") + ">" + voteLabel + '</button></div>' +

        el.profileSurface.innerHTML =

            '<div class="hero-top">' +
