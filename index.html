              '<div class="actions"><button class="mini" type="button" data-action="review">Review</button><button class="mini ghost" type="button" data-action="report">Report</button><button class="mini ghost" type="button" data-action="studio">Studio</button></div>' +
            '</div>' +
            '<div class="chips"><span class="chip">' + stars(stats.avgRating) + ' ' + stats.avgRating.toFixed(2) + '</span><span class="chip">' + stats.reviewCount + ' reviews</span><span class="chip">Rep ' + Math.round(stats.score) + '</span><span class="chip">Show-up ' + showUpLabel + '</span><span class="chip">Upcoming ' + upcomingLabel + '</span>' + incentiveChips + '</div>' +
          '</section>' +

            metricBox("Show-up", showUpLabel) +
            metricBox("Positive", stats.positiveRate + "%") +
            metricBox("Upcoming", upcomingLabel) +

      function renderStudioSessions(volunteerId) {
        const sessions = upcomingEventsForVolunteer(volunteerId);
        if (!sessions.length) {
          el.studioSessions.innerHTML = '<div class="empty">No upcoming sessions</div>';
          return;
        }

        const canEdit = !!(state.volunteerLink && String(state.volunteerLink.volunteer_id) === String(volunteerId));

        el.studioSessions.innerHTML = sessions.map(function (ev) {
          const row = findCommitment(volunteerId, ev.id);
          const status = row ? String(row.status || "").toLowerCase() : "";
          const statusClass = status === "committed" ? " ok" : "";
          const statusText = status ? commitmentStatusLabel(status) : "No response";
          const committedActive = status === "committed" ? " active" : "";
          const unavailableActive = status === "unavailable" ? " active" : "";

          return '<article class="session-row">' +
            '<div class="session-meta"><div class="headline">' + esc(ev.title || "Session") + '</div><span class="session-status' + statusClass + '">' + esc(statusText) + '</span></div>' +
            '<div class="muted">' + formatDateTime(ev.starts_at) + '</div>' +
            (canEdit ? '<div class="session-actions"><button type="button" class="mini ghost' + committedActive + '" data-commit-event="' + esc(ev.id) + '" data-commit-status="committed">I can make it</button><button type="button" class="mini ghost' + unavailableActive + '" data-commit-event="' + esc(ev.id) + '" data-commit-status="unavailable">Can&#39;t make it</button></div>' : "") +
          '</article>';
        }).join("");
      }

      function renderCategoryBars(volunteerId) {
        if (!el.categoryBars) return;
        const rows = reviewsForVolunteer(volunteerId);
        const cats = [
          { label: "Overall", key: "overall_rating" },
          { label: "Comm", key: "communication_rating" },
          { label: "Reliability", key: "reliability_rating" },
          { label: "Welcoming", key: "warmth_rating" },
          { label: "Clarity", key: "clarity_rating" }
        ];

        el.categoryBars.innerHTML = cats.map(function (cat) {
          const avg = mean(rows.map(function (r) { return Number(r[cat.key] || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="muted">' + esc(cat.label) + '</div><div class="bar-track"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="muted">' + (avg ? avg.toFixed(2) : "0.00") + '</div></div>';
        }).join("");
      }

      function renderTrendBars(volunteerId) {
        if (!el.trendBars) return;
        const rows = reviewsForVolunteer(volunteerId);
        const months = [];
        const now = new Date();
        for (let i = 5; i >= 0; i -= 1) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          months.push({
            key: d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"),
            label: d.toLocaleDateString(undefined, { month: "short" })
          });
        }

        el.trendBars.innerHTML = months.map(function (m) {
          const monthRows = rows.filter(function (r) {
            const d = new Date(r.created_at);
            const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
            return key === m.key;
          });
          const avg = mean(monthRows.map(function (r) { return Number(r.overall_rating || 0); }));
          const pct = clamp((avg / 5) * 100, 0, 100);
          return '<div class="bar-row"><div class="muted">' + esc(m.label) + '</div><div class="bar-track"><span style="width:' + pct.toFixed(1) + '%"></span></div><div class="muted">' + (avg ? avg.toFixed(2) : "-") + '</div></div>';
        }).join("");
      }

      function reviewsForVolunteer(volunteerId) {
        return publishedReviews().filter(function (r) { return r.volunteer_id === volunteerId; }).sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      }

      function upcomingEventsForVolunteer(volunteerId) {
        return state.upcomingEvents
          .filter(function (ev) {
            const allowed = state.eventVolunteerMap[ev.id];
            if (!Array.isArray(allowed) || !allowed.length) return true;
            return allowed.includes(volunteerId);
          })
          .sort(function (a, b) { return new Date(a.starts_at) - new Date(b.starts_at); });
      }

      function findCommitment(volunteerId, eventId) {
        const candidates = state.commitments.filter(function (row) {
          return String(row.volunteer_id) === String(volunteerId) && String(row.event_id) === String(eventId);
        });
        if (!candidates.length) return null;

        candidates.sort(function (a, b) {
          const aTime = new Date(a.updated_at || a.created_at || 0).getTime();
          const bTime = new Date(b.updated_at || b.created_at || 0).getTime();
          return bTime - aTime;
        });
        return candidates[0];
      }

      function commitmentStatusLabel(status) {
        if (status === "committed") return "Committed";
        if (status === "unavailable") return "Unavailable";
        return "No response";
      }

      function eventIndexById() {
        const map = {};
        state.events.concat(state.upcomingEvents).forEach(function (ev) {
          if (ev && ev.id) map[String(ev.id)] = ev;
        });
        return map;
      }

      function volunteerStats(volunteerId) {
        const rows = reviewsForVolunteer(volunteerId);
        const openReports = state.reports.filter(function (rp) { return rp.volunteer_id === volunteerId && (rp.status === "open" || rp.status === "investigating"); }).length;
        const reviewCount = rows.length;
        const helpfulTotal = rows.reduce(function (sum, r) { return sum + Number(r.helpful_count || 0); }, 0);

        const globalMean = mean(publishedReviews().map(function (r) { return Number(r.overall_rating || 0); })) || 4;
        const m = 8;
        let weightedSum = 0;
        let weightTotal = 0;
        rows.forEach(function (r) {
          const rating = Number(r.overall_rating || 0);
          const weight = Number(r.reviewer_weight || 1);
          if (rating > 0 && weight > 0) {
            weightedSum += rating * weight;
            weightTotal += weight;
          }
        });

        const avgRating = weightTotal > 0 ? weightedSum / weightTotal : globalMean;
        const bayesian = ((weightTotal / (weightTotal + m)) * avgRating) + ((m / (weightTotal + m)) * globalMean);
        const positives = rows.filter(function (r) { return Number(r.overall_rating || 0) >= 4; }).length;
        const positiveRate = reviewCount ? Math.round((positives / reviewCount) * 100) : 0;

        const upcoming = upcomingEventsForVolunteer(volunteerId);
        let upcomingCommitted = 0;
        let upcomingResponded = 0;
        upcoming.forEach(function (ev) {
          const row = findCommitment(volunteerId, ev.id);
          const status = row ? String(row.status || "").toLowerCase() : "";
          if (!status) return;
          if (status === "committed") upcomingCommitted += 1;
          if (status === "committed" || status === "unavailable") upcomingResponded += 1;
        });

        const upcomingTotal = upcoming.length;
        const responseRate = upcomingTotal ? Math.round((upcomingResponded / upcomingTotal) * 100) : 0;

        const nowMs = Date.now();
        const eventsById = eventIndexById();
        const committedPast = state.commitments
          .filter(function (row) {
            return String(row.volunteer_id) === String(volunteerId) && String(row.status || "").toLowerCase() === "committed";
          })
          .map(function (row) {
            const ev = eventsById[String(row.event_id)];
            const startsAt = ev && ev.starts_at ? new Date(ev.starts_at).getTime() : NaN;
            return { row: row, startsAt: startsAt };
          })
          .filter(function (item) {
            return isFinite(item.startsAt) && item.startsAt < nowMs;
          })
          .sort(function (a, b) { return b.startsAt - a.startsAt; });

        let attendedEvidence = 0;
        let missedEvidence = 0;
        let streak = 0;
        for (let i = 0; i < committedPast.length; i += 1) {
          const eventId = String(committedPast[i].row.event_id || "");
          const hasNoShowReport = state.reports.some(function (rp) {
            return String(rp.volunteer_id) === String(volunteerId) &&
              String(rp.reason || "").toLowerCase() === "absence" &&
              String(rp.event_id || "") === eventId &&
              String(rp.status || "").toLowerCase() !== "dismissed";
          });
          const hasReviewEvidence = rows.some(function (rv) { return String(rv.event_id || "") === eventId; });

          if (hasNoShowReport) {
            missedEvidence += 1;
            if (streak === i) break;
            continue;
          }

          if (hasReviewEvidence) {
            attendedEvidence += 1;
            if (streak === i) streak += 1;
            continue;
          }

          if (streak === i) break;
        }

        const noShowCutoff = Date.now() - (90 * 24 * 60 * 60 * 1000);
        const noShowRecent = state.reports.filter(function (rp) {
          const created = new Date(rp.created_at || 0).getTime();
          return String(rp.volunteer_id) === String(volunteerId) &&
            String(rp.reason || "").toLowerCase() === "absence" &&
            isFinite(created) &&
            created >= noShowCutoff &&
            String(rp.status || "").toLowerCase() !== "dismissed";
        }).length;

        const showEvidenceTotal = attendedEvidence + missedEvidence;
        const showUpRate = showEvidenceTotal ? Math.round((attendedEvidence / showEvidenceTotal) * 100) : null;
        const baseScore = (((bayesian - 1) / 4) * 100);
        const showUpAdj = showUpRate == null ? 0 : ((showUpRate - 80) * 0.18);
        const responseAdj = upcomingTotal ? ((responseRate - 60) * 0.08) : 0;
        const score = clamp(baseScore + showUpAdj + responseAdj - (openReports * 4.5) - (noShowRecent * 6), 0, 100);
        const confidenceBase = weightTotal + showEvidenceTotal;
        const confidence = clamp(Math.round((confidenceBase / (confidenceBase + 9)) * 100), 5, 99);

        return {
          avgRating: avgRating || 0,
          reviewCount: reviewCount,
          score: score,
          confidence: confidence,
          openReports: openReports,
          helpfulTotal: helpfulTotal,
          positiveRate: positiveRate,
          upcomingTotal: upcomingTotal,
          upcomingCommitted: upcomingCommitted,
          responseRate: responseRate,
          showUpRate: showUpRate,
          noShowRecent: noShowRecent,
          streak: streak
        };
      }

      function publishedReviews() {
        return state.reviews.filter(function (row) {
          const st = row.moderation_status || row.status || "published";
          return st === "published";
        });
      }

      function computeAuthenticity(review) {
        const flags = [];
        let score = 0;
        const body = review.body || "";
        const words = body.split(/\s+/).filter(Boolean);

        if (body.length < 100) { flags.push("short-detail"); score += 12; }
        if ((body.match(/[A-Z]/g) || []).length / ((body.match(/[A-Za-z]/g) || []).length || 1) > 0.35) { flags.push("high-caps"); score += 16; }
        if ((body.match(/https?:\/\/|www\./gi) || []).length > 1) { flags.push("many-links"); score += 20; }
        if (/(.)\1{6,}/.test(body)) { flags.push("repeat-chars"); score += 18; }
        if (words.length > 20) {
          const unique = new Set(words.map(function (w) { return w.toLowerCase(); }));
          if (unique.size / words.length < 0.42) { flags.push("low-uniqueness"); score += 12; }
        }

        if (state.member && state.member.created_at) {
          const ageDays = (Date.now() - new Date(state.member.created_at).getTime()) / (1000 * 60 * 60 * 24);
          if (isFinite(ageDays) && ageDays < 7) { flags.push("new-account"); score += 18; }
        }

        return { score: clamp(score, 0, 100), flags: flags };
      }

      function computeReviewerWeight(riskScore) {
        const base = Number((state.member && state.member.trust_score) || 1);
        if (riskScore >= 70) return round(base * 0.45, 2);
        if (riskScore >= 50) return round(base * 0.7, 2);
        if (riskScore <= 12) return round(base * 1.05, 2);
        return round(base, 2);
      }

      function metricBox(label, value) {
        return '<article class="metric"><span class="k">' + esc(label) + '</span><span class="v">' + esc(value) + '</span></article>';
      }

      function avatarHtml(volunteer, size) {
        const style = 'style="width:' + Number(size || 40) + 'px;height:' + Number(size || 40) + 'px;"';
        if (volunteer.avatar_url) return '<div class="avatar" ' + style + '><img src="' + esc(volunteer.avatar_url) + '" alt="avatar" loading="lazy"/></div>';
        return '<div class="avatar" ' + style + '>' + esc(initialsOf(volunteer.display_name || "Volunteer")) + '</div>';
      }

      function initialsOf(name) {
        const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
        if (!parts.length) return "V";
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
      }

      function groupIncentivesByVolunteer(rows) {
        const map = {};
        (rows || []).forEach(function (row) {
          const key = row && row.volunteer_id ? String(row.volunteer_id) : "";
          if (!key) return;
          if (!map[key]) map[key] = [];
          map[key].push(row);
        });
        return map;
      }

      function renderIncentiveChips(volunteerId, maxCount) {
        const rows = state.incentivesByVolunteer[String(volunteerId)] || [];
        const items = rows.slice(0, Math.max(0, Number(maxCount || 0)));
        if (!items.length) return "";
        return items.map(function (item) {
          const label = item.title || item.code || "Incentive";
          return '<span class="chip reward" title="' + esc(item.detail || "") + '">' + esc(label) + '</span>';
        }).join("");
      }

      function hasVotedHelpful(reviewId) {
        return !!state.helpfulVotedIds[String(reviewId)];
      }

      function clearStatus(node) {
        if (!node) return;
        node.textContent = "";
        node.className = "status";
      }

      function safeStorageSet(key, value) {
        try {
          window.localStorage.setItem(key, value);
          return true;
        } catch (_err) {
          return false;
        }
      }

      function safeStorageGet(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (_err) {
          return null;
        }
      }

      function safeStorageRemove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (_err) {
          // Ignore storage restrictions.
        }
      }

      function saveAuthBackup(session) {
        const payload = {
          access_token: session.access_token || "",
          refresh_token: session.refresh_token || "",
          expires_at: Number(session.expires_at || 0)
        };
        safeStorageSet(STORAGE.authBackup, JSON.stringify(payload));
      }

      function readAuthBackup() {
        const raw = safeStorageGet(STORAGE.authBackup);
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.access_token || !parsed.refresh_token) return null;
          return parsed;
        } catch (_err) {
          return null;
        }
      }

      function clearAuthBackup() {
        safeStorageRemove(STORAGE.authBackup);
      }

      function setBackendStatus(text, type) {
        if (el.backendStatus) setStatus(el.backendStatus, text, type);
        if (el.backendStatusTop) setStatus(el.backendStatusTop, text, type);
      }

      function setStatus(node, text, type) {
        if (!node) return;
        node.textContent = text;
        node.className = "status" + (type ? " " + type : "");
      }

      function isRpcMissingError(message, rpcName) {
        const msg = String(message || "").toLowerCase();
        const name = String(rpcName || "").toLowerCase();
        if (!msg || !name) return false;
        return msg.indexOf(name) >= 0 && /(does not exist|not found|schema cache|undefined function|no function matches)/i.test(msg);
      }

      function projectIdFromUrl(url) {
        const raw = String(url || "").trim();
        const match = raw.match(/^https?:\/\/([a-z0-9-]+)\.supabase\.co/i);
        return match ? match[1] : "";
      }

      function normalizeDomain(value) { return String(value || "").trim().toLowerCase().replace(/^@/, ""); }
      function mean(values) { return values.length ? values.reduce(function (sum, v) { return sum + Number(v || 0); }, 0) / values.length : 0; }
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function round(value, places) { const p = Math.pow(10, places || 0); return Math.round(value * p) / p; }
      function stars(rating) { const r = clamp(Math.round(Number(rating || 0)), 0, 5); return "★".repeat(r) + "☆".repeat(5 - r); }
      function formatDate(iso) { const d = new Date(iso); return isFinite(d.getTime()) ? d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "Unknown"; }
      function formatDateTime(iso) {
        const d = new Date(iso);
        return isFinite(d.getTime())
          ? d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
          : "Unknown";
      }

      function withTimeout(promise, ms, message) {
        let timer = null;
        const timeout = new Promise(function (_resolve, reject) {
          timer = setTimeout(function () {
            reject(new Error(message || "Timed out"));
          }, Math.max(1000, Number(ms || 0)));
        });

        return Promise.race([promise, timeout]).finally(function () {
          if (timer) clearTimeout(timer);
        });
      }

      function relDate(iso) {
        const d = new Date(iso);
        const diff = Date.now() - d.getTime();
        if (!isFinite(diff)) return "unknown";
        const mins = Math.floor(diff / 60000);
        if (mins < 60) return mins + "m ago";
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + "h ago";
        const days = Math.floor(hours / 24);
        if (days < 30) return days + "d ago";
        return formatDate(iso);
      }

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    })();
  </script>
