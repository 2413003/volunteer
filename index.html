<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MK Chess Club Volunteer Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f5f4ef;--panel:#fff;--line:#e1ddd4;--ink:#1f1d18;--muted:#6d665d;--brand:#0f6b4c;--brand2:#0b563e;--ok:#e4f2eb;--err:#f9e8e8;--warn:#fbf2dc;--r:15px;--s:0 12px 28px rgba(24,19,12,.06)}*{box-sizing:border-box}body{margin:0;font-family:"Sora",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8f7f4,#f2efe8)}button,input,select,textarea{font:inherit}.app{width:min(1180px,96vw);margin:14px auto 34px;display:grid;gap:12px}.top,.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--s);padding:14px;display:grid;gap:10px}.top-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}.brand h1{margin:0;font-size:clamp(30px,4vw,52px);line-height:.95;letter-spacing:-.025em}.auth{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.auth input{width:min(430px,100%);border:1px solid #cac4b7;border-radius:13px;background:#fff;padding:11px 13px}.actions,.inline-actions{display:flex;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.inline-actions{justify-content:flex-start}button{border:1px solid var(--brand2);background:var(--brand);color:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#0f7754}button:disabled{opacity:.58;cursor:not-allowed}button.ghost{background:#fff;color:#1e5c47;border-color:#9fc8b8}button.ghost:hover{background:#f4faf7}button.mini{border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}.status-row{display:flex;flex-wrap:wrap;gap:8px}.status{border:1px solid var(--line);border-radius:11px;background:#f9f7f2;color:#5e574c;font-size:13px;line-height:1.3;padding:8px 11px;margin:0}.status:empty{display:none}.status.ok{background:var(--ok);border-color:#afd2c2;color:#15503d}.status.err{background:var(--err);border-color:#ddb5b5;color:#7a2727}.status.warn{background:var(--warn);border-color:#e1c88b;color:#6d4c0f}.metric-grid{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}.metric{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}.metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#736b60;margin-bottom:7px;font-weight:700}.metric .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}.grid2{display:grid;gap:8px;grid-template-columns:1.3fr 1fr}.card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;display:grid;gap:8px}.card h3{margin:0;font-size:14px;letter-spacing:-.01em}.rows{display:grid;gap:7px}.row{border:1px solid #e4dece;border-radius:11px;background:#fcfaf4;padding:9px;display:grid;gap:5px}.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.headline{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}.muted{margin:0;font-size:12px;color:var(--muted)}.pill,.okpill,.warnpill{display:inline-block;border:1px solid #d8d0c2;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;color:#5b5145;background:#f7f2e8;white-space:nowrap}.okpill{background:#e9f5ee;border-color:#bad9c9;color:#1e5a45}.warnpill{background:#f8e7e7;border-color:#dfb8b8;color:#792b2b}.split{display:grid;grid-template-columns:305px 1fr;gap:12px}.search{width:100%;border:1px solid #cbc5b8;border-radius:12px;padding:10px 11px}.vol-list{display:grid;gap:7px;max-height:540px;overflow:auto}.vol{border:1px solid var(--line);border-radius:12px;padding:9px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;cursor:pointer;background:#fff}.vol.active{border-color:#9cc3b3;box-shadow:inset 0 0 0 2px rgba(15,107,76,.1)}.av{width:41px;height:41px;border:1px solid #d7d0c3;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#f2ede3;color:#4f4639}.score{border:1px solid #dbd3c6;border-radius:999px;background:#f8f4e8;color:#5b5144;font-size:11px;font-weight:700;padding:4px 8px;white-space:nowrap}.hero{border:1px solid var(--line);border-radius:14px;background:#fffdf8;padding:12px;display:grid;gap:9px}.hero-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.hero .av{width:58px;height:58px;border-radius:15px}.hero h2{margin:0;font-size:clamp(24px,2.8vw,34px);letter-spacing:-.03em;line-height:1.02}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #dbd3c5;border-radius:999px;background:#f7f2e8;color:#594f42;font-size:11px;font-weight:700;padding:5px 9px}.reviews{display:grid;gap:7px}.review{border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;display:grid;gap:5px}.empty{border:1px dashed #cec7b9;border-radius:12px;background:#fbfaf5;color:#6d665d;font-size:13px;text-align:center;padding:14px;display:grid;gap:9px}.empty .inline-actions{justify-content:center}dialog{border:1px solid var(--line);border-radius:18px;width:min(760px,95vw);max-height:88vh;overflow:auto;background:#fff;box-shadow:0 20px 48px rgba(17,13,9,.22);padding:0}dialog::backdrop{background:rgba(19,16,13,.43)}.dbody{padding:13px;display:grid;gap:10px}.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dhead h3{margin:0;font-size:34px;letter-spacing:-.03em}.stack{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#574e42}.field input,.field textarea,.field select{width:100%;border:1px solid #ccc6b9;border-radius:11px;padding:9px 10px;background:#fff}.field textarea{min-height:110px;resize:vertical}.two{display:grid;gap:8px;grid-template-columns:1fr 1fr}.att-grid{display:grid;gap:8px}.att{display:grid;align-items:center;grid-template-columns:1fr 150px 1fr;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}@media(max-width:1080px){.top-row{grid-template-columns:1fr}.actions{justify-content:flex-start}.metric-grid{grid-template-columns:1fr 1fr}.grid2,.split,.two{grid-template-columns:1fr}}@media(max-width:700px){.app{width:98vw}.metric-grid{grid-template-columns:1fr}.hero-top{grid-template-columns:1fr}.att{grid-template-columns:1fr}dialog{width:97vw}}
</style>
</head>
<body>
<main class="app">
<header class="top">
<div class="top-row">
<div class="brand"><small>MK Chess Club</small><h1>Volunteer Ops</h1></div>
<div class="auth"><input id="emailInput" type="email" placeholder="member@yourdomain.com" /><button id="sendLinkBtn" type="button">Send Link</button><button id="signOutBtn" type="button" class="ghost" style="display:none;">Sign Out</button></div>
<div class="actions"><button id="startSetupBtn" type="button" class="ghost mini" style="display:none;">Start setup</button><button id="addVolunteerBtn" type="button" class="mini" style="display:none;">Add volunteer</button><button id="addSessionBtn" type="button" class="mini ghost" style="display:none;">Add session</button><button id="demoModeBtn" type="button" class="ghost mini">Preview: On</button><button id="openSettingsBtn" type="button" class="ghost mini">Settings</button></div>
</div>
<div class="status-row"><p id="authStatus" class="status"></p><p id="backendStatus" class="status"></p></div>
</header>
<section id="commandBoard" class="panel"><div class="empty">Loading command center...</div></section>
<section class="split">
<aside class="panel"><input id="searchInput" class="search" type="text" placeholder="Search volunteers" /><div id="volunteerList" class="vol-list"><div class="empty">Loading volunteers...</div></div></aside>
<section id="volunteerDetail" class="panel"><div class="empty">Select a volunteer</div></section>
</section>
<section id="studioPanel" class="panel"><div class="empty">Sign in to open your volunteer studio.</div></section>
</main>
<dialog id="settingsDialog"><div class="dbody"><div class="dhead"><h3>Settings</h3><button type="button" class="ghost mini" data-close="settingsDialog">Close</button></div><div class="field"><label for="supaUrlInput">Supabase URL</label><input id="supaUrlInput" type="url" /></div><div class="field"><label for="supaKeyInput">Supabase anon key</label><input id="supaKeyInput" type="password" /></div><div class="field"><label for="allowedDomainInput">Allowed email domain (optional)</label><input id="allowedDomainInput" type="text" placeholder="mkchess.co.uk" /></div><button id="connectBtn" type="button">Save & Connect</button></div></dialog>
<dialog id="volunteerDialog"><div class="dbody"><div class="dhead"><h3>Add Volunteer</h3><button type="button" class="ghost mini" data-close="volunteerDialog">Close</button></div><form id="volunteerForm" class="stack"><div class="field"><label for="volunteerNameInput">Name</label><input id="volunteerNameInput" type="text" maxlength="80" required /></div><div class="field"><label for="volunteerTaglineInput">Tagline</label><input id="volunteerTaglineInput" type="text" maxlength="120" /></div><div class="field"><label for="volunteerBioInput">Bio</label><textarea id="volunteerBioInput" maxlength="900"></textarea></div><p id="volunteerStatus" class="status"></p><button id="createVolunteerBtn" type="submit">Create Volunteer</button></form></div></dialog>
<dialog id="sessionDialog"><div class="dbody"><div class="dhead"><h3>Add Session</h3><button type="button" class="ghost mini" data-close="sessionDialog">Close</button></div><form id="sessionForm" class="stack"><div class="field"><label for="sessionTitleInput">Session title</label><input id="sessionTitleInput" type="text" maxlength="120" required /></div><div class="two"><div class="field"><label for="sessionStartsInput">Start date & time</label><input id="sessionStartsInput" type="datetime-local" required /></div><div class="field"><label for="sessionRequiredInput">Required volunteers</label><input id="sessionRequiredInput" type="number" min="1" max="20" value="2" required /></div></div><p id="sessionStatus" class="status"></p><button id="createSessionBtn" type="submit">Create Session</button></form></div></dialog>
<dialog id="feedbackDialog"><div class="dbody"><div class="dhead"><h3>Leave Feedback</h3><button type="button" class="ghost mini" data-close="feedbackDialog">Close</button></div><form id="feedbackForm" class="stack"><input id="feedbackVolunteerIdInput" type="hidden" /><div class="field"><label for="feedbackSessionSelect">Session</label><select id="feedbackSessionSelect" required></select></div><div class="two"><div class="field"><label for="feedbackRatingInput">Rating (1-5)</label><select id="feedbackRatingInput" required><option value="">Select</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div><div class="field"><label for="feedbackTypeSelect">Feedback type</label><select id="feedbackTypeSelect"><option value="general">General</option><option value="coaching">Coaching</option><option value="organisation">Organisation</option><option value="communication">Communication</option></select></div></div><div class="field"><label for="feedbackNoteInput">Comment (optional)</label><textarea id="feedbackNoteInput" maxlength="1200"></textarea></div><p id="feedbackStatus" class="status"></p><button id="submitFeedbackBtn" type="submit">Submit Feedback</button></form></div></dialog>
<dialog id="reportDialog"><div class="dbody"><div class="dhead"><h3>Report Issue</h3><button type="button" class="ghost mini" data-close="reportDialog">Close</button></div><form id="reportForm" class="stack"><input id="reportVolunteerIdInput" type="hidden" /><div class="field"><label for="reportSessionSelect">Session (optional)</label><select id="reportSessionSelect"></select></div><div class="field"><label for="reportReasonSelect">Reason</label><select id="reportReasonSelect" required><option value="">Select reason</option><option value="no_show">No-show</option><option value="unsafe_behaviour">Unsafe behaviour</option><option value="unprofessional_behaviour">Unprofessional behaviour</option><option value="poor_communication">Poor communication</option><option value="other">Other</option></select></div><div class="field"><label for="reportDetailsInput">Details</label><textarea id="reportDetailsInput" maxlength="1200" required></textarea></div><p id="reportStatus" class="status"></p><button id="submitReportBtn" type="submit">Submit Report</button></form></div></dialog>
<dialog id="attendanceDialog"><div class="dbody"><div class="dhead"><h3 id="attendanceTitle">Mark Attendance</h3><button type="button" class="ghost mini" data-close="attendanceDialog">Close</button></div><form id="attendanceForm" class="stack"><div id="attendanceRows" class="att-grid"></div><p id="attendanceStatus" class="status"></p><button id="saveAttendanceBtn" type="submit">Save Attendance</button></form></div></dialog>
<dialog id="editVolunteerDialog"><div class="dbody"><div class="dhead"><h3>Edit Profile</h3><button type="button" class="ghost mini" data-close="editVolunteerDialog">Close</button></div><form id="editVolunteerForm" class="stack"><input id="editVolunteerIdInput" type="hidden" /><div class="field"><label for="editVolunteerNameInput">Name</label><input id="editVolunteerNameInput" type="text" maxlength="80" required /></div><div class="field"><label for="editVolunteerTaglineInput">Tagline</label><input id="editVolunteerTaglineInput" type="text" maxlength="120" /></div><div class="field"><label for="editVolunteerBioInput">Bio</label><textarea id="editVolunteerBioInput" maxlength="900"></textarea></div><p id="editVolunteerStatus" class="status"></p><button id="saveVolunteerProfileBtn" type="submit">Save Changes</button></form></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
