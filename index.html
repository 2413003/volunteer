<style>
:root{--bg:#f5f4ef;--panel:#fff;--line:#e1ddd4;--ink:#1f1d18;--muted:#6d665d;--brand:#0f6b4c;--brand2:#0b563e;--ok:#e4f2eb;--err:#f9e8e8;--warn:#fbf2dc;--r:15px;--s:0 12px 28px rgba(24,19,12,.06)}*{box-sizing:border-box}body{margin:0;font-family:"Sora",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8f7f4,#f2efe8)}button,input,select,textarea{font:inherit}.app{width:min(1180px,96vw);margin:14px auto 34px;display:grid;gap:12px}.top,.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--s);padding:14px;display:grid;gap:10px}.top-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}.brand h1{margin:0;font-size:clamp(30px,4vw,52px);line-height:.95;letter-spacing:-.025em}.auth{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}.auth input{width:min(430px,100%);border:1px solid #cac4b7;border-radius:13px;background:#fff;padding:11px 13px}.actions,.inline-actions{display:flex;gap:7px;flex-wrap:wrap}.actions{justify-content:flex-end}.inline-actions{justify-content:flex-start}button{border:1px solid var(--brand2);background:var(--brand);color:#fff;border-radius:11px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{background:#0f7754}button:disabled{opacity:.58;cursor:not-allowed}button.ghost{background:#fff;color:#1e5c47;border-color:#9fc8b8}button.ghost:hover{background:#f4faf7}button.mini{border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700}.status-row{display:flex;flex-wrap:wrap;gap:8px}.status{border:1px solid var(--line);border-radius:11px;background:#f9f7f2;color:#5e574c;font-size:13px;line-height:1.3;padding:8px 11px;margin:0}.status:empty{display:none}.status.ok{background:var(--ok);border-color:#afd2c2;color:#15503d}.status.err{background:var(--err);border-color:#ddb5b5;color:#7a2727}.status.warn{background:var(--warn);border-color:#e1c88b;color:#6d4c0f}.metric-grid{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}.metric{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}.metric .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#736b60;margin-bottom:7px;font-weight:700}.metric .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}.grid2{display:grid;gap:8px;grid-template-columns:1.3fr 1fr}.card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px;display:grid;gap:8px}.card h3{margin:0;font-size:14px;letter-spacing:-.01em}.rows{display:grid;gap:7px}.row{border:1px solid #e4dece;border-radius:11px;background:#fcfaf4;padding:9px;display:grid;gap:5px}.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.headline{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}.muted{margin:0;font-size:12px;color:var(--muted)}.pill,.okpill,.warnpill{display:inline-block;border:1px solid #d8d0c2;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;color:#5b5145;background:#f7f2e8;white-space:nowrap}.okpill{background:#e9f5ee;border-color:#bad9c9;color:#1e5a45}.warnpill{background:#f8e7e7;border-color:#dfb8b8;color:#792b2b}.split{display:grid;grid-template-columns:305px 1fr;gap:12px}.search{width:100%;border:1px solid #cbc5b8;border-radius:12px;padding:10px 11px}.vol-list{display:grid;gap:7px;max-height:540px;overflow:auto}.vol{border:1px solid var(--line);border-radius:12px;padding:9px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;cursor:pointer;background:#fff}.vol.active{border-color:#9cc3b3;box-shadow:inset 0 0 0 2px rgba(15,107,76,.1)}.av{width:41px;height:41px;border:1px solid #d7d0c3;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:800;background:#f2ede3;color:#4f4639}.score{border:1px solid #dbd3c6;border-radius:999px;background:#f8f4e8;color:#5b5144;font-size:11px;font-weight:700;padding:4px 8px;white-space:nowrap}.hero{border:1px solid var(--line);border-radius:14px;background:#fffdf8;padding:12px;display:grid;gap:9px}.hero-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}.hero .av{width:58px;height:58px;border-radius:15px}.hero h2{margin:0;font-size:clamp(24px,2.8vw,34px);letter-spacing:-.03em;line-height:1.02}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #dbd3c5;border-radius:999px;background:#f7f2e8;color:#594f42;font-size:11px;font-weight:700;padding:5px 9px}.reviews{display:grid;gap:7px}.review{border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px;display:grid;gap:5px}.empty{border:1px dashed #cec7b9;border-radius:12px;background:#fbfaf5;color:#6d665d;font-size:13px;text-align:center;padding:14px;display:grid;gap:9px}.empty .inline-actions{justify-content:center}dialog{border:1px solid var(--line);border-radius:18px;width:min(760px,95vw);max-height:88vh;overflow:auto;background:#fff;box-shadow:0 20px 48px rgba(17,13,9,.22);padding:0}dialog::backdrop{background:rgba(19,16,13,.43)}.dbody{padding:13px;display:grid;gap:10px}.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.dhead h3{margin:0;font-size:34px;letter-spacing:-.03em}.stack{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#574e42}.field input,.field textarea,.field select{width:100%;border:1px solid #ccc6b9;border-radius:11px;padding:9px 10px;background:#fff}.field textarea{min-height:110px;resize:vertical}.two{display:grid;gap:8px;grid-template-columns:1fr 1fr}.att-grid{display:grid;gap:8px}.att{display:grid;align-items:center;grid-template-columns:1fr 150px 1fr;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}@media(max-width:1080px){.top-row{grid-template-columns:1fr}.actions{justify-content:flex-start}.metric-grid{grid-template-columns:1fr 1fr}.grid2,.split,.two{grid-template-columns:1fr}}@media(max-width:700px){.app{width:98vw}.metric-grid{grid-template-columns:1fr}.hero-top{grid-template-columns:1fr}.att{grid-template-columns:1fr}dialog{width:97vw}}

<body>
<main class="app">
<header class="top">
<div class="top-row">
<div class="brand"><small>MK Chess Club</small><h1>Volunteer Ops</h1></div>
<div class="auth"><input id="emailInput" type="email" placeholder="member@yourdomain.com" /><button id="sendLinkBtn" type="button">Send Link</button><button id="signOutBtn" type="button" class="ghost" style="display:none;">Sign Out</button></div>
<div class="actions"><button id="startSetupBtn" type="button" class="ghost mini" style="display:none;">Start setup</button><button id="addVolunteerBtn" type="button" class="mini" style="display:none;">Add volunteer</button><button id="addSessionBtn" type="button" class="mini ghost" style="display:none;">Add session</button><button id="openSettingsBtn" type="button" class="ghost mini">Settings</button></div>
</div>
<div class="status-row"><p id="authStatus" class="status"></p><p id="backendStatus" class="status"></p></div>
</header>
<section id="commandBoard" class="panel"><div class="empty">Loading command center...</div></section>
<section class="split">
<aside class="panel"><input id="searchInput" class="search" type="text" placeholder="Search volunteers" /><div id="volunteerList" class="vol-list"><div class="empty">Loading volunteers...</div></div></aside>
<section id="volunteerDetail" class="panel"><div class="empty">Select a volunteer</div></section>
</section>
<section id="studioPanel" class="panel"><div class="empty">Sign in to open your volunteer studio.</div></section>
</main>
<dialog id="settingsDialog"><div class="dbody"><div class="dhead"><h3>Settings</h3><button type="button" class="ghost mini" data-close="settingsDialog">Close</button></div><div class="field"><label for="supaUrlInput">Supabase URL</label><input id="supaUrlInput" type="url" /></div><div class="field"><label for="supaKeyInput">Supabase anon key</label><input id="supaKeyInput" type="password" /></div><div class="field"><label for="allowedDomainInput">Allowed email domain (optional)</label><input id="allowedDomainInput" type="text" placeholder="mkchess.co.uk" /></div><button id="connectBtn" type="button">Save & Connect</button></div></dialog>
<dialog id="volunteerDialog"><div class="dbody"><div class="dhead"><h3>Add Volunteer</h3><button type="button" class="ghost mini" data-close="volunteerDialog">Close</button></div><form id="volunteerForm" class="stack"><div class="field"><label for="volunteerNameInput">Name</label><input id="volunteerNameInput" type="text" maxlength="80" required /></div><div class="field"><label for="volunteerTaglineInput">Tagline</label><input id="volunteerTaglineInput" type="text" maxlength="120" /></div><div class="field"><label for="volunteerBioInput">Bio</label><textarea id="volunteerBioInput" maxlength="900"></textarea></div><p id="volunteerStatus" class="status"></p><button id="createVolunteerBtn" type="submit">Create Volunteer</button></form></div></dialog>
<dialog id="sessionDialog"><div class="dbody"><div class="dhead"><h3>Add Session</h3><button type="button" class="ghost mini" data-close="sessionDialog">Close</button></div><form id="sessionForm" class="stack"><div class="field"><label for="sessionTitleInput">Session title</label><input id="sessionTitleInput" type="text" maxlength="120" required /></div><div class="two"><div class="field"><label for="sessionStartsInput">Start date & time</label><input id="sessionStartsInput" type="datetime-local" required /></div><div class="field"><label for="sessionRequiredInput">Required volunteers</label><input id="sessionRequiredInput" type="number" min="1" max="20" value="2" required /></div></div><p id="sessionStatus" class="status"></p><button id="createSessionBtn" type="submit">Create Session</button></form></div></dialog>
<dialog id="feedbackDialog"><div class="dbody"><div class="dhead"><h3>Leave Feedback</h3><button type="button" class="ghost mini" data-close="feedbackDialog">Close</button></div><form id="feedbackForm" class="stack"><input id="feedbackVolunteerIdInput" type="hidden" /><div class="field"><label for="feedbackSessionSelect">Session</label><select id="feedbackSessionSelect" required></select></div><div class="two"><div class="field"><label for="feedbackRatingInput">Rating (1-5)</label><select id="feedbackRatingInput" required><option value="">Select</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div><div class="field"><label for="feedbackTypeSelect">Feedback type</label><select id="feedbackTypeSelect"><option value="general">General</option><option value="coaching">Coaching</option><option value="organisation">Organisation</option><option value="communication">Communication</option></select></div></div><div class="field"><label for="feedbackNoteInput">Comment (optional)</label><textarea id="feedbackNoteInput" maxlength="1200"></textarea></div><p id="feedbackStatus" class="status"></p><button id="submitFeedbackBtn" type="submit">Submit Feedback</button></form></div></dialog>
<dialog id="reportDialog"><div class="dbody"><div class="dhead"><h3>Report Issue</h3><button type="button" class="ghost mini" data-close="reportDialog">Close</button></div><form id="reportForm" class="stack"><input id="reportVolunteerIdInput" type="hidden" /><div class="field"><label for="reportSessionSelect">Session (optional)</label><select id="reportSessionSelect"></select></div><div class="field"><label for="reportReasonSelect">Reason</label><select id="reportReasonSelect" required><option value="">Select reason</option><option value="no_show">No-show</option><option value="unsafe_behaviour">Unsafe behaviour</option><option value="unprofessional_behaviour">Unprofessional behaviour</option><option value="poor_communication">Poor communication</option><option value="other">Other</option></select></div><div class="field"><label for="reportDetailsInput">Details</label><textarea id="reportDetailsInput" maxlength="1200" required></textarea></div><p id="reportStatus" class="status"></p><button id="submitReportBtn" type="submit">Submit Report</button></form></div></dialog>
<dialog id="attendanceDialog"><div class="dbody"><div class="dhead"><h3 id="attendanceTitle">Mark Attendance</h3><button type="button" class="ghost mini" data-close="attendanceDialog">Close</button></div><form id="attendanceForm" class="stack"><div id="attendanceRows" class="att-grid"></div><p id="attendanceStatus" class="status"></p><button id="saveAttendanceBtn" type="submit">Save Attendance</button></form></div></dialog>
<dialog id="editVolunteerDialog"><div class="dbody"><div class="dhead"><h3>Edit Profile</h3><button type="button" class="ghost mini" data-close="editVolunteerDialog">Close</button></div><form id="editVolunteerForm" class="stack"><input id="editVolunteerIdInput" type="hidden" /><div class="field"><label for="editVolunteerNameInput">Name</label><input id="editVolunteerNameInput" type="text" maxlength="80" required /></div><div class="field"><label for="editVolunteerTaglineInput">Tagline</label><input id="editVolunteerTaglineInput" type="text" maxlength="120" /></div><div class="field"><label for="editVolunteerBioInput">Bio</label><textarea id="editVolunteerBioInput" maxlength="900"></textarea></div><p id="editVolunteerStatus" class="status"></p><button id="saveVolunteerProfileBtn" type="submit">Save Changes</button></form></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{"use strict";
const STORAGE={url:"mk_ops_url",key:"mk_ops_key",domain:"mk_ops_domain"};
const DEFAULT_SUPABASE={url:"https://pfgvnbhvihleugpijjvr.supabase.co",anonKey:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmZ3ZuYmh2aWhsZXVncGlqanZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1MTU2ODcsImV4cCI6MjA4OTA5MTY4N30.xF-lTjR3z2tcjMjIv0am3cLYOBs3gHD3p7yq3FbDqcs"};
const state={supabase:null,authSubscription:null,user:null,profile:null,volunteers:[],sessions:[],assignments:[],commitments:[],attendance:[],feedback:[],metricsRows:[],metricsByVolunteer:{},selectedVolunteerId:null,attendanceSessionId:null,loading:false};
const el={};
document.addEventListener("DOMContentLoaded",init);
async function init(){cacheEls();bindEvents();restoreSettings();renderAll();await connectSupabase();await refreshSession();await loadAllData();renderAll();}
function cacheEls(){["emailInput","sendLinkBtn","signOutBtn","startSetupBtn","addVolunteerBtn","addSessionBtn","openSettingsBtn","authStatus","backendStatus","commandBoard","searchInput","volunteerList","volunteerDetail","studioPanel","settingsDialog","supaUrlInput","supaKeyInput","allowedDomainInput","connectBtn","volunteerDialog","volunteerForm","volunteerNameInput","volunteerTaglineInput","volunteerBioInput","volunteerStatus","createVolunteerBtn","sessionDialog","sessionForm","sessionTitleInput","sessionStartsInput","sessionRequiredInput","sessionStatus","createSessionBtn","feedbackDialog","feedbackForm","feedbackVolunteerIdInput","feedbackSessionSelect","feedbackRatingInput","feedbackTypeSelect","feedbackNoteInput","feedbackStatus","submitFeedbackBtn","reportDialog","reportForm","reportVolunteerIdInput","reportSessionSelect","reportReasonSelect","reportDetailsInput","reportStatus","submitReportBtn","attendanceDialog","attendanceTitle","attendanceRows","attendanceForm","attendanceStatus","saveAttendanceBtn","editVolunteerDialog","editVolunteerForm","editVolunteerIdInput","editVolunteerNameInput","editVolunteerTaglineInput","editVolunteerBioInput","editVolunteerStatus","saveVolunteerProfileBtn"].forEach(id=>{el[id]=document.getElementById(id);});}
function bindEvents(){el.sendLinkBtn.addEventListener("click",onSendLink);el.signOutBtn.addEventListener("click",onSignOut);el.startSetupBtn.addEventListener("click",onStartSetup);el.addVolunteerBtn.addEventListener("click",openVolunteerDialog);el.addSessionBtn.addEventListener("click",openSessionDialog);el.openSettingsBtn.addEventListener("click",()=>openDialog(el.settingsDialog));el.connectBtn.addEventListener("click",onConnectClick);el.searchInput.addEventListener("input",renderVolunteerList);el.commandBoard.addEventListener("click",onActionClick);el.volunteerDetail.addEventListener("click",onActionClick);el.studioPanel.addEventListener("click",onActionClick);el.volunteerList.addEventListener("click",onVolunteerListClick);el.volunteerForm.addEventListener("submit",onCreateVolunteer);el.sessionForm.addEventListener("submit",onCreateSession);el.feedbackForm.addEventListener("submit",onSubmitFeedback);el.reportForm.addEventListener("submit",onSubmitReport);el.attendanceForm.addEventListener("submit",onSubmitAttendance);el.editVolunteerForm.addEventListener("submit",onSaveVolunteerProfile);document.addEventListener("click",event=>{const close=event.target.closest("[data-close]");if(!close)return;const dialogId=close.getAttribute("data-close");if(dialogId&&el[dialogId]&&typeof el[dialogId].close==="function")el[dialogId].close();});}
function restoreSettings(){const savedUrl=safeGet(STORAGE.url);const savedKey=safeGet(STORAGE.key);const savedDomain=safeGet(STORAGE.domain);el.supaUrlInput.value=savedUrl||DEFAULT_SUPABASE.url;el.supaKeyInput.value=savedKey||DEFAULT_SUPABASE.anonKey;el.allowedDomainInput.value=savedDomain||"";if(!savedUrl)safeSet(STORAGE.url,DEFAULT_SUPABASE.url);if(!savedKey)safeSet(STORAGE.key,DEFAULT_SUPABASE.anonKey);}
async function onConnectClick(){safeSet(STORAGE.url,String(el.supaUrlInput.value||"").trim());safeSet(STORAGE.key,String(el.supaKeyInput.value||"").trim());safeSet(STORAGE.domain,normalizeDomain(el.allowedDomainInput.value));await reconnectAndReload();if(el.settingsDialog.open)el.settingsDialog.close();}
async function reconnectAndReload(){detachAuthSubscription();await connectSupabase();await refreshSession();await loadAllData();renderAll();}
async function connectSupabase(){const url=String(safeGet(STORAGE.url)||"").trim();const key=String(safeGet(STORAGE.key)||"").trim();if(!url||!key){state.supabase=null;setBackendStatus("Set Supabase URL and anon key in Settings.","err");return;}if(!window.supabase||typeof window.supabase.createClient!=="function"){state.supabase=null;setBackendStatus("Supabase library failed to load.","err");return;}try{state.supabase=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"mk_volunteer_ops_auth_v2"}});attachAuthSubscription();setBackendStatus("Backend connected.","ok");}catch(error){state.supabase=null;setBackendStatus(errorText(error,"Backend connection failed"),"err");}}
function attachAuthSubscription(){if(!state.supabase)return;detachAuthSubscription();state.authSubscription=state.supabase.auth.onAuthStateChange(async(_event,session)=>{state.user=session?session.user:null;await ensureAccountProvisioned();await loadProfile();await loadAllData();renderAll();});}
function detachAuthSubscription(){if(state.authSubscription&&state.authSubscription.data&&state.authSubscription.data.subscription)state.authSubscription.data.subscription.unsubscribe();state.authSubscription=null;}
async function refreshSession(){if(!state.supabase){state.user=null;state.profile=null;return;}const {data,error}=await state.supabase.auth.getSession();if(error){state.user=null;state.profile=null;setBackendStatus(errorText(error,"Session check failed"),"err");return;}state.user=data&&data.session?data.session.user:null;await ensureAccountProvisioned();await loadProfile();}
async function ensureAccountProvisioned(){if(!state.user||!state.supabase)return;const suggestedName=String(state.user.email||"member").split("@")[0];const response=await rpc("ops_bootstrap_admin_setup",{p_display_name:suggestedName},20000);if(response.error&&looksLikeMissingSetup(response.error.message||response.error))setBackendStatus("Run supabase/all_in_one_setup.sql in Supabase SQL Editor.","err");}
async function loadProfile(){if(!state.user||!state.supabase){state.profile=null;return;}const response=await state.supabase.from("ops_profiles").select("user_id,email,display_name,role,status,volunteer_id,created_at").eq("user_id",state.user.id).maybeSingle();if(response.error){if(looksLikeMissingSetup(response.error.message||response.error))setBackendStatus("Run supabase/all_in_one_setup.sql in Supabase SQL Editor.","err");else setBackendStatus("Profile load issue: "+errorText(response.error,"Unknown error"),"err");state.profile={user_id:state.user.id,email:state.user.email||"",display_name:state.user.email||"Member",role:"member",status:"pending",volunteer_id:null};return;}state.profile=response.data||{user_id:state.user.id,email:state.user.email||"",display_name:state.user.email||"Member",role:"member",status:"pending",volunteer_id:null};}
async function loadAllData(){if(!state.supabase){state.volunteers=[];state.sessions=[];state.assignments=[];state.commitments=[];state.attendance=[];state.feedback=[];state.metricsRows=[];state.metricsByVolunteer={};return;}state.loading=true;renderAll();try{const [volunteersResponse,sessionsResponse,assignmentsResponse,commitmentsResponse,attendanceResponse,feedbackResponse,metricsResponse]=await Promise.all([state.supabase.from("ops_volunteers").select("id,owner_user_id,display_name,tagline,bio,active,created_at").eq("active",true).order("display_name",{ascending:true}),state.supabase.from("ops_sessions").select("id,title,starts_at,required_volunteers,status,created_at").order("starts_at",{ascending:true}),state.supabase.from("ops_session_assignments").select("session_id,volunteer_id"),state.supabase.from("ops_commitments").select("session_id,volunteer_id,status,note,updated_at"),state.supabase.from("ops_attendance").select("session_id,volunteer_id,outcome,note,marked_at"),state.supabase.from("ops_feedback").select("id,session_id,volunteer_id,reviewer_user_id,rating,feedback_type,note,created_at").order("created_at",{ascending:false}).limit(900),state.supabase.from("ops_volunteer_metrics").select("volunteer_id,avg_rating,feedback_count,assigned_upcoming,responded_upcoming,committed_upcoming,response_rate_pct,attendance_rate_pct,no_show_90d,reliability_score,at_risk")]);const errors=[volunteersResponse.error,sessionsResponse.error,assignmentsResponse.error,commitmentsResponse.error,attendanceResponse.error,feedbackResponse.error,metricsResponse.error].filter(Boolean);if(errors.length){const firstMessage=errorText(errors[0],"Data load failed");if(looksLikeMissingSetup(firstMessage))setBackendStatus("Run supabase/all_in_one_setup.sql in Supabase SQL Editor.","err");else setBackendStatus("Data load issue: "+firstMessage,"err");}state.volunteers=volunteersResponse.error?[]:(volunteersResponse.data||[]);state.sessions=sessionsResponse.error?[]:(sessionsResponse.data||[]);state.assignments=assignmentsResponse.error?[]:(assignmentsResponse.data||[]);state.commitments=commitmentsResponse.error?[]:(commitmentsResponse.data||[]);state.attendance=attendanceResponse.error?[]:(attendanceResponse.data||[]);state.feedback=feedbackResponse.error?[]:(feedbackResponse.data||[]);state.metricsRows=metricsResponse.error?[]:(metricsResponse.data||[]);state.metricsByVolunteer={};state.metricsRows.forEach(row=>{state.metricsByVolunteer[String(row.volunteer_id)]=row;});if(state.profile&&state.profile.volunteer_id){const mine=String(state.profile.volunteer_id);if(state.volunteers.some(v=>String(v.id)===mine))state.selectedVolunteerId=mine;}if(!state.selectedVolunteerId||!state.volunteers.some(v=>String(v.id)===String(state.selectedVolunteerId)))state.selectedVolunteerId=state.volunteers.length?String(state.volunteers[0].id):null;}finally{state.loading=false;}}

function renderHeader(){const signedIn=Boolean(state.user);const admin=isAdmin();el.sendLinkBtn.style.display=signedIn?"none":"";el.signOutBtn.style.display=signedIn?"":"none";el.emailInput.disabled=signedIn;el.startSetupBtn.style.display="none";el.addVolunteerBtn.style.display=admin?"":"none";el.addSessionBtn.style.display=admin?"":"none";if(signedIn)el.emailInput.value=state.user.email||"";if(!signedIn){setStatus(el.authStatus,"Sign in to manage volunteer operations.","");return;}if(admin){setStatus(el.authStatus,"Admin signed in: "+(state.user.email||""),"ok");return;}const role=state.profile?String(state.profile.role||"member"):"member";const status=state.profile?String(state.profile.status||"pending"):"pending";setStatus(el.authStatus,"Signed in: "+(state.user.email||"")+" ("+role+", "+status+")",status==="approved"?"":"warn");}

function renderStudio(){if(state.loading){el.studioPanel.innerHTML='<div class="empty">Loading studio...</div>';return;}if(!state.user){el.studioPanel.innerHTML='<div class="empty">Sign in to open your volunteer studio.</div>';return;}const volunteerId=myVolunteerId();if(!volunteerId){const claimHelp=state.selectedVolunteerId?'<div class="inline-actions"><button type="button" class="ghost" data-action="claim-volunteer" data-volunteer-id="'+esc(state.selectedVolunteerId)+'">Claim selected profile</button></div>':'';el.studioPanel.innerHTML='<div class="empty">No linked volunteer profile yet.'+claimHelp+'</div>';return;}const volunteer=state.volunteers.find(row=>String(row.id)===String(volunteerId));if(!volunteer){el.studioPanel.innerHTML='<div class="empty">Linked volunteer profile not found.</div>';return;}const metric=metricFor(volunteerId);const upcoming=upcomingSessionsForVolunteer(volunteerId).slice(0,10);const rowsHtml=upcoming.length?upcoming.map(session=>{const commitment=commitmentFor(volunteerId,session.id);const status=commitment?String(commitment.status||""):"";const committedClass=status==="committed"?"":" ghost";const unavailableClass=status==="unavailable"?"":" ghost";return['<article class="row">','<div class="row-top"><p class="headline">'+esc(session.title||"Session")+'</p><span class="pill">'+esc(formatDateTime(session.starts_at))+'</span></div>','<div class="inline-actions">','<button type="button" class="mini'+committedClass+'" data-action="set-commitment" data-session-id="'+esc(session.id)+'" data-status="committed">I can make it</button>','<button type="button" class="mini'+unavailableClass+'" data-action="set-commitment" data-session-id="'+esc(session.id)+'" data-status="unavailable">Can&#39;t make it</button>','</div>','</article>'].join('');}).join(''):'<div class="empty">No upcoming sessions assigned.</div>';el.studioPanel.innerHTML=['<section class="hero">','<div class="hero-top">','<div class="av">'+esc(initials(volunteer.display_name||"V async function onActionClick(event){const target=event.target.closest("[data-action]");if(!target)return;const action=String(target.getAttribute("data-action")||"");if(action==="open-volunteer-dialog"){openVolunteerDialog();return;}if(action==="open-session-dialog"){openSessionDialog();return;}if(action==="open-settings"){openDialog(el.settingsDialog);return;}if(action==="open-feedback"){openFeedbackDialog(target.getAttribute("data-volunteer-id"));return;}if(action==="open-report"){openReportDialog(target.getAttribute("data-volunteer-id"));return;}if(action==="open-edit-volunteer"){openEditVolunteerDialog(target.getAttribute("data-volunteer-id"));return;}if(action==="claim-volunteer"){await onClaimVolunteer(target.getAttribute("data-volunteer-id"));return;}if(action==="set-commitment"){await onSetCommitment(target.getAttribute("data-session-id"),target.getAttribute("data-status"));return;}if(action==="nudge-session"){await copySessionNudge(target.getAttribute("data-session-id"));return;}if(action==="nudge-volunteer"){await copyVolunteerNudge(target.getAttribute("data-volunteer-id"));return;}if(action==="open-attendance"){openAttendanceDialog(target.getAttribute("data-session-id"));}}

async function onSendLink(){if(!state.supabase){setStatus(el.authStatus,"Connect backend first.","err");return;}const email=String(el.emailInput.value||"").trim().toLowerCase();if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setStatus(el.authStatus,"Enter a valid email.","err");return;}const allowedDomain=normalizeDomain(safeGet(STORAGE.domain)||"");if(allowedDomain&&!email.endsWith("@"+allowedDomain)){setStatus(el.authStatus,"Email must end with @"+allowedDomain,"err");return;}el.sendLinkBtn.disabled=true;try{const redirectTo=window.location.origin+window.location.pathname;const {error}=await state.supabase.auth.signInWithOtp({email,options:{emailRedirectTo:redirectTo,shouldCreateUser:true}});if(error){setStatus(el.authStatus,"Login failed: "+errorText(error,"Unknown error"),"err");return;}setStatus(el.authStatus,"Login link sent. Open it in this same browser.","ok");}catch(error){setStatus(el.authStatus,errorText(error,"Login failed"),"err");}finally{el.sendLinkBtn.disabled=false;}}

function openReportDialog(volunteerId){if(!state.user){setBackendStatus("Sign in first.","err");return;}const volunteer=state.volunteers.find(row=>String(row.id)===String(volunteerId));if(!volunteer)return;clearStatus(el.reportStatus);el.reportForm.reset();el.reportVolunteerIdInput.value=String(volunteer.id);const sessions=pastSessionsForVolunteer(volunteer.id);el.reportSessionSelect.innerHTML='<option value="">No specific session</option>'+sessions.map(session=>'<option value="'+esc(session.id)+'">'+esc(session.title||"Session")+' • '+esc(formatDate(session.starts_at))+'</option>').join('');openDialog(el.reportDialog);}
async function onSubmitReport(event){event.preventDefault();clearStatus(el.reportStatus);const volunteerId=String(el.reportVolunteerIdInput.value||"").trim();const sessionIdRaw=String(el.reportSessionSelect.value||"").trim();const reason=String(el.reportReasonSelect.value||"").trim();const details=String(el.reportDetailsInput.value||"").trim();if(!volunteerId){setStatus(el.reportStatus,"Volunteer required.","err");return;}if(!reason){setStatus(el.reportStatus,"Select a reason.","err");return;}if(details.length<5){setStatus(el.reportStatus,"Add a bit more detail.","err");return;}el.submitReportBtn.disabled=true;const label=el.submitReportBtn.textContent;el.submitReportBtn.textContent="Submitting...";try{const response=await rpc("ops_submit_report",{p_session_id:sessionIdRaw||null,p_volunteer_id:volunteerId,p_reason:reason,p_details:details},25000);if(response.error){setStatus(el.reportStatus,errorText(response.error,"Submit failed"),"err");return;}setBackendStatus("Report submitted.","ok");if(el.reportDialog.open)el.reportDialog.close();}finally{el.submitReportBtn.disabled=false;el.submitReportBtn.textContent=label||"Submit Report";}}
function openEditVolunteerDialog(volunteerId){const volunteer=state.volunteers.find(row=>String(row.id)===String(volunteerId));if(!volunteer)return;const canEdit=isAdmin()||(state.user&&String(volunteer.owner_user_id||"")===String(state.user.id));if(!canEdit){setBackendStatus("Only owner or admin can edit this profile.","err");return;}clearStatus(el.editVolunteerStatus);el.editVolunteerForm.reset();el.editVolunteerIdInput.value=String(volunteer.id);el.editVolunteerNameInput.value=String(volunteer.display_name||"");el.editVolunteerTaglineInput.value=String(volunteer.tagline||"");el.editVolunteerBioInput.value=String(volunteer.bio||"");openDialog(el.editVolunteerDialog);}
async function onSaveVolunteerProfile(event){event.preventDefault();clearStatus(el.editVolunteerStatus);const volunteerId=String(el.editVolunteerIdInput.value||"").trim();const name=String(el.editVolunteerNameInput.value||"").trim();const tagline=String(el.editVolunteerTaglineInput.value||"").trim();const bio=String(el.editVolunteerBioInput.value||"").trim();if(!volunteerId){setStatus(el.editVolunteerStatus,"Volunteer missing.","err");return;}if(name.length<2){setStatus(el.editVolunteerStatus,"Name must be at least 2 characters.","err");return;}el.saveVolunteerProfileBtn.disabled=true;const label=el.saveVolunteerProfileBtn.textContent;el.saveVolunteerProfileBtn.textContent="Saving...";try{const response=await rpc("ops_update_volunteer_profile",{p_volunteer_id:volunteerId,p_display_name:name,p_tagline:tagline||null,p_bio:bio||null},25000);if(response.error){setStatus(el.editVolunteerStatus,errorText(response.error,"Save failed"),"err");return;}await loadAllData();renderAll();setBackendStatus("Volunteer profile updated.","ok");if(el.editVolunteerDialog.open)el.editVolunteerDialog.close();}finally{el.saveVolunteerProfileBtn.disabled=false;el.saveVolunteerProfileBtn.textContent=label||"Save Changes";}}
function openAttendanceDialog(sessionId){if(!isAdmin()){setBackendStatus("Admin role required.","err");return;}const session=sessionById(sessionId);if(!session)return;state.attendanceSessionId=String(session.id);el.attendanceTitle.textContent="Mark Attendance • "+String(session.title||"Session");clearStatus(el.attendanceStatus);const volunteerIds=assignedVolunteerIds(session.id);const volunteers=volunteerIds.map(id=>state.volunteers.find(row=>String(row.id)===String(id))).filter(Boolean);if(!volunteers.length){el.attendanceRows.innerHTML='<div class="empty">No assigned volunteers for this session.</div>';openDialog(el.attendanceDialog);return;}el.attendanceRows.innerHTML=volunteers.map(volunteer=>{const row=attendanceFor(volunteer.id,session.id);const currentOutcome=row?String(row.outcome||""):"";const note=row?String(row.note||""):"";return['<article class="att" data-att-volunteer="'+esc(volunteer.id)+'">','<div><p class="headline">'+esc(volunteer.display_name||"Volunteer")+'</p></div>','<select class="att-outcome">','<option value="">Skip</option>','<option value="showed_up"'+(currentOutcome==="showed_up"?" selected":"")+'>Showed up</option>','<option value="late"'+(currentOutcome==="late"?" selected":"")+'>Late</option>','<option value="no_show"'+(currentOutcome==="no_show"?" selected":"")+'>No-show</option>','<option value="excused"'+(currentOutcome==="excused"?" selected":"")+'>Excused</option>','</select>','<input class="att-note" type="text" maxlength="400" placeholder="Optional note" value="'+esc(note)+'" />','</article>'].join('');}).join('');openDialog(el.attendanceDialog);}
async function onSubmitAttendance(event){event.preventDefault();clearStatus(el.attendanceStatus);if(!state.attendanceSessionId){setStatus(el.attendanceStatus,"No session selected.","err");return;}const rows=Array.from(el.attendanceRows.querySelectorAll("[data-att-volunteer]"));const calls=[];rows.forEach(row=>{const volunteerId=row.getAttribute("data-att-volunteer");const outcome=String((row.querySelector(".att-outcome")||{}).value||"").trim();const note=String((row.querySelector(".att-note")||{}).value||"").trim();if(!outcome)return;calls.push(rpc("ops_mark_attendance",{p_session_id:state.attendanceSessionId,p_volunteer_id:volunteerId,p_outcome:outcome,p_note:note||null},25000));});if(!calls.length){setStatus(el.attendanceStatus,"No attendance updates selected.","warn");return;}el.saveAttendanceBtn.disabled=true;const label=el.saveAttendanceBtn.textContent;el.saveAttendanceBtn.textContent="Saving...";try{const responses=await Promise.all(calls);const failed=responses.find(response=>response.error);if(failed){setStatus(el.attendanceStatus,errorText(failed.error,"Attendance save failed"),"err");return;}await loadAllData();renderAll();setBackendStatus("Attendance updated.","ok");if(el.attendanceDialog.open)el.attendanceDialog.close();}finally{el.saveAttendanceBtn.disabled=false;el.saveAttendanceBtn.textContent=label||"Save Attendance";}}
async function onClaimVolunteer(volunteerId){if(!state.user||!state.supabase){setBackendStatus("Sign in first.","err");return;}const response=await rpc("ops_claim_volunteer",{p_volunteer_id:volunteerId},25000);if(response.error){setBackendStatus(errorText(response.error,"Claim failed"),"err");return;}await refreshSession();await loadAllData();renderAll();setBackendStatus("Volunteer profile claimed.","ok");}
async function onSetCommitment(sessionId,status){if(!state.user||!state.supabase){setBackendStatus("Sign in first.","err");return;}const response=await rpc("ops_set_commitment",{p_session_id:sessionId,p_status:status,p_note:null},25000);if(response.error){setBackendStatus(errorText(response.error,"Commitment update failed"),"err");return;}await loadAllData();renderAll();setBackendStatus("Availability updated.","ok");}
async function copySessionNudge(sessionId){const session=sessionById(sessionId);if(!session)return;const coverage=sessionCoverageRow(session);if(!coverage.pendingIds.length){setBackendStatus("No pending volunteers for this session.","ok");return;}const names=coverage.pendingIds.map(id=>{const volunteer=state.volunteers.find(row=>String(row.id)===String(id));return volunteer?volunteer.display_name:null;}).filter(Boolean);const text="Hi team - quick check for "+(session.title||"session")+" on "+formatDateTime(session.starts_at)+". Please confirm availability in Volunteer Ops today."+(names.length?" Pending: "+names.join(", ")+".":"");await copyText(text,"Session nudge copied.");}
async function copyVolunteerNudge(volunteerId){const volunteer=state.volunteers.find(row=>String(row.id)===String(volunteerId));if(!volunteer)return;const upcoming=upcomingSessionsForVolunteer(volunteer.id).slice(0,3);const sessionText=upcoming.length?upcoming.map(session=>(session.title||"Session")+" ("+formatDate(session.starts_at)+")").join(", "):"your upcoming sessions";const text="Hi "+(volunteer.display_name||"there")+" - please confirm availability for "+sessionText+" in Volunteer Ops. Reliable responses help us run stronger chess sessions.";await copyText(text,"Volunteer nudge copied.");}
async function copyText(text,successMessage){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error("Clipboard unavailable");await navigator.clipboard.writeText(text);setBackendStatus(successMessage,"ok");}catch(_error){setBackendStatus("Copy failed. Message: "+text,"warn");}}
async function rpc(name,params,timeoutMs){if(!state.supabase)return{data:null,error:new Error("Backend not connected.")};try{const response=await withTimeout(state.supabase.rpc(name,params||{}),Number(timeoutMs||30000),name+" timed out");return response||{data:null,error:new Error("No response from server.")};}catch(error){return{data:null,error};}}
function upcomingSessions(){const now=Date.now()-7200000;return state.sessions.filter(session=>new Date(session.starts_at).getTime()>=now&&String(session.status||"scheduled")!=="cancelled").sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));}
function pastSessionsForVolunteer(volunteerId){const now=Date.now();return state.sessions.filter(session=>new Date(session.starts_at).getTime()<=now).filter(session=>assignedVolunteerIds(session.id).includes(String(volunteerId))).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));}
function upcomingSessionsForVolunteer(volunteerId){const now=Date.now()-7200000;return state.sessions.filter(session=>new Date(session.starts_at).getTime()>=now&&String(session.status||"scheduled")!=="cancelled").filter(session=>assignedVolunteerIds(session.id).includes(String(volunteerId))).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));}
function sessionCoverageRow(session){const volunteerIds=assignedVolunteerIds(session.id);const assigned=volunteerIds.length;const required=Math.max(1,Number(session.required_volunteers||2));let committed=0;let responded=0;const pendingIds=[];volunteerIds.forEach(volunteerId=>{const commitment=commitmentFor(volunteerId,session.id);const status=commitment?String(commitment.status||""):"";if(status==="committed")committed+=1;if(status==="committed"||status==="unavailable")responded+=1;if(!status)pendingIds.push(String(volunteerId));});return{id:String(session.id),title:String(session.title||"Session"),starts_at:session.starts_at,assigned,required,committed,responded,gap:Math.max(0,required-committed),pendingIds};}
function assignedVolunteerIds(sessionId){return Array.from(new Set(state.assignments.filter(row=>String(row.session_id)===String(sessionId)).map(row=>String(row.volunteer_id))));}
function commitmentFor(volunteerId,sessionId){const rows=state.commitments.filter(row=>String(row.volunteer_id)===String(volunteerId)&&String(row.session_id)===String(sessionId)).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0));return rows[0]||null;}
function attendanceFor(volunteerId,sessionId){const rows=state.attendance.filter(row=>String(row.volunteer_id)===String(volunteerId)&&String(row.session_id)===String(sessionId)).sort((a,b)=>new Date(b.marked_at||0)-new Date(a.marked_at||0));return rows[0]||null;}
function feedbackForVolunteer(volunteerId){return state.feedback.filter(row=>String(row.volunteer_id)===String(volunteerId)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));}
function metricFor(volunteerId){return state.metricsByVolunteer[String(volunteerId)]||{volunteer_id:volunteerId,avg_rating:0,feedback_count:0,assigned_upcoming:0,responded_upcoming:0,committed_upcoming:0,response_rate_pct:0,attendance_rate_pct:0,no_show_90d:0,reliability_score:0,at_risk:false};}
function sessionById(sessionId){return state.sessions.find(row=>String(row.id)===String(sessionId))||null;}
function isAdmin(){return Boolean(state.profile&&state.profile.role==="admin"&&state.profile.status==="approved");}
function isApprovedMember(){return Boolean(state.profile&&state.profile.status==="approved");}
function myVolunteerId(){return state.profile&&state.profile.volunteer_id?String(state.profile.volunteer_id):null;}
function metricBox(label,value){return '<article class="metric"><div class="k">'+esc(label)+'</div><div class="v">'+esc(value)+'</div></article>';}
function openDialog(node){if(!node||typeof node.showModal!=="function")return;if(!node.open)node.showModal();}
function setBackendStatus(text,type){setStatus(el.backendStatus,text,type);}function setStatus(node,text,type){if(!node)return;node.textContent=text||"";node.className="status"+(type?" "+type:"");}function clearStatus(node){if(!node)return;node.textContent="";node.className="status";}
function normalizeDomain(value){return String(value||"").trim().toLowerCase().replace(/^@/,"");}
function safeSet(key,value){try{localStorage.setItem(key,value);}catch(_error){}}
function safeGet(key){try{return localStorage.getItem(key);}catch(_error){return null;}}
function looksLikeMissingSetup(message){const text=String(message||"").toLowerCase();if(!/ops_/.test(text)&&!/relation .* does not exist|schema cache|undefined function|function .* does not exist|no function matches/.test(text))return false;return /does not exist|schema cache|undefined function|not found|no function matches/.test(text);}
function errorText(error,fallback){if(!error)return fallback||"Error";if(typeof error==="string")return error;if(error.message)return String(error.message);return fallback||"Error";}
function withTimeout(promise,ms,timeoutMessage){let timeoutId=null;const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error(timeoutMessage||"Timed out")),Math.max(1000,Number(ms||30000)));});return Promise.race([promise,timeout]).finally(()=>{if(timeoutId)clearTimeout(timeoutId);});}
function mean(values){if(!values.length)return 0;const numbers=values.map(row=>Number(row||0)).filter(row=>isFinite(row)&&row>0);if(!numbers.length)return 0;return numbers.reduce((sum,value)=>sum+value,0)/numbers.length;}
function stars(rating){const rounded=Math.max(0,Math.min(5,Math.round(Number(rating||0))));return "★".repeat(rounded)+"☆".repeat(5-rounded);}function initials(name){const parts=String(name||"").trim().split(/\s+/).filter(Boolean);if(!parts.length)return"V";const first=parts[0].charAt(0)||"";const last=parts.length>1?parts[parts.length-1].charAt(0):"";return(first+last).toUpperCase()||"V";}
function toDatetimeLocal(date){const local=new Date(date.getTime()-(date.getTimezoneOffset()*60000));return local.toISOString().slice(0,16);}function formatDate(iso){const date=new Date(iso);if(!isFinite(date.getTime()))return"Unknown";return date.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});}
function formatDateTime(iso){const date=new Date(iso);if(!isFinite(date.getTime()))return"Unknown";return date.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}
function esc(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");}
})();
</script>
